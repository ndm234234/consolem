  <script type="application/json" id="slideContent">[{"id":"serverless-vms","title":{"ru":"Бессерверная VMS","en":"Serverless VMS"},"html":{"ru":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ru\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>w2c Platform — Serverless VMS на камерах и сетевых хранилищах\u003c/title>\n  \u003cstyle>\n    :root {\n      --bg: #0b1020;\n      --bg-card: #131b33;\n      --bg-card-alt: #172240;\n      --border: #26355d;\n      --accent-cyan: #38bdf8;\n      --accent-emerald: #34d399;\n      --accent-indigo: #818cf8;\n      --accent-amber: #fbbf24;\n      --accent-rose: #fb7185;\n      --text-main: #f8fafc;\n      --text-muted: #94a3b8;\n      --text-dim: #64748b;\n    }\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n    body {\n      background: #060913;\n      color: var(--text-main);\n      font-family: -apple-system, BlinkMacSystemFont, \"Inter\", \"Segoe UI\", Roboto, sans-serif;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      padding: 24px;\n    }\n    .slide {\n      width: 1600px;\n      height: 900px;\n      background: radial-gradient(circle at 18% 18%, rgba(52, 211, 153, 0.10), transparent 45%),\n                  radial-gradient(circle at 82% 82%, rgba(129, 140, 248, 0.10), transparent 45%),\n                  var(--bg);\n      border: 1px solid var(--border);\n      border-radius: 20px;\n      padding: 42px 54px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);\n      position: relative;\n      overflow: hidden;\n    }\n\n    /* Header */\n    .header {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      border-bottom: 1px solid var(--border);\n      padding-bottom: 18px;\n    }\n    .badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      background: rgba(52, 211, 153, 0.12);\n      border: 1px solid rgba(52, 211, 153, 0.35);\n      color: var(--accent-emerald);\n      font-size: 13px;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      padding: 5px 12px;\n      border-radius: 999px;\n      margin-bottom: 10px;\n    }\n    .title {\n      font-size: 33px;\n      font-weight: 800;\n      letter-spacing: -0.02em;\n      line-height: 1.15;\n    }\n    .subtitle {\n      font-size: 16.5px;\n      color: var(--text-muted);\n      margin-top: 6px;\n    }\n    .key-metric-box {\n      display: flex;\n      gap: 14px;\n    }\n    .metric {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 12px;\n      padding: 11px 16px;\n      text-align: right;\n      min-width: 145px;\n    }\n    .metric-val {\n      font-size: 22px;\n      font-weight: 800;\n      color: var(--accent-cyan);\n    }\n    .metric-val.emerald {\n      color: var(--accent-emerald);\n    }\n    .metric-val.amber {\n      color: var(--accent-amber);\n    }\n    .metric-lbl {\n      font-size: 11.5px;\n      color: var(--text-muted);\n      margin-top: 2px;\n    }\n\n    /* Topology Diagram Strip */\n    .topology {\n      background: linear-gradient(90deg, rgba(19,27,51,0.95), rgba(23,34,64,0.95));\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 18px 24px;\n      display: grid;\n      grid-template-columns: 1.25fr 0.7fr 1.2fr 0.7fr 1.25fr;\n      align-items: center;\n      gap: 12px;\n    }\n    .topo-box {\n      background: rgba(11, 16, 32, 0.78);\n      border: 1px solid var(--border);\n      border-radius: 12px;\n      padding: 14px 16px;\n    }\n    .topo-box.holder {\n      border-color: rgba(52, 211, 153, 0.55);\n    }\n    .topo-box.fleet {\n      border-color: rgba(129, 140, 248, 0.55);\n    }\n    .topo-box.storage {\n      border-color: rgba(56, 189, 248, 0.55);\n    }\n    .topo-head {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      font-size: 14.5px;\n      font-weight: 700;\n      margin-bottom: 6px;\n    }\n    .topo-pill {\n      font-size: 10.5px;\n      font-weight: 700;\n      padding: 2px 8px;\n      border-radius: 99px;\n      text-transform: uppercase;\n    }\n    .pill-green {\n      background: rgba(52, 211, 153, 0.16);\n      color: var(--accent-emerald);\n    }\n    .pill-indigo {\n      background: rgba(129, 140, 248, 0.16);\n      color: var(--accent-indigo);\n    }\n    .pill-cyan {\n      background: rgba(56, 189, 248, 0.16);\n      color: var(--accent-cyan);\n    }\n    .topo-list {\n      list-style: none;\n      font-size: 12.2px;\n      color: var(--text-muted);\n      line-height: 1.45;\n    }\n    .topo-list li::before {\n      content: \"▸ \";\n      color: var(--accent-cyan);\n    }\n    .topo-link {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      text-align: center;\n      gap: 5px;\n    }\n    .topo-line {\n      width: 100%;\n      height: 3px;\n      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-indigo), var(--accent-cyan));\n      border-radius: 2px;\n      position: relative;\n    }\n    .topo-link-title {\n      font-size: 11.5px;\n      font-weight: 700;\n      color: var(--text-main);\n    }\n    .topo-link-sub {\n      font-size: 10.8px;\n      color: var(--text-muted);\n      line-height: 1.3;\n    }\n    .no-raft-badge {\n      font-size: 10.5px;\n      font-weight: 700;\n      color: var(--accent-amber);\n      background: rgba(251, 191, 36, 0.12);\n      border: 1px solid rgba(251, 191, 36, 0.35);\n      padding: 2px 8px;\n      border-radius: 6px;\n    }\n\n    /* 6 Pillars Grid */\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 18px;\n    }\n    .card {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 19px 22px;\n      display: flex;\n      flex-direction: column;\n      gap: 9px;\n    }\n    .card-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n    .card-num {\n      font-size: 11.5px;\n      font-weight: 800;\n      padding: 4px 9px;\n      border-radius: 6px;\n      background: rgba(52, 211, 153, 0.14);\n      color: var(--accent-emerald);\n      letter-spacing: 0.04em;\n    }\n    .card-scope {\n      font-size: 11px;\n      color: var(--text-dim);\n      font-weight: 600;\n      text-transform: uppercase;\n      letter-spacing: 0.05em;\n    }\n    .card-title {\n      font-size: 16.8px;\n      font-weight: 700;\n      color: var(--text-main);\n      line-height: 1.25;\n    }\n    .card-body {\n      font-size: 13px;\n      color: var(--text-muted);\n      line-height: 1.48;\n    }\n    .card-body strong {\n      color: #e2e8f0;\n      font-weight: 600;\n    }\n    .code-pill {\n      font-family: \"JetBrains Mono\", \"SFMono-Regular\", Menlo, monospace;\n      font-size: 11.2px;\n      background: rgba(15, 23, 42, 0.85);\n      border: 1px solid rgba(148, 163, 184, 0.22);\n      color: var(--accent-amber);\n      padding: 1px 6px;\n      border-radius: 4px;\n    }\n\n    /* Footer */\n    .footer {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      border-top: 1px solid var(--border);\n      padding-top: 14px;\n      font-size: 13px;\n      color: var(--text-muted);\n    }\n    .footer-highlight {\n      color: var(--accent-cyan);\n      font-weight: 600;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"slide\">\n    \u003c!-- HEADER -->\n    \u003cdiv class=\"header\">\n      \u003cdiv>\n        \u003cdiv class=\"badge\">Serverless VMS • Архитектура распределённого края\u003c/div>\n        \u003cdiv class=\"title\">Камера w2c как самодостаточная VMS в сети сотен устройств и хранилищ\u003c/div>\n        \u003cdiv class=\"subtitle\">Тот же код платформы на камере, без выделенного сервера управления и без хрупкого консенсуса поперёк сети\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"key-metric-box\">\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val emerald\">≤ 40 МиБ\u003c/div>\n          \u003cdiv class=\"metric-lbl\">бюджет памяти камеры (33,7 МиБ на 10 Мбит/с)\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">1,4 сек\u003c/div>\n          \u003cdiv class=\"metric-lbl\">опрос 300 камер (даже когда 30 выключены)\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val amber\">0 серверов\u003c/div>\n          \u003cdiv class=\"metric-lbl\">домен живёт прямо на камере со сменой срока\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- TOPOLOGY STRIP -->\n    \u003cdiv class=\"topology\">\n      \u003cdiv class=\"topo-box holder\">\n        \u003cdiv class=\"topo-head\">\n          \u003cspan>Камера — Держатель домена\u003c/span>\n          \u003cspan class=\"topo-pill pill-green\">Domain Holder\u003c/span>\n        \u003c/div>\n        \u003cul class=\"topo-list\">\n          \u003cli>Ведёт единый каталог, права, \u003cspan class=\"code-pill\">shared\u003c/span>-настройки и тревоги\u003c/li>\n          \u003cli>Выпускает токены (\u003cspan class=\"code-pill\">w2c-domain\u003c/span>) и считает книги маршрутов\u003c/li>\n          \u003cli>Раздаёт подписанный бэкап \u003cspan class=\"code-pill\">keepers\u003c/span> на 2 камеры-хранителя\u003c/li>\n          \u003cli>При отказе/краже домен переносится на любую камеру (\u003cspan class=\"code-pill\">term+1\u003c/span>)\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-link\">\n        \u003cdiv class=\"topo-link-title\">Федерация без Raft\u003c/div>\n        \u003cdiv class=\"topo-line\">\u003c/div>\n        \u003cdiv class=\"topo-link-sub\">Дельта-отчёты ~600 Б\u003cbr/>Книги и отложенные правки\u003c/div>\n        \u003cdiv class=\"no-raft-badge\">Без консенсуса по PoE/WAN\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-box fleet\">\n        \u003cdiv class=\"topo-head\">\n          \u003cspan>Сотни камер («Кластер из 1»)\u003c/span>\n          \u003cspan class=\"topo-pill pill-indigo\">300+ Edge Nodes\u003c/span>\n        \u003c/div>\n        \u003cul class=\"topo-list\">\n          \u003cli>Каждая камера — свой \u003cspan class=\"code-pill\">DeviceCluster\u003c/span> (1 флеш = 1 писатель)\u003c/li>\n          \u003cli>Публикует только 2 объекта: \u003cspan class=\"code-pill\">heartbeats\u003c/span> и \u003cspan class=\"code-pill\">snapshot\u003c/span>\u003c/li>\n          \u003cli>Пишет кольцевой буфер и сегменты на SD-карту без движка БД\u003c/li>\n          \u003cli>Бережёт Flash: пульсы и свежесть в RAM, 0 записей в тишине\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-link\">\n        \u003cdiv class=\"topo-link-title\">Сверка покрытий\u003c/div>\n        \u003cdiv class=\"topo-line\">\u003c/div>\n        \u003cdiv class=\"topo-link-sub\">Прямая запись + Backfill дыр\u003cbr/>По готовности аплинка\u003c/div>\n        \u003cdiv class=\"no-raft-badge\">desired − actual = gaps\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-box storage\">\n        \u003cdiv class=\"topo-head\">\n          \u003cspan>Сетевые хранилища / NAS / S3 / NVR\u003c/span>\n          \u003cspan class=\"topo-pill pill-cyan\">Elastic Archive\u003c/span>\n        \u003c/div>\n        \u003cul class=\"topo-list\">\n          \u003cli>Тома архива на сетевых дисках, NVR или в облаке (\u003cspan class=\"code-pill\">s3://\u003c/span>)\u003c/li>\n          \u003cli>Камера сама толкает поток на доступный приёмник хранилища\u003c/li>\n          \u003cli>После обрыва сети хранилище забирает с SD \u003cstrong>только дыру\u003c/strong>\u003c/li>\n          \u003cli>Единый таймлайн: \u003cspan class=\"code-pill\">&lt;rec&gt;/e&lt;n&gt;\u003c/span> и \u003cspan class=\"code-pill\">…/backfill\u003c/span>\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6 PILLARS GRID -->\n    \u003cdiv class=\"grid\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">01 • CLUSTER OF ONE\u003c/span>\n          \u003cspan class=\"card-scope\">Архитектура узла\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Камера — полноценный кластер из одного, а не «тупой поток»\u003c/div>\n        \u003cdiv class=\"card-body\">\n          На камере работает тот же код платформы, что и в серверной: своя консоль, эпоха, проверка грантов и локальный буфер. Консенсус внутри камеры достаётся даром (\u003cstrong>один флеш — один писатель\u003c/strong>), поэтому не нужен распределённый Raft между камерами поверх ненадёжного PoE или радиоканала.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">02 • ZERO-SERVER DOMAIN\u003c/span>\n          \u003cspan class=\"card-scope\">Отказоустойчивое управление\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Держатель домена на камере и мгновенный переезд по сроку\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Службы домена живут прямо на одной из камер площадки, а подписанная и зашифрованная резервная копия (\u003cspan class=\"code-pill\">domain/backup-taken\u003c/span>) автоматически разносится агентами на камеры-хранители. Если «главную» камеру сняли или выключили, домен поднимается на соседней со сроком \u003cspan class=\"code-pill\">term + 1\u003c/span> — \u003cstrong>без потери настроек, прав и очередей\u003c/strong>.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">03 • EDGE + NETWORK STORAGE\u003c/span>\n          \u003cspan class=\"card-scope\">Гибридный архив\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Сетевые хранилища и SD-карты как единый самовосстанавливающийся том\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Камера пишет в локальное кольцо (32 МиБ RAM) и сегменты SD-карты, одновременно отдавая поток в сетевое хранилище. При падении сети или диска запись не прерывается: после возврата связи цикл сверки (\u003cspan class=\"code-pill\">desired − actual\u003c/span>) \u003cstrong>выкачивает с камеры ровно пропущенные интервалы\u003c/strong> по готовности канала.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">04 • SCALE TO HUNDREDS\u003c/span>\n          \u003cspan class=\"card-scope\">Масштабируемость\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Сотни камер и десятки выключенных узлов без деградации\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Контракт камеры с доменом — всего \u003cstrong>~600 байт\u003c/strong> (\u003cspan class=\"code-pill\">heartbeats\u003c/span> + \u003cspan class=\"code-pill\">snapshot\u003c/span>). Параллельные полосы опроса (\u003cspan class=\"code-pill\">lanes=16\u003c/span>), поиск \u003cspan class=\"code-pill\">ReadView.where\u003c/span> из памяти за \u003cstrong>0 сетевых вызовов\u003c/strong> и экспоненциальное отступление молчащих камер укладывают обход 300 кластеров (30 в офлайне) в \u003cstrong>1,4 секунды\u003c/strong>.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">05 • FLASH &amp; RAM DISCIPLINE\u003c/span>\n          \u003cspan class=\"card-scope\">Ресурсы встроенного Linux\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Жёсткий потолок 40 МиБ RAM и нулевой износ Flash-памяти\u003c/div>\n        \u003cdiv class=\"card-body\">\n          На камере нет тяжёлой СУБД: память под кадры строго поделена (32 МиБ кольцо, 6 МиБ очередь карты, 2×1 МиБ куски отдачи — \u003cstrong>33,7 МиБ в пике догона\u003c/strong>). Пульсы и отметки свежести держатся в RAM; ключи потоков перевыпускаются на полусроке (раз в 12 ч), а неизменный бэкап не пишет на флеш вообще.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">06 • OFFLINE EDITS &amp; HONEST VIEW\u003c/span>\n          \u003cspan class=\"card-scope\">Эксплуатация в поле\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Отложенные правки для выключенных камер и честный каталог\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Оператор меняет настройки или права даже тогда, когда часть камер обесточена: домен сохраняет правку в \u003cspan class=\"code-pill\">domain/pending/&lt;член&gt;\u003c/span>, и агент камеры сам забирает и применяет её после включения. Каталог никогда не путает «нет данных» с «устройство недоступно», явно показывая возраст последнего отчёта.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- FOOTER -->\n    \u003cdiv class=\"footer\">\n      \u003cdiv>\u003cstrong>Экономика развёртывания:\u003c/strong> от 1 автономной камеры с SD-картой до распределённой сети из сотен камер, ретрансляторов и сетевых томов — без единого выделенного сервера VMS.\u003c/div>\n      \u003cdiv class=\"footer-highlight\">w2c Platform • Serverless Edge &amp; Distributed Storage (М10B / М12A / М12B)\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n","en":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>w2c Platform — Serverless VMS Across Cameras &amp; Network Storage\u003c/title>\n  \u003cstyle>\n    :root {\n      --bg: #0b1020;\n      --bg-card: #131b33;\n      --bg-card-alt: #172240;\n      --border: #26355d;\n      --accent-cyan: #38bdf8;\n      --accent-emerald: #34d399;\n      --accent-indigo: #818cf8;\n      --accent-amber: #fbbf24;\n      --accent-rose: #fb7185;\n      --text-main: #f8fafc;\n      --text-muted: #94a3b8;\n      --text-dim: #64748b;\n    }\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n    body {\n      background: #060913;\n      color: var(--text-main);\n      font-family: -apple-system, BlinkMacSystemFont, \"Inter\", \"Segoe UI\", Roboto, sans-serif;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      padding: 24px;\n    }\n    .slide {\n      width: 1600px;\n      height: 900px;\n      background: radial-gradient(circle at 18% 18%, rgba(52, 211, 153, 0.10), transparent 45%),\n                  radial-gradient(circle at 82% 82%, rgba(129, 140, 248, 0.10), transparent 45%),\n                  var(--bg);\n      border: 1px solid var(--border);\n      border-radius: 20px;\n      padding: 42px 54px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);\n      position: relative;\n      overflow: hidden;\n    }\n\n    /* Header */\n    .header {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      border-bottom: 1px solid var(--border);\n      padding-bottom: 18px;\n    }\n    .badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      background: rgba(52, 211, 153, 0.12);\n      border: 1px solid rgba(52, 211, 153, 0.35);\n      color: var(--accent-emerald);\n      font-size: 13px;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      padding: 5px 12px;\n      border-radius: 999px;\n      margin-bottom: 10px;\n    }\n    .title {\n      font-size: 33px;\n      font-weight: 800;\n      letter-spacing: -0.02em;\n      line-height: 1.15;\n    }\n    .subtitle {\n      font-size: 16.5px;\n      color: var(--text-muted);\n      margin-top: 6px;\n    }\n    .key-metric-box {\n      display: flex;\n      gap: 14px;\n    }\n    .metric {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 12px;\n      padding: 11px 16px;\n      text-align: right;\n      min-width: 145px;\n    }\n    .metric-val {\n      font-size: 22px;\n      font-weight: 800;\n      color: var(--accent-cyan);\n    }\n    .metric-val.emerald {\n      color: var(--accent-emerald);\n    }\n    .metric-val.amber {\n      color: var(--accent-amber);\n    }\n    .metric-lbl {\n      font-size: 11.5px;\n      color: var(--text-muted);\n      margin-top: 2px;\n    }\n\n    /* Topology Diagram Strip */\n    .topology {\n      background: linear-gradient(90deg, rgba(19,27,51,0.95), rgba(23,34,64,0.95));\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 18px 24px;\n      display: grid;\n      grid-template-columns: 1.25fr 0.7fr 1.2fr 0.7fr 1.25fr;\n      align-items: center;\n      gap: 12px;\n    }\n    .topo-box {\n      background: rgba(11, 16, 32, 0.78);\n      border: 1px solid var(--border);\n      border-radius: 12px;\n      padding: 14px 16px;\n    }\n    .topo-box.holder {\n      border-color: rgba(52, 211, 153, 0.55);\n    }\n    .topo-box.fleet {\n      border-color: rgba(129, 140, 248, 0.55);\n    }\n    .topo-box.storage {\n      border-color: rgba(56, 189, 248, 0.55);\n    }\n    .topo-head {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      font-size: 14.5px;\n      font-weight: 700;\n      margin-bottom: 6px;\n    }\n    .topo-pill {\n      font-size: 10.5px;\n      font-weight: 700;\n      padding: 2px 8px;\n      border-radius: 99px;\n      text-transform: uppercase;\n    }\n    .pill-green {\n      background: rgba(52, 211, 153, 0.16);\n      color: var(--accent-emerald);\n    }\n    .pill-indigo {\n      background: rgba(129, 140, 248, 0.16);\n      color: var(--accent-indigo);\n    }\n    .pill-cyan {\n      background: rgba(56, 189, 248, 0.16);\n      color: var(--accent-cyan);\n    }\n    .topo-list {\n      list-style: none;\n      font-size: 12.2px;\n      color: var(--text-muted);\n      line-height: 1.45;\n    }\n    .topo-list li::before {\n      content: \"▸ \";\n      color: var(--accent-cyan);\n    }\n    .topo-link {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      text-align: center;\n      gap: 5px;\n    }\n    .topo-line {\n      width: 100%;\n      height: 3px;\n      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-indigo), var(--accent-cyan));\n      border-radius: 2px;\n      position: relative;\n    }\n    .topo-link-title {\n      font-size: 11.5px;\n      font-weight: 700;\n      color: var(--text-main);\n    }\n    .topo-link-sub {\n      font-size: 10.8px;\n      color: var(--text-muted);\n      line-height: 1.3;\n    }\n    .no-raft-badge {\n      font-size: 10.5px;\n      font-weight: 700;\n      color: var(--accent-amber);\n      background: rgba(251, 191, 36, 0.12);\n      border: 1px solid rgba(251, 191, 36, 0.35);\n      padding: 2px 8px;\n      border-radius: 6px;\n    }\n\n    /* 6 Pillars Grid */\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 18px;\n    }\n    .card {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 19px 22px;\n      display: flex;\n      flex-direction: column;\n      gap: 9px;\n    }\n    .card-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n    .card-num {\n      font-size: 11.5px;\n      font-weight: 800;\n      padding: 4px 9px;\n      border-radius: 6px;\n      background: rgba(52, 211, 153, 0.14);\n      color: var(--accent-emerald);\n      letter-spacing: 0.04em;\n    }\n    .card-scope {\n      font-size: 11px;\n      color: var(--text-dim);\n      font-weight: 600;\n      text-transform: uppercase;\n      letter-spacing: 0.05em;\n    }\n    .card-title {\n      font-size: 16.8px;\n      font-weight: 700;\n      color: var(--text-main);\n      line-height: 1.25;\n    }\n    .card-body {\n      font-size: 13px;\n      color: var(--text-muted);\n      line-height: 1.48;\n    }\n    .card-body strong {\n      color: #e2e8f0;\n      font-weight: 600;\n    }\n    .code-pill {\n      font-family: \"JetBrains Mono\", \"SFMono-Regular\", Menlo, monospace;\n      font-size: 11.2px;\n      background: rgba(15, 23, 42, 0.85);\n      border: 1px solid rgba(148, 163, 184, 0.22);\n      color: var(--accent-amber);\n      padding: 1px 6px;\n      border-radius: 4px;\n    }\n\n    /* Footer */\n    .footer {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      border-top: 1px solid var(--border);\n      padding-top: 14px;\n      font-size: 13px;\n      color: var(--text-muted);\n    }\n    .footer-highlight {\n      color: var(--accent-cyan);\n      font-weight: 600;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"slide\">\n    \u003c!-- HEADER -->\n    \u003cdiv class=\"header\">\n      \u003cdiv>\n        \u003cdiv class=\"badge\">Serverless VMS • Distributed Edge Architecture\u003c/div>\n        \u003cdiv class=\"title\">w2c Camera as a Self-Sufficient VMS Across Hundreds of Devices &amp; Storages\u003c/div>\n        \u003cdiv class=\"subtitle\">The exact same platform code running on the camera — with zero dedicated management servers and no fragile WAN consensus\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"key-metric-box\">\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val emerald\">≤ 40 MiB\u003c/div>\n          \u003cdiv class=\"metric-lbl\">camera RAM budget (33.7 MiB at 10 Mbps)\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">1.4 sec\u003c/div>\n          \u003cdiv class=\"metric-lbl\">to poll 300 cameras (even with 30 offline)\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val amber\">0 Servers\u003c/div>\n          \u003cdiv class=\"metric-lbl\">domain runs on a camera with term failover\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- TOPOLOGY STRIP -->\n    \u003cdiv class=\"topology\">\n      \u003cdiv class=\"topo-box holder\">\n        \u003cdiv class=\"topo-head\">\n          \u003cspan>Camera as Domain Holder\u003c/span>\n          \u003cspan class=\"topo-pill pill-green\">Domain Holder\u003c/span>\n        \u003c/div>\n        \u003cul class=\"topo-list\">\n          \u003cli>Hosts unified directory, grants, \u003cspan class=\"code-pill\">shared\u003c/span> config &amp; alarms\u003c/li>\n          \u003cli>Issues tokens (\u003cspan class=\"code-pill\">w2c-domain\u003c/span>) &amp; computes routing books\u003c/li>\n          \u003cli>Replicates signed backup to 2 \u003cspan class=\"code-pill\">keepers\u003c/span> cameras\u003c/li>\n          \u003cli>On failure or theft, domain moves to any camera (\u003cspan class=\"code-pill\">term+1\u003c/span>)\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-link\">\n        \u003cdiv class=\"topo-link-title\">Raft-Free Federation\u003c/div>\n        \u003cdiv class=\"topo-line\">\u003c/div>\n        \u003cdiv class=\"topo-link-sub\">~600 B delta reports\u003cbr/>Config books &amp; pending edits\u003c/div>\n        \u003cdiv class=\"no-raft-badge\">No consensus across PoE/WAN\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-box fleet\">\n        \u003cdiv class=\"topo-head\">\n          \u003cspan>Hundreds of Cameras (“Cluster of 1”)\u003c/span>\n          \u003cspan class=\"topo-pill pill-indigo\">300+ Edge Nodes\u003c/span>\n        \u003c/div>\n        \u003cul class=\"topo-list\">\n          \u003cli>Each camera is its own \u003cspan class=\"code-pill\">DeviceCluster\u003c/span> (1 flash = 1 writer)\u003c/li>\n          \u003cli>Publishes just 2 objects: \u003cspan class=\"code-pill\">heartbeats\u003c/span> &amp; \u003cspan class=\"code-pill\">snapshot\u003c/span>\u003c/li>\n          \u003cli>Writes RAM ring &amp; SD segments with zero heavy DB engine\u003c/li>\n          \u003cli>Flash-friendly: heartbeats &amp; freshness in RAM, 0 writes when idle\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-link\">\n        \u003cdiv class=\"topo-link-title\">Coverage Reconciliation\u003c/div>\n        \u003cdiv class=\"topo-line\">\u003c/div>\n        \u003cdiv class=\"topo-link-sub\">Live push + Gap backfill\u003cbr/>As uplink bandwidth allows\u003c/div>\n        \u003cdiv class=\"no-raft-badge\">desired − actual = gaps\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"topo-box storage\">\n        \u003cdiv class=\"topo-head\">\n          \u003cspan>Network Storage / NAS / S3 / NVR\u003c/span>\n          \u003cspan class=\"topo-pill pill-cyan\">Elastic Archive\u003c/span>\n        \u003c/div>\n        \u003cul class=\"topo-list\">\n          \u003cli>Archive volumes on NAS, NVR, or cloud object storage (\u003cspan class=\"code-pill\">s3://\u003c/span>)\u003c/li>\n          \u003cli>Camera actively pushes streams to available storage receivers\u003c/li>\n          \u003cli>After network outage, storage pulls \u003cstrong>only missing gaps\u003c/strong> from SD\u003c/li>\n          \u003cli>Unified timeline across \u003cspan class=\"code-pill\">&lt;rec&gt;/e&lt;n&gt;\u003c/span> &amp; \u003cspan class=\"code-pill\">…/backfill\u003c/span>\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6 PILLARS GRID -->\n    \u003cdiv class=\"grid\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">01 • CLUSTER OF ONE\u003c/span>\n          \u003cspan class=\"card-scope\">Node Architecture\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Every Camera Is a Full Cluster of One — Not a “Dumb Stream”\u003c/div>\n        \u003cdiv class=\"card-body\">\n          The camera runs the same platform engine as a datacenter node: its own console, epoch, local grant verifier, and SD archive. Intra-camera consensus comes for free (\u003cstrong>one flash — one writer\u003c/strong>), eliminating any need for distributed Raft across cameras over lossy PoE or wireless links.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">02 • ZERO-SERVER DOMAIN\u003c/span>\n          \u003cspan class=\"card-scope\">Fault-Tolerant Control Plane\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Domain Holder on a Camera with Instant Term Failover\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Domain services run directly on one of the site’s cameras, while a signed and encrypted backup (\u003cspan class=\"code-pill\">domain/backup-taken\u003c/span>) is automatically replicated by agents to designated keeper cameras. If the holder camera is unplugged or stolen, any peer camera assumes the domain at \u003cspan class=\"code-pill\">term + 1\u003c/span> — \u003cstrong>preserving all settings, grants, and pending queues\u003c/strong>.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">03 • EDGE + NETWORK STORAGE\u003c/span>\n          \u003cspan class=\"card-scope\">Hybrid Archive\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Network Storages &amp; SD Cards as One Self-Healing Archive\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Each camera records into its local 32 MiB RAM ring and SD card segments while streaming to network storage volumes. When the network or NAS drops, recording never stops: once connectivity returns, the reconciliation loop (\u003cspan class=\"code-pill\">desired − actual\u003c/span>) \u003cstrong>backfills only the exact missing intervals\u003c/strong> from the camera’s SD card.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">04 • SCALE TO HUNDREDS\u003c/span>\n          \u003cspan class=\"card-scope\">Fleet Scalability\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Hundreds of Cameras &amp; Dozens Offline with Zero Degradation\u003c/div>\n        \u003cdiv class=\"card-body\">\n          A camera’s domain contract is just \u003cstrong>~600 bytes\u003c/strong> (\u003cspan class=\"code-pill\">heartbeats\u003c/span> + \u003cspan class=\"code-pill\">snapshot\u003c/span>). Parallel polling lanes (\u003cspan class=\"code-pill\">lanes=16\u003c/span>), in-memory \u003cspan class=\"code-pill\">ReadView.where\u003c/span> lookups in \u003cstrong>0 network hops\u003c/strong>, and exponential backoff for silent nodes complete a 300-camera sweep (with 30 offline) in \u003cstrong>1.4 seconds\u003c/strong>.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">05 • FLASH &amp; RAM DISCIPLINE\u003c/span>\n          \u003cspan class=\"card-scope\">Embedded Linux Footprint\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Strict 40 MiB RAM Ceiling &amp; Zero Idle Flash Wear\u003c/div>\n        \u003cdiv class=\"card-body\">\n          No heavy database engine runs on the camera: frame memory is strictly partitioned (32 MiB ring, 6 MiB card queue, 2×1 MiB push buffers — \u003cstrong>33.7 MiB during peak catch-up\u003c/strong>). Heartbeats and freshness timestamps stay in RAM; stream keys rotate at half-life (every 12h), and unchanged backups perform zero flash writes.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">06 • OFFLINE EDITS &amp; HONEST VIEW\u003c/span>\n          \u003cspan class=\"card-scope\">Field Operations\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Pending Edits for Powered-Off Cameras &amp; Honest Directory\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Operators can update camera settings or access rights even while cameras are powered down: the domain stores changes in \u003cspan class=\"code-pill\">domain/pending/&lt;member&gt;\u003c/span>, and the camera’s agent pulls and applies them upon boot. The directory never confuses “empty data” with “device unreachable,” explicitly surfacing report age.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- FOOTER -->\n    \u003cdiv class=\"footer\">\n      \u003cdiv>\u003cstrong>Deployment Economics:\u003c/strong> scale seamlessly from 1 standalone camera with an SD card to a distributed mesh of hundreds of cameras, relays, and network volumes — with zero dedicated VMS servers.\u003c/div>\n      \u003cdiv class=\"footer-highlight\">w2c Platform • Serverless Edge &amp; Distributed Storage (M10B / M12A / M12B)\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n"}},{"id":"recording-continuity","title":{"ru":"Бесперебойность записи","en":"Recording continuity"},"html":{"ru":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ru\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>w2c — Бесперебойность записи (Edge + Backup + Zero-Gap Continuity)\u003c/title>\n  \u003cstyle>\n    :root {\n      --bg: #080d19;\n      --bg-card: #10192d;\n      --bg-card-alt: #13203a;\n      --border: #213459;\n      --border-accent: #f59e0b;\n      --text: #f8fafc;\n      --text-muted: #94a3b8;\n      --cyan: #38bdf8;\n      --emerald: #34d399;\n      --indigo: #818cf8;\n      --amber: #fbbf24;\n      --rose: #fb7185;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background: #04070e;\n      color: var(--text);\n      font-family: -apple-system, BlinkMacSystemFont, \"Inter\", \"Segoe UI\", Roboto, sans-serif;\n      min-height: 100vh;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: 20px;\n    }\n\n    .slide {\n      width: 1600px;\n      height: 900px;\n      background:\n        radial-gradient(circle at 86% 14%, rgba(251, 191, 36, 0.10), transparent 36%),\n        radial-gradient(circle at 14% 88%, rgba(52, 211, 153, 0.10), transparent 38%),\n        linear-gradient(155deg, #070b14 0%, #0c1425 60%, #09101f 100%);\n      border: 1px solid var(--border);\n      border-radius: 24px;\n      padding: 38px 48px 30px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.78);\n      position: relative;\n      overflow: hidden;\n    }\n\n    /* Header */\n    .header {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      gap: 24px;\n      border-bottom: 1px solid rgba(148, 163, 184, 0.16);\n      padding-bottom: 16px;\n    }\n\n    .eyebrow {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      font-size: 12px;\n      font-weight: 700;\n      text-transform: uppercase;\n      letter-spacing: 0.12em;\n      color: var(--amber);\n      background: rgba(251, 191, 36, 0.11);\n      border: 1px solid rgba(251, 191, 36, 0.34);\n      padding: 5px 12px;\n      border-radius: 999px;\n      margin-bottom: 8px;\n    }\n\n    h1 {\n      font-size: 33px;\n      line-height: 1.15;\n      font-weight: 800;\n      letter-spacing: -0.02em;\n    }\n\n    h1 span {\n      background: linear-gradient(90deg, #fbbf24, #34d399, #38bdf8);\n      -webkit-background-clip: text;\n      -webkit-text-fill-color: transparent;\n    }\n\n    .subtitle {\n      font-size: 15px;\n      color: var(--text-muted);\n      margin-top: 5px;\n      max-width: 960px;\n    }\n\n    .hero-pill {\n      background: linear-gradient(135deg, rgba(251, 191, 36, 0.13), rgba(52, 211, 153, 0.12));\n      border: 1px solid rgba(251, 191, 36, 0.42);\n      border-radius: 16px;\n      padding: 12px 18px;\n      min-width: 390px;\n      text-align: right;\n    }\n\n    .hero-pill .title {\n      font-size: 15px;\n      font-weight: 800;\n      color: var(--amber);\n      letter-spacing: 0.01em;\n    }\n\n    .hero-pill .desc {\n      font-size: 12.5px;\n      color: #cbd5e1;\n      margin-top: 4px;\n      line-height: 1.35;\n    }\n\n    /* Continuity Pipeline Banner */\n    .pipeline-banner {\n      background: rgba(16, 25, 45, 0.88);\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 13px 20px;\n      display: grid;\n      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;\n      align-items: center;\n      gap: 10px;\n    }\n\n    .stage {\n      background: rgba(15, 23, 42, 0.9);\n      border: 1px solid #29406b;\n      border-radius: 12px;\n      padding: 9px 13px;\n    }\n\n    .stage.edge {\n      border-color: rgba(56, 189, 248, 0.45);\n      background: rgba(56, 189, 248, 0.08);\n    }\n\n    .stage.backup {\n      border-color: rgba(251, 191, 36, 0.48);\n      background: rgba(251, 191, 36, 0.08);\n    }\n\n    .stage.backfill {\n      border-color: rgba(52, 211, 153, 0.48);\n      background: rgba(52, 211, 153, 0.08);\n    }\n\n    .stage.lease {\n      border-color: rgba(129, 140, 248, 0.48);\n      background: rgba(129, 140, 248, 0.08);\n    }\n\n    .stage-label {\n      font-size: 10.5px;\n      font-weight: 800;\n      text-transform: uppercase;\n      letter-spacing: 0.08em;\n      margin-bottom: 3px;\n    }\n\n    .stage.edge .stage-label { color: var(--cyan); }\n    .stage.backup .stage-label { color: var(--amber); }\n    .stage.backfill .stage-label { color: var(--emerald); }\n    .stage.lease .stage-label { color: var(--indigo); }\n\n    .stage-title {\n      font-size: 13.5px;\n      font-weight: 700;\n      color: #f8fafc;\n    }\n\n    .stage-sub {\n      font-size: 11.5px;\n      color: var(--text-muted);\n      margin-top: 2px;\n      line-height: 1.3;\n    }\n\n    .stage-arrow {\n      font-size: 18px;\n      font-weight: 800;\n      color: #64748b;\n      padding: 0 2px;\n    }\n\n    /* 6-card Grid */\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      grid-template-rows: repeat(2, 1fr);\n      gap: 15px;\n      flex: 1;\n      margin: 14px 0;\n    }\n\n    .card {\n      background: linear-gradient(180deg, rgba(19, 32, 58, 0.78) 0%, rgba(13, 21, 38, 0.92) 100%);\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 17px 19px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      position: relative;\n    }\n\n    .card.highlight {\n      border-color: rgba(251, 191, 36, 0.46);\n      box-shadow: inset 0 0 24px rgba(251, 191, 36, 0.05);\n    }\n\n    .card-top {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 8px;\n    }\n\n    .card-tag {\n      font-size: 11px;\n      font-weight: 700;\n      text-transform: uppercase;\n      letter-spacing: 0.07em;\n      padding: 3px 9px;\n      border-radius: 6px;\n    }\n\n    .tag-amber { color: var(--amber); background: rgba(251, 191, 36, 0.14); }\n    .tag-cyan { color: var(--cyan); background: rgba(56, 189, 248, 0.14); }\n    .tag-emerald { color: var(--emerald); background: rgba(52, 211, 153, 0.14); }\n    .tag-indigo { color: var(--indigo); background: rgba(129, 140, 248, 0.15); }\n    .tag-rose { color: var(--rose); background: rgba(251, 113, 133, 0.14); }\n\n    .card-num {\n      font-size: 12px;\n      font-weight: 700;\n      color: #64748b;\n      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    }\n\n    .card h3 {\n      font-size: 17px;\n      font-weight: 750;\n      color: #f1f5f9;\n      margin-bottom: 7px;\n      line-height: 1.25;\n    }\n\n    .card ul {\n      list-style: none;\n      display: flex;\n      flex-direction: column;\n      gap: 5.5px;\n    }\n\n    .card li {\n      font-size: 13px;\n      line-height: 1.37;\n      color: #cbd5e1;\n      padding-left: 14px;\n      position: relative;\n    }\n\n    .card li::before {\n      content: \"•\";\n      position: absolute;\n      left: 0;\n      color: var(--amber);\n      font-weight: 900;\n    }\n\n    .card li strong {\n      color: #ffffff;\n      font-weight: 650;\n    }\n\n    code {\n      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n      font-size: 11.5px;\n      color: #fde68a;\n      background: rgba(15, 23, 42, 0.78);\n      padding: 1px 5px;\n      border-radius: 4px;\n      border: 1px solid rgba(148, 163, 184, 0.2);\n    }\n\n    .card-footer {\n      margin-top: 9px;\n      padding-top: 7px;\n      border-top: 1px dashed rgba(148, 163, 184, 0.16);\n      font-size: 11.5px;\n      color: #94a3b8;\n      display: flex;\n      justify-content: space-between;\n    }\n\n    .card-footer span.benefit {\n      color: var(--emerald);\n      font-weight: 600;\n    }\n\n    /* Footer */\n    .footer {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      background: rgba(15, 23, 42, 0.92);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 11px 20px;\n    }\n\n    .footer-summary {\n      font-size: 13.5px;\n      color: #e2e8f0;\n    }\n\n    .footer-summary strong {\n      color: var(--amber);\n    }\n\n    .metrics {\n      display: flex;\n      gap: 20px;\n    }\n\n    .metric {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      font-size: 12px;\n      color: var(--text-muted);\n    }\n\n    .metric b {\n      font-size: 14px;\n      color: #f8fafc;\n      background: rgba(255, 255, 255, 0.06);\n      border: 1px solid rgba(255, 255, 255, 0.12);\n      padding: 2px 8px;\n      border-radius: 6px;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"slide\">\n    \u003c!-- HEADER -->\n    \u003cdiv class=\"header\">\n      \u003cdiv>\n        \u003cdiv class=\"eyebrow\">w2c Recording Continuity • Zero-Gap Archive Architecture\u003c/div>\n        \u003ch1>Бесперебойность записи: \u003cspan>Edge + Backup + Защита каждой секунды\u003c/span>\u003c/h1>\n        \u003cp class=\"subtitle\">\n          Кадр не теряется ни при обрыве канала, ни при падении сервера записи, ни при потере кворума кластера, ни при сбросе часов камеры\n        \u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"hero-pill\">\n        \u003cdiv class=\"title\">Ни одной «слепой секунды» на переключении\u003c/div>\n        \u003cdiv class=\"desc\">\n          Предзапись из RAM-кольца закрывает окно детектирования отказа,\u003cbr />\n          а умная дозапись сшивает архив из Edge и Backup без дублей\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CONTINUITY PIPELINE BANNER -->\n    \u003cdiv class=\"pipeline-banner\">\n      \u003cdiv class=\"stage edge\">\n        \u003cdiv class=\"stage-label\">Эшелон 1 • На борту камеры\u003c/div>\n        \u003cdiv class=\"stage-title\">CamRing (RAM) + Edge SD-карта\u003c/div>\n        \u003cdiv class=\"stage-sub\">Неблокирующая запись на карту + приоритет ещё не доставленных серверу секунд (\u003ccode>owed\u003c/code>)\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stage-arrow\">⇄\u003c/div>\n      \u003cdiv class=\"stage backup\">\n        \u003cdiv class=\"stage-label\">Эшелон 2 • На другом узле / в облаке\u003c/div>\n        \u003cdiv class=\"stage-title\">Backup-архив (\u003ccode>always\u003c/code> / \u003ccode>when: offline\u003c/code>)\u003c/div>\n        \u003cdiv class=\"stage-sub\">Разнесение по физическим узлам (\u003ccode>spread_by: cam\u003c/code>) + предзапись из памяти до момента сбоя\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stage-arrow\">⇄\u003c/div>\n      \u003cdiv class=\"stage backfill\">\n        \u003cdiv class=\"stage-label\">Эшелон 3 • Авто-сшивка архива\u003c/div>\n        \u003cdiv class=\"stage-title\">Точечный Backfill (\u003ccode>desired − actual\u003c/code>)\u003c/div>\n        \u003cdiv class=\"stage-sub\">Подкачка только реальных дыр с ключевого кадра в отдельный поток \u003ccode>e&lt;n&gt;/backfill\u003c/code>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stage-arrow\">⇄\u003c/div>\n      \u003cdiv class=\"stage lease\">\n        \u003cdiv class=\"stage-label\">Эшелон 4 • Живучесть узла и диска\u003c/div>\n        \u003cdiv class=\"stage-title\">Автономная запись + Тома \u003ccode>incidents\u003c/code>\u003c/div>\n        \u003cdiv class=\"stage-sub\">Запись при потере кворума (\u003ccode>may_write\u003c/code>), \u003ccode>Drain\u003c/code> без обрыва хвостов и защита \u003ccode>keeps\u003c/code>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6 PILLARS GRID -->\n    \u003cdiv class=\"grid\">\n      \u003c!-- Card 1 -->\n      \u003cdiv class=\"card highlight\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-amber\">Backup • Zero Blind-Spot\u003c/span>\n            \u003cspan class=\"card-num\">01 / BACKUP &amp; PRE-ROLL\u003c/span>\n          \u003c/div>\n          \u003ch3>Резервная запись с предзаписью ДО момента сбоя\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Два режима резерва:\u003c/strong> параллельно на втором сервере (\u003ccode>always\u003c/code>, анти-аффинность \u003ccode>spread_by: cam\u003c/code>) или экономно только при аварии основного (\u003ccode>when: offline\u003c/code>).\u003c/li>\n            \u003cli>\u003cstrong>Никакой дыры на время обнаружения отказа:\u003c/strong> резерв держит хвост в RAM-кольце и при аварии основного регистратора \u003cstrong>сбрасывает на диск секунды с ключевого кадра ДО падения\u003c/strong>.\u003c/li>\n            \u003cli>\u003cstrong>Живучий воркер камеры:\u003c/strong> размещается рядом с резервом (\u003ccode>prefer: backup\u003c/code>), чтобы смерть основного сервера не оборвала приём потока.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Отличает аварию от штатного \u003ccode>enabled: false\u003c/code>\u003c/span>\n          \u003cspan class=\"benefit\">✓ 0 секунд потери на failover\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 2 -->\n      \u003cdiv class=\"card highlight\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-cyan\">Edge • Smart Eviction\u003c/span>\n            \u003cspan class=\"card-num\">02 / EDGE SD &amp; OWED SPANS\u003c/span>\n          \u003c/div>\n          \u003ch3>Умная SD-карта: бережёт то, что сервер ещё не получил\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Приоритет недоставленного (\u003ccode>CardBuffer.owed\u003c/code>):\u003c/strong> при нехватке места карта удаляет старейшие \u003cstrong>уже подтверждённые сервером\u003c/strong> сегменты (\u003ccode>delivered.json\u003c/code>), сохраняя недокачанные дыры до последнего.\u003c/li>\n            \u003cli>\u003cstrong>Изоляция от медленного флеша:\u003c/strong> изношенная SD-карта никогда не блокирует живой поток и \u003ccode>CamRing\u003c/code> — переполнение очереди режет только запись карты до следующего keyframe.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Фоновая проверка \u003ccode>health: ok | degraded | failed\u003c/code>\u003c/span>\n          \u003cspan class=\"benefit\">✓ Спасение дыр при долгом обрыве\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 3 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-emerald\">Backfill • Gap Healing\u003c/span>\n            \u003cspan class=\"card-num\">03 / DELTA BACKFILL\u003c/span>\n          \u003c/div>\n          \u003ch3>Точечная дозапись дыр из Edge и Backup\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Математика покрытий (\u003ccode>desired − actual = gaps\u003c/code>):\u003c/strong> основная запись сверяет свой индекс с картой покрытия (\u003ccode>coverage\u003c/code>) в пульсе камеры или резервного сервера.\u003c/li>\n            \u003cli>\u003cstrong>Докачка только недостающего:\u003c/strong> никаких полных копирований — запрашиваются только пропущенные интервалы с границы ключевого кадра.\u003c/li>\n            \u003cli>\u003cstrong>Чистое разделение потоков:\u003c/strong> дозапись идёт в \u003ccode>&lt;rec&gt;/e&lt;n&gt;/backfill\u003c/code>, не мешая живому потоку \u003ccode>live\u003c/code>, а при чтении прозрачно склеивается.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Коалесцирование соседних дыр (\u003ccode>COALESCE_GAP\u003c/code>)\u003c/span>\n          \u003cspan class=\"benefit\">✓ Бережёт узкий WAN-аплинк\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 4 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-indigo\">Control-Plane Survival\u003c/span>\n            \u003cspan class=\"card-num\">04 / UNCONFIRMED LEASE\u003c/span>\n          \u003c/div>\n          \u003ch3>Запись не останавливается при падении кворума\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Разделение \u003ccode>may_write\u003c/code> и \u003ccode>may_act\u003c/code>:\u003c/strong> если управляющее хранилище (Raft / \u003ccode>configstore\u003c/code>) недоступно, аренда переходит в \u003cem>неподтверждённую\u003c/em> — внешние действия заблокированы, но \u003cstrong>запись видео в том продолжается\u003c/strong>.\u003c/li>\n            \u003cli>\u003cstrong>Бесконфликтные эпохи (\u003ccode>e&lt;n&gt;\u003c/code>, \u003ccode>e&lt;n+1&gt;\u003c/code>):\u003c/strong> даже если другой узел перехватил камеру в новой эпохе, оба тома хранят свои потоки без порчи данных и сшиваются на таймлайне.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Автономная работа до \u003ccode>unconfirmed_max\u003c/code>\u003c/span>\n          \u003cspan class=\"benefit\">✓ Падение контроллера ≠ потеря архива\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 5 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-rose\">Clock Immunity\u003c/span>\n            \u003cspan class=\"card-num\">05 / CAMLINE TIME ANCHOR\u003c/span>\n          \u003c/div>\n          \u003ch3>Иммунитет к сбросу часов (1970 год) и скачкам NTP\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Монотонная линия времени (\u003ccode>CamLine\u003c/code> + \u003ccode>line.json\u003c/code>):\u003c/strong> камера без батарейки RTC после потери питания сразу пишет видео по внутреннему монотонному счётчику (\u003ccode>boot_id\u003c/code>).\u003c/li>\n            \u003cli>\u003cstrong>Мгновенное переякоривание без перезаписи видео:\u003c/strong> когда появляется интернет и NTP, сегменты на карте получают реальное время атомарным переименованием \u003ccode>&lt;start&gt;@&lt;offset&gt;.smpl\u003c/code>.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Защита от прыжков часов вперёд/назад\u003c/span>\n          \u003cspan class=\"benefit\">✓ Архив никогда не «улетает в 1970-й»\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 6 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-emerald\">Storage &amp; Drain Safety\u003c/span>\n            \u003cspan class=\"card-num\">06 / DRAIN, RING &amp; KEEPS\u003c/span>\n          \u003c/div>\n          \u003ch3>Безопасный Drain, предформатированное кольцо и Keeps\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Drain ждёт сброса всех буферов:\u003c/strong> при выводе сервера на обслуживание статус \u003ccode>safe\u003c/code> наступает только при \u003ccode>units == 0\u003c/code> \u003cstrong>и\u003c/strong> \u003ccode>pending_writes == 0\u003c/code> — хвосты дозаписи не обрываются.\u003c/li>\n            \u003cli>\u003cstrong>Кольцевой \u003ccode>ObjectStorage\u003c/code> + тома \u003ccode>incidents\u003c/code>:\u003c/strong> предформатированный по квоте том не переполняет диск и меняет размер на лету, а важные события копируются в неприкосновенный том \u003ccode>incidents\u003c/code> (\u003ccode>keeps\u003c/code> с крипто-дайджестом).\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Детерминированное вытеснение без фонового GC\u003c/span>\n          \u003cspan class=\"benefit\">✓ 0 потерь при обновлениях и ротации\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- FOOTER -->\n    \u003cdiv class=\"footer\">\n      \u003cdiv class=\"footer-summary\">\n        \u003cstrong>Главный аргумент:\u003c/strong> в обычных VMS резервирование — это «второй сервер или SD-карта». В \u003cstrong>w2c\u003c/strong> — это сквозной конвейер без слепых зон: от RAM-предзаписи и умного вытеснения на карте до записи без кворума и защиты от сбитых часов.\n      \u003c/div>\n      \u003cdiv class=\"metrics\">\n        \u003cdiv class=\"metric\">Слепая зона failover \u003cb>0 сек\u003c/b>\u003c/div>\n        \u003cdiv class=\"metric\">Вытеснение на SD \u003cb>Delivered First\u003c/b>\u003c/div>\n        \u003cdiv class=\"metric\">Без кворума \u003cb>may_write = true\u003c/b>\u003c/div>\n        \u003cdiv class=\"metric\">Обслуживание \u003cb>pending_writes = 0\u003c/b>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n","en":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>w2c — Recording Continuity (Edge + Backup + Zero-Gap Architecture)\u003c/title>\n  \u003cstyle>\n    :root {\n      --bg: #080d19;\n      --bg-card: #10192d;\n      --bg-card-alt: #13203a;\n      --border: #213459;\n      --border-accent: #f59e0b;\n      --text: #f8fafc;\n      --text-muted: #94a3b8;\n      --cyan: #38bdf8;\n      --emerald: #34d399;\n      --indigo: #818cf8;\n      --amber: #fbbf24;\n      --rose: #fb7185;\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    body {\n      background: #04070e;\n      color: var(--text);\n      font-family: -apple-system, BlinkMacSystemFont, \"Inter\", \"Segoe UI\", Roboto, sans-serif;\n      min-height: 100vh;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: 20px;\n    }\n\n    .slide {\n      width: 1600px;\n      height: 900px;\n      background:\n        radial-gradient(circle at 86% 14%, rgba(251, 191, 36, 0.10), transparent 36%),\n        radial-gradient(circle at 14% 88%, rgba(52, 211, 153, 0.10), transparent 38%),\n        linear-gradient(155deg, #070b14 0%, #0c1425 60%, #09101f 100%);\n      border: 1px solid var(--border);\n      border-radius: 24px;\n      padding: 38px 48px 30px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.78);\n      position: relative;\n      overflow: hidden;\n    }\n\n    /* Header */\n    .header {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      gap: 24px;\n      border-bottom: 1px solid rgba(148, 163, 184, 0.16);\n      padding-bottom: 16px;\n    }\n\n    .eyebrow {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      font-size: 12px;\n      font-weight: 700;\n      text-transform: uppercase;\n      letter-spacing: 0.12em;\n      color: var(--amber);\n      background: rgba(251, 191, 36, 0.11);\n      border: 1px solid rgba(251, 191, 36, 0.34);\n      padding: 5px 12px;\n      border-radius: 999px;\n      margin-bottom: 8px;\n    }\n\n    h1 {\n      font-size: 33px;\n      line-height: 1.15;\n      font-weight: 800;\n      letter-spacing: -0.02em;\n    }\n\n    h1 span {\n      background: linear-gradient(90deg, #fbbf24, #34d399, #38bdf8);\n      -webkit-background-clip: text;\n      -webkit-text-fill-color: transparent;\n    }\n\n    .subtitle {\n      font-size: 15px;\n      color: var(--text-muted);\n      margin-top: 5px;\n      max-width: 960px;\n    }\n\n    .hero-pill {\n      background: linear-gradient(135deg, rgba(251, 191, 36, 0.13), rgba(52, 211, 153, 0.12));\n      border: 1px solid rgba(251, 191, 36, 0.42);\n      border-radius: 16px;\n      padding: 12px 18px;\n      min-width: 390px;\n      text-align: right;\n    }\n\n    .hero-pill .title {\n      font-size: 15px;\n      font-weight: 800;\n      color: var(--amber);\n      letter-spacing: 0.01em;\n    }\n\n    .hero-pill .desc {\n      font-size: 12.5px;\n      color: #cbd5e1;\n      margin-top: 4px;\n      line-height: 1.35;\n    }\n\n    /* Continuity Pipeline Banner */\n    .pipeline-banner {\n      background: rgba(16, 25, 45, 0.88);\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 13px 20px;\n      display: grid;\n      grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;\n      align-items: center;\n      gap: 10px;\n    }\n\n    .stage {\n      background: rgba(15, 23, 42, 0.9);\n      border: 1px solid #29406b;\n      border-radius: 12px;\n      padding: 9px 13px;\n    }\n\n    .stage.edge {\n      border-color: rgba(56, 189, 248, 0.45);\n      background: rgba(56, 189, 248, 0.08);\n    }\n\n    .stage.backup {\n      border-color: rgba(251, 191, 36, 0.48);\n      background: rgba(251, 191, 36, 0.08);\n    }\n\n    .stage.backfill {\n      border-color: rgba(52, 211, 153, 0.48);\n      background: rgba(52, 211, 153, 0.08);\n    }\n\n    .stage.lease {\n      border-color: rgba(129, 140, 248, 0.48);\n      background: rgba(129, 140, 248, 0.08);\n    }\n\n    .stage-label {\n      font-size: 10.5px;\n      font-weight: 800;\n      text-transform: uppercase;\n      letter-spacing: 0.08em;\n      margin-bottom: 3px;\n    }\n\n    .stage.edge .stage-label { color: var(--cyan); }\n    .stage.backup .stage-label { color: var(--amber); }\n    .stage.backfill .stage-label { color: var(--emerald); }\n    .stage.lease .stage-label { color: var(--indigo); }\n\n    .stage-title {\n      font-size: 13.5px;\n      font-weight: 700;\n      color: #f8fafc;\n    }\n\n    .stage-sub {\n      font-size: 11.5px;\n      color: var(--text-muted);\n      margin-top: 2px;\n      line-height: 1.3;\n    }\n\n    .stage-arrow {\n      font-size: 18px;\n      font-weight: 800;\n      color: #64748b;\n      padding: 0 2px;\n    }\n\n    /* 6-card Grid */\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      grid-template-rows: repeat(2, 1fr);\n      gap: 15px;\n      flex: 1;\n      margin: 14px 0;\n    }\n\n    .card {\n      background: linear-gradient(180deg, rgba(19, 32, 58, 0.78) 0%, rgba(13, 21, 38, 0.92) 100%);\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 17px 19px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      position: relative;\n    }\n\n    .card.highlight {\n      border-color: rgba(251, 191, 36, 0.46);\n      box-shadow: inset 0 0 24px rgba(251, 191, 36, 0.05);\n    }\n\n    .card-top {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 8px;\n    }\n\n    .card-tag {\n      font-size: 11px;\n      font-weight: 700;\n      text-transform: uppercase;\n      letter-spacing: 0.07em;\n      padding: 3px 9px;\n      border-radius: 6px;\n    }\n\n    .tag-amber { color: var(--amber); background: rgba(251, 191, 36, 0.14); }\n    .tag-cyan { color: var(--cyan); background: rgba(56, 189, 248, 0.14); }\n    .tag-emerald { color: var(--emerald); background: rgba(52, 211, 153, 0.14); }\n    .tag-indigo { color: var(--indigo); background: rgba(129, 140, 248, 0.15); }\n    .tag-rose { color: var(--rose); background: rgba(251, 113, 133, 0.14); }\n\n    .card-num {\n      font-size: 12px;\n      font-weight: 700;\n      color: #64748b;\n      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    }\n\n    .card h3 {\n      font-size: 17px;\n      font-weight: 750;\n      color: #f1f5f9;\n      margin-bottom: 7px;\n      line-height: 1.25;\n    }\n\n    .card ul {\n      list-style: none;\n      display: flex;\n      flex-direction: column;\n      gap: 5.5px;\n    }\n\n    .card li {\n      font-size: 13px;\n      line-height: 1.37;\n      color: #cbd5e1;\n      padding-left: 14px;\n      position: relative;\n    }\n\n    .card li::before {\n      content: \"•\";\n      position: absolute;\n      left: 0;\n      color: var(--amber);\n      font-weight: 900;\n    }\n\n    .card li strong {\n      color: #ffffff;\n      font-weight: 650;\n    }\n\n    code {\n      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n      font-size: 11.5px;\n      color: #fde68a;\n      background: rgba(15, 23, 42, 0.78);\n      padding: 1px 5px;\n      border-radius: 4px;\n      border: 1px solid rgba(148, 163, 184, 0.2);\n    }\n\n    .card-footer {\n      margin-top: 9px;\n      padding-top: 7px;\n      border-top: 1px dashed rgba(148, 163, 184, 0.16);\n      font-size: 11.5px;\n      color: #94a3b8;\n      display: flex;\n      justify-content: space-between;\n    }\n\n    .card-footer span.benefit {\n      color: var(--emerald);\n      font-weight: 600;\n    }\n\n    /* Footer */\n    .footer {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      background: rgba(15, 23, 42, 0.92);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 11px 20px;\n    }\n\n    .footer-summary {\n      font-size: 13.5px;\n      color: #e2e8f0;\n    }\n\n    .footer-summary strong {\n      color: var(--amber);\n    }\n\n    .metrics {\n      display: flex;\n      gap: 20px;\n    }\n\n    .metric {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      font-size: 12px;\n      color: var(--text-muted);\n    }\n\n    .metric b {\n      font-size: 14px;\n      color: #f8fafc;\n      background: rgba(255, 255, 255, 0.06);\n      border: 1px solid rgba(255, 255, 255, 0.12);\n      padding: 2px 8px;\n      border-radius: 6px;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"slide\">\n    \u003c!-- HEADER -->\n    \u003cdiv class=\"header\">\n      \u003cdiv>\n        \u003cdiv class=\"eyebrow\">w2c Recording Continuity • Zero-Gap Archive Architecture\u003c/div>\n        \u003ch1>Uninterrupted Recording: \u003cspan>Edge + Backup + Every Second Protected\u003c/span>\u003c/h1>\n        \u003cp class=\"subtitle\">\n          Zero frames lost across WAN outages, recording server crashes, cluster quorum loss, or camera clock resets\n        \u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"hero-pill\">\n        \u003cdiv class=\"title\">Zero “Blind Seconds” During Failover\u003c/div>\n        \u003cdiv class=\"desc\">\n          RAM ring pre-roll bridges failure detection latency,\u003cbr />\n          while delta backfill stitches Edge and Backup without duplicates\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- CONTINUITY PIPELINE BANNER -->\n    \u003cdiv class=\"pipeline-banner\">\n      \u003cdiv class=\"stage edge\">\n        \u003cdiv class=\"stage-label\">Tier 1 • On-Camera Edge\u003c/div>\n        \u003cdiv class=\"stage-title\">CamRing (RAM) + Edge SD Card\u003c/div>\n        \u003cdiv class=\"stage-sub\">Non-blocking card writes + eviction priority for undelivered spans (\u003ccode>owed\u003c/code>)\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stage-arrow\">⇄\u003c/div>\n      \u003cdiv class=\"stage backup\">\n        \u003cdiv class=\"stage-label\">Tier 2 • Peer Node / Cloud\u003c/div>\n        \u003cdiv class=\"stage-title\">Backup Archive (\u003ccode>always\u003c/code> / \u003ccode>when: offline\u003c/code>)\u003c/div>\n        \u003cdiv class=\"stage-sub\">Hardware anti-affinity (\u003ccode>spread_by: cam\u003c/code>) + RAM pre-roll flushed from before crash\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stage-arrow\">⇄\u003c/div>\n      \u003cdiv class=\"stage backfill\">\n        \u003cdiv class=\"stage-label\">Tier 3 • Auto Archive Healing\u003c/div>\n        \u003cdiv class=\"stage-title\">Delta Backfill (\u003ccode>desired − actual\u003c/code>)\u003c/div>\n        \u003cdiv class=\"stage-sub\">Fetches only exact missing intervals from keyframe boundaries into \u003ccode>e&lt;n&gt;/backfill\u003c/code>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stage-arrow\">⇄\u003c/div>\n      \u003cdiv class=\"stage lease\">\n        \u003cdiv class=\"stage-label\">Tier 4 • Node &amp; Disk Resilience\u003c/div>\n        \u003cdiv class=\"stage-title\">Quorumless Write + \u003ccode>incidents\u003c/code> Volumes\u003c/div>\n        \u003cdiv class=\"stage-sub\">Writes through quorum loss (\u003ccode>may_write\u003c/code>), safe \u003ccode>Drain\u003c/code> &amp; sealed \u003ccode>keeps\u003c/code>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6 PILLARS GRID -->\n    \u003cdiv class=\"grid\">\n      \u003c!-- Card 1 -->\n      \u003cdiv class=\"card highlight\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-amber\">Backup • Zero Blind-Spot\u003c/span>\n            \u003cspan class=\"card-num\">01 / BACKUP &amp; PRE-ROLL\u003c/span>\n          \u003c/div>\n          \u003ch3>Backup Recording with Pre-Roll BEFORE Crash Detection\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Two backup modes:\u003c/strong> continuous dual write on a second server (\u003ccode>always\u003c/code>, anti-affinity \u003ccode>spread_by: cam\u003c/code>) or standby on primary failure (\u003ccode>when: offline\u003c/code>).\u003c/li>\n            \u003cli>\u003cstrong>Zero detection-window gap:\u003c/strong> standby backup keeps a rolling tail in RAM and, when the primary goes silent, \u003cstrong>flushes video starting from the keyframe BEFORE the crash\u003c/strong>.\u003c/li>\n            \u003cli>\u003cstrong>Survivable camera worker:\u003c/strong> placed next to the backup (\u003ccode>prefer: backup\u003c/code>) so primary server death never drops ingestion.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Distinguishes crash from intentional \u003ccode>enabled: false\u003c/code>\u003c/span>\n          \u003cspan class=\"benefit\">✓ 0 sec lost on failover\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 2 -->\n      \u003cdiv class=\"card highlight\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-cyan\">Edge • Smart Eviction\u003c/span>\n            \u003cspan class=\"card-num\">02 / EDGE SD &amp; OWED SPANS\u003c/span>\n          \u003c/div>\n          \u003ch3>Smart SD Card: Preserves What the Server Hasn’t Received\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Undelivered-first retention (\u003ccode>CardBuffer.owed\u003c/code>):\u003c/strong> when full, the SD card evicts the oldest \u003cstrong>already-delivered\u003c/strong> segments first (\u003ccode>delivered.json\u003c/code>), protecting unuploaded gaps to the very last byte.\u003c/li>\n            \u003cli>\u003cstrong>Isolated from slow flash:\u003c/strong> a worn or lagging SD card never stalls live streaming or \u003ccode>CamRing\u003c/code> — queue overflow cleanly trims only card writes to the next keyframe.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Background health monitoring \u003ccode>ok | degraded | failed\u003c/code>\u003c/span>\n          \u003cspan class=\"benefit\">✓ Protects gaps on slow WAN links\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 3 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-emerald\">Backfill • Gap Healing\u003c/span>\n            \u003cspan class=\"card-num\">03 / DELTA BACKFILL\u003c/span>\n          \u003c/div>\n          \u003ch3>Surgical Gap Backfill from Edge &amp; Backup\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Coverage set math (\u003ccode>desired − actual = gaps\u003c/code>):\u003c/strong> the primary archive compares its volume index against the \u003ccode>coverage\u003c/code> summary in camera or backup heartbeats.\u003c/li>\n            \u003cli>\u003cstrong>Transfer only what’s missing:\u003c/strong> no bulk file copying — only missing time spans are pulled, aligned to keyframe boundaries.\u003c/li>\n            \u003cli>\u003cstrong>Clean stream separation:\u003c/strong> backfill writes into \u003ccode>&lt;rec&gt;/e&lt;n&gt;/backfill\u003c/code> without disrupting \u003ccode>live\u003c/code>, seamlessly merging on playback.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Coalesces adjacent gaps (\u003ccode>COALESCE_GAP\u003c/code>)\u003c/span>\n          \u003cspan class=\"benefit\">✓ Saves constrained WAN bandwidth\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 4 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-indigo\">Control-Plane Survival\u003c/span>\n            \u003cspan class=\"card-num\">04 / UNCONFIRMED LEASE\u003c/span>\n          \u003c/div>\n          \u003ch3>Recording Continues Even When Cluster Quorum Drops\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Decoupled \u003ccode>may_write\u003c/code> vs. \u003ccode>may_act\u003c/code>:\u003c/strong> if the cluster config store (Raft / \u003ccode>configstore\u003c/code>) becomes unreachable, the lease enters \u003cem>unconfirmed\u003c/em> state — external actions pause, but \u003cstrong>local volume recording continues uninterrupted\u003c/strong>.\u003c/li>\n            \u003cli>\u003cstrong>Conflict-free epochs (\u003ccode>e&lt;n&gt;\u003c/code>, \u003ccode>e&lt;n+1&gt;\u003c/code>):\u003c/strong> even if another node claims the camera under a new epoch, both volumes store their streams cleanly and stitch on the timeline.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Autonomous recording up to \u003ccode>unconfirmed_max\u003c/code>\u003c/span>\n          \u003cspan class=\"benefit\">✓ Control plane outage ≠ archive loss\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 5 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-rose\">Clock Immunity\u003c/span>\n            \u003cspan class=\"card-num\">05 / CAMLINE TIME ANCHOR\u003c/span>\n          \u003c/div>\n          \u003ch3>Immunity to Clock Resets (Year 1970) &amp; NTP Jumps\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Monotonic camera timeline (\u003ccode>CamLine\u003c/code> + \u003ccode>line.json\u003c/code>):\u003c/strong> an RTC-less camera booting without internet immediately records against a monotonic boot counter (\u003ccode>boot_id\u003c/code>).\u003c/li>\n            \u003cli>\u003cstrong>Zero-copy time anchoring:\u003c/strong> once NTP locks, existing SD segments acquire wall-clock time via an atomic rename \u003ccode>&lt;start&gt;@&lt;offset&gt;.smpl\u003c/code> without rewriting video bytes.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Immune to forward/backward NTP clock jumps\u003c/span>\n          \u003cspan class=\"benefit\">✓ Archive never vanishes into 1970\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Card 6 -->\n      \u003cdiv class=\"card\">\n        \u003cdiv>\n          \u003cdiv class=\"card-top\">\n            \u003cspan class=\"card-tag tag-emerald\">Storage &amp; Drain Safety\u003c/span>\n            \u003cspan class=\"card-num\">06 / DRAIN, RING &amp; KEEPS\u003c/span>\n          \u003c/div>\n          \u003ch3>Zero-Loss Node Drain, Pre-Allocated Ring &amp; Incident Keeps\u003c/h3>\n          \u003cul>\n            \u003cli>\u003cstrong>Drain waits for buffer flush:\u003c/strong> during planned maintenance (\u003ccode>POST /drain\u003c/code>), \u003ccode>safe\u003c/code> status requires both \u003ccode>units == 0\u003c/code> \u003cstrong>and\u003c/strong> \u003ccode>pending_writes == 0\u003c/code> — no in-flight tails are cut off.\u003c/li>\n            \u003cli>\u003cstrong>Ring \u003ccode>ObjectStorage\u003c/code> + \u003ccode>incidents\u003c/code> volumes:\u003c/strong> pre-formatted quota rings never suffer sudden disk-full failures and resize live, while critical clips are copied to an immutable \u003ccode>incidents\u003c/code> volume (\u003ccode>keeps\u003c/code> with cryptographic digests).\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card-footer\">\n          \u003cspan>Deterministic FIFO eviction with zero background GC spikes\u003c/span>\n          \u003cspan class=\"benefit\">✓ Zero loss during upgrades &amp; rotation\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- FOOTER -->\n    \u003cdiv class=\"footer\">\n      \u003cdiv class=\"footer-summary\">\n        \u003cstrong>The Bottom Line:\u003c/strong> in legacy VMS, redundancy means “add a second server or an SD card.” In \u003cstrong>w2c\u003c/strong>, it is an end-to-end zero-gap pipeline: from RAM pre-roll and smart SD eviction to quorumless writes and clock-jump immunity.\n      \u003c/div>\n      \u003cdiv class=\"metrics\">\n        \u003cdiv class=\"metric\">Failover Blind Spot \u003cb>0 sec\u003c/b>\u003c/div>\n        \u003cdiv class=\"metric\">SD Eviction \u003cb>Delivered First\u003c/b>\u003c/div>\n        \u003cdiv class=\"metric\">No Quorum \u003cb>may_write = true\u003c/b>\u003c/div>\n        \u003cdiv class=\"metric\">Node Drain \u003cb>pending_writes = 0\u003c/b>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n"}},{"id":"cybersecurity","title":{"ru":"Кибербезопасность","en":"Cybersecurity"},"html":{"ru":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ru\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>w2c Platform — Cybersecurity в камере и NVR\u003c/title>\n  \u003cstyle>\n    :root {\n      --bg: #0b1020;\n      --bg-card: #131b33;\n      --bg-card-alt: #172240;\n      --border: #26355d;\n      --accent-cyan: #38bdf8;\n      --accent-emerald: #34d399;\n      --accent-indigo: #818cf8;\n      --accent-amber: #fbbf24;\n      --accent-rose: #fb7185;\n      --text-main: #f8fafc;\n      --text-muted: #94a3b8;\n      --text-dim: #64748b;\n    }\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n    body {\n      background: #060913;\n      color: var(--text-main);\n      font-family: -apple-system, BlinkMacSystemFont, \"Inter\", \"Segoe UI\", Roboto, sans-serif;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      padding: 24px;\n    }\n    .slide {\n      width: 1600px;\n      height: 900px;\n      background: radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.10), transparent 45%),\n                  radial-gradient(circle at 15% 85%, rgba(52, 211, 153, 0.08), transparent 45%),\n                  var(--bg);\n      border: 1px solid var(--border);\n      border-radius: 20px;\n      padding: 44px 56px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);\n      position: relative;\n      overflow: hidden;\n    }\n    /* Header */\n    .header {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      border-bottom: 1px solid var(--border);\n      padding-bottom: 20px;\n    }\n    .badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      background: rgba(56, 189, 248, 0.12);\n      border: 1px solid rgba(56, 189, 248, 0.35);\n      color: var(--accent-cyan);\n      font-size: 13px;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      padding: 5px 12px;\n      border-radius: 999px;\n      margin-bottom: 10px;\n    }\n    .title {\n      font-size: 34px;\n      font-weight: 800;\n      letter-spacing: -0.02em;\n      line-height: 1.15;\n
