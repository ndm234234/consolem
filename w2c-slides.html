  }\n    .subtitle {\n      font-size: 17px;\n      color: var(--text-muted);\n      margin-top: 6px;\n    }\n    .key-metric-box {\n      display: flex;\n      gap: 16px;\n    }\n    .metric {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 12px;\n      padding: 12px 18px;\n      text-align: right;\n    }\n    .metric-val {\n      font-size: 24px;\n      font-weight: 800;\n      color: var(--accent-emerald);\n    }\n    .metric-lbl {\n      font-size: 12px;\n      color: var(--text-muted);\n      margin-top: 2px;\n    }\n\n    /* Architecture Flow Strip */\n    .flow-strip {\n      background: linear-gradient(90deg, rgba(19,27,51,0.95), rgba(23,34,64,0.95));\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 18px 28px;\n      display: grid;\n      grid-template-columns: 1.15fr 0.9fr 1fr 0.9fr 1.25fr;\n      align-items: center;\n      gap: 12px;\n    }\n    .node {\n      background: rgba(11, 16, 32, 0.75);\n      border: 1px solid rgba(129, 140, 248, 0.35);\n      border-radius: 12px;\n      padding: 14px 16px;\n    }\n    .node-cam {\n      border-color: rgba(52, 211, 153, 0.5);\n    }\n    .node-nvr {\n      border-color: rgba(56, 189, 248, 0.5);\n    }\n    .node-title {\n      font-size: 15px;\n      font-weight: 700;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 6px;\n    }\n    .node-tag {\n      font-size: 11px;\n      padding: 2px 8px;\n      border-radius: 99px;\n      background: rgba(52, 211, 153, 0.15);\n      color: var(--accent-emerald);\n      font-weight: 600;\n    }\n    .node-nvr .node-tag {\n      background: rgba(56, 189, 248, 0.15);\n      color: var(--accent-cyan);\n    }\n    .node-list {\n      font-size: 12.5px;\n      color: var(--text-muted);\n      line-height: 1.45;\n      list-style: none;\n    }\n    .node-list li::before {\n      content: \"• \";\n      color: var(--accent-cyan);\n    }\n    .arrow-box {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      text-align: center;\n      gap: 4px;\n    }\n    .arrow-line {\n      width: 100%;\n      height: 3px;\n      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-cyan));\n      position: relative;\n      border-radius: 2px;\n    }\n    .arrow-line::after {\n      content: \"►\";\n      position: absolute;\n      right: -6px;\n      top: -9px;\n      color: var(--accent-cyan);\n      font-size: 14px;\n    }\n    .arrow-label {\n      font-size: 11.5px;\n      font-weight: 700;\n      color: var(--text-main);\n    }\n    .arrow-sub {\n      font-size: 11px;\n      color: var(--text-muted);\n    }\n    .arrow-block {\n      font-size: 11px;\n      color: var(--accent-rose);\n      font-weight: 600;\n      background: rgba(251, 113, 133, 0.12);\n      border: 1px solid rgba(251, 113, 133, 0.3);\n      padding: 2px 8px;\n      border-radius: 6px;\n      margin-top: 2px;\n    }\n\n    /* 6 Cards Grid */\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 18px;\n    }\n    .card {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 20px 22px;\n      display: flex;\n      flex-direction: column;\n      gap: 10px;\n      position: relative;\n    }\n    .card-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 10px;\n    }\n    .card-num {\n      font-size: 12px;\n      font-weight: 800;\n      padding: 4px 9px;\n      border-radius: 6px;\n      background: rgba(56, 189, 248, 0.14);\n      color: var(--accent-cyan);\n      letter-spacing: 0.04em;\n    }\n    .card-scope {\n      font-size: 11px;\n      color: var(--text-dim);\n      font-weight: 600;\n      text-transform: uppercase;\n      letter-spacing: 0.05em;\n    }\n    .card-title {\n      font-size: 17px;\n      font-weight: 700;\n      color: var(--text-main);\n      line-height: 1.25;\n    }\n    .card-body {\n      font-size: 13.2px;\n      color: var(--text-muted);\n      line-height: 1.5;\n    }\n    .card-body strong {\n      color: #e2e8f0;\n      font-weight: 600;\n    }\n    .code-pill {\n      font-family: \"JetBrains Mono\", \"SFMono-Regular\", Menlo, monospace;\n      font-size: 11.5px;\n      background: rgba(15, 23, 42, 0.8);\n      border: 1px solid rgba(148, 163, 184, 0.2);\n      color: var(--accent-amber);\n      padding: 1px 6px;\n      border-radius: 4px;\n    }\n\n    /* Footer */\n    .footer {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      border-top: 1px solid var(--border);\n      padding-top: 14px;\n      font-size: 13px;\n      color: var(--text-muted);\n    }\n    .footer-highlight {\n      color: var(--accent-emerald);\n      font-weight: 600;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"slide\">\n    \u003c!-- HEADER -->\n    \u003cdiv class=\"header\">\n      \u003cdiv>\n        \u003cdiv class=\"badge\">Кибербезопасность архитектуры w2c • Edge-to-Core\u003c/div>\n        \u003cdiv class=\"title\">Единая модель Zero-Trust: от камеры («кластер из одного») до NVR и домена\u003c/div>\n        \u003cdiv class=\"subtitle\">Безопасность встроена в механизмы платформы, а не наложена внешним периметром или VPN\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"key-metric-box\">\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">0 портов\u003c/div>\n          \u003cdiv class=\"metric-lbl\">на вход у камеры за NAT / LTE\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">0 паролей\u003c/div>\n          \u003cdiv class=\"metric-lbl\">в образе прошивки и в RTSP/HTTP URL\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">E2E Seal\u003c/div>\n          \u003cdiv class=\"metric-lbl\">на флеше, в базе, в дороге и бэкапе\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ARCHITECTURE STRIP -->\n    \u003cdiv class=\"flow-strip\">\n      \u003cdiv class=\"node node-cam\">\n        \u003cdiv class=\"node-title\">\n          \u003cspan>Камера w2c (Кластер из 1)\u003c/span>\n          \u003cspan class=\"node-tag\">Edge\u003c/span>\n        \u003c/div>\n        \u003cul class=\"node-list\">\n          \u003cli>Входящие двери закрыты снаружи\u003c/li>\n          \u003cli>Ключ члена Ed25519 / X25519 + LDevID\u003c/li>\n          \u003cli>Секреты на флеше под \u003cspan class=\"code-pill\">enc:v1\u003c/span> + AAD\u003c/li>\n          \u003cli>Локальный буфер SD без потери при обрыве\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"arrow-box\">\n        \u003cdiv class=\"arrow-label\">Камера стучится сама\u003c/div>\n        \u003cdiv class=\"arrow-line\">\u003c/div>\n        \u003cdiv class=\"arrow-sub\">Исходящий mTLS / подпись агента\u003cbr/>Long-poll команд + SRT push медиа\u003c/div>\n        \u003cdiv class=\"arrow-block\">✕ Входящие снаружи невозможны\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"node\">\n        \u003cdiv class=\"node-title\">\n          \u003cspan>Ретранслятор (Relay)\u003c/span>\n          \u003cspan class=\"node-tag\" style=\"background:rgba(129,140,248,0.15);color:#818cf8;\">Zero-Knowledge\u003c/span>\n        \u003c/div>\n        \u003cul class=\"node-list\">\n          \u003cli>Только в RAM, без локальной копии базы\u003c/li>\n          \u003cli>Несёт запечатанные книги \u003cspan class=\"code-pill\">x25519:v1\u003c/span>\u003c/li>\n          \u003cli>\u003cstrong>Не может вскрыть\u003c/strong> \u003cspan class=\"code-pill\">token_secret\u003c/span> камеры\u003c/li>\n          \u003cli>Проверяет подпись и топологию дорог\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"arrow-box\">\n        \u003cdiv class=\"arrow-label\">Один поток и отчёты\u003c/div>\n        \u003cdiv class=\"arrow-line\">\u003c/div>\n        \u003cdiv class=\"arrow-sub\">Дельта-отчёты JCS с ревизией\u003cbr/>Суточный токен \u003cspan class=\"code-pill\">stream\u003c/span> (aud + ref)\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"node node-nvr\">\n        \u003cdiv class=\"node-title\">\n          \u003cspan>NVR / Кластер и Домен w2c\u003c/span>\n          \u003cspan class=\"node-tag\">Core / NVR\u003c/span>\n        \u003c/div>\n        \u003cul class=\"node-list\">\n          \u003cli>Приёмник (\u003cspan class=\"code-pill\">ingest\u003c/span>) раздаёт запись и live\u003c/li>\n          \u003cli>Изоляция ролей по Unix-сокетам и спеке\u003c/li>\n          \u003cli>Ключи домена только в процессе \u003cspan class=\"code-pill\">signer\u003c/span>\u003c/li>\n          \u003cli>Офлайн-проверка грантов и \u003cspan class=\"code-pill\">revoked\u003c/span>\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6 SECURITY PILLARS -->\n    \u003cdiv class=\"grid\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">01 • ZERO INBOUND\u003c/span>\n          \u003cspan class=\"card-scope\">Камера + NVR за NAT\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Камера и площадка стучатся сами — снаружи не взломать\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Все соединения (отчёты агента, \u003cstrong>long-poll\u003c/strong> желаний зрителя/архива, \u003cstrong>push\u003c/strong> видеопотока и дозаписи с SD-карты на приёмник NVR) открывает сама камера. Снаружи нет открытых RTSP/HTTP-портов; \u003cstrong>VPN в сеть камеры не нужен\u003c/strong> — по каналу ходят только типизированные команды, а не произвольный сетевой трафик.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">02 • BRSKI &amp; mTLS\u003c/span>\n          \u003cspan class=\"card-scope\">Аутентификация узлов\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Вступление без паролей (RFC 8995) и взаимный TLS\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Образ прошивки одинаков побайтово — \u003cstrong>общих секретов в прошивке нет\u003c/strong>. Устройство вступает в домен по заводскому \u003cspan class=\"code-pill\">IDevID\u003c/span> / TPM 2.0 и подписанному \u003cspan class=\"code-pill\">voucher\u003c/span> (или с одобрения в консоли), получает доменный \u003cspan class=\"code-pill\">LDevID\u003c/span> от УЦ заказчика и \u003cstrong>стирает временные учётные данные\u003c/strong>. Все межсерверные вызовы идут по mTLS с проверкой ролей.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">03 • E2E SEALING\u003c/span>\n          \u003cspan class=\"card-scope\">Хранение + пересылка\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Сквозное запечатывание секретов и слепой ретранслятор\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Любое поле \u003cspan class=\"code-pill\">*_secret\u003c/span> на флеше камеры и диске NVR запечатано кольцом (\u003cspan class=\"code-pill\">enc:v1\u003c/span>) с привязкой \u003cstrong>AAD к полному пути строки и JSON Pointer\u003c/strong> (перенос шифртекста в соседнюю строку не откроется). В дороге книги запечатаны к ключу \u003cspan class=\"code-pill\">X25519\u003c/span> получателя — \u003cstrong>ретранслятор и чужие узлы не могут прочитать токен потока\u003c/strong>.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">04 • URL &amp; CREDENTIAL HYGIENE\u003c/span>\n          \u003cspan class=\"card-scope\">Защита от утечек\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Архитектурный запрет паролей в адресах и логах\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Двери NVR и камеры \u003cstrong>отвергают на входе (400)\u003c/strong> любые URL со встроенным логином, паролем или секретным параметром (\u003cspan class=\"code-pill\">rtsp://user:pass@…\u003c/span>, \u003cspan class=\"code-pill\">?token=…\u003c/span>) ещё до сохранения в базу или отложенную правку. Снимки состояния (\u003cspan class=\"code-pill\">snapshot\u003c/span>), API и логи автоматически вычищают \u003cspan class=\"code-pill\">*_secret\u003c/span> и маскируют параметры.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">05 • LEAST PRIVILEGE BY SPEC\u003c/span>\n          \u003cspan class=\"card-scope\">Внутри NVR и сервера\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Изоляция процессов, Unix-сокеты ролей и ключи в Signer\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Права хранилища (\u003cspan class=\"code-pill\">configstore-rights.json\u003c/span>) генерируются из декларативной спеки: каждый сервис идёт через свой Unix-сокet роли и видит только свои префиксы. Закрытые ключи домена живут \u003cstrong>только в процессе \u003cspan class=\"code-pill\">w2c-domain (signer)\u003c/span>\u003c/strong> — ни консоль, ни воркеры VMS ключей не видят и просят узкие суточные токены (\u003cspan class=\"code-pill\">stream\u003c/span>/\u003cspan class=\"code-pill\">ask\u003c/span>) через сокет.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">06 • OFFLINE REVOCATION &amp; SURVIVAL\u003c/span>\n          \u003cspan class=\"card-scope\">Устойчивость и аудит\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Отзыв прав без связи с центром и работа в изоляции\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Токены называют только субъект и срок, а права проверяются локально по доставленным грантам и списку \u003cspan class=\"code-pill\">domain/revoked\u003c/span>; короткие сроки жизни гарантируют \u003cstrong>предсказуемое окно отзыва даже в офлайне\u003c/strong>. При потере связи с доменом NVR и камеры продолжают запись, проверку прав и локальный аудит.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- FOOTER -->\n    \u003cdiv class=\"footer\">\n      \u003cdiv>\u003cstrong>Ключевое отличие w2c:\u003c/strong> камера и NVR работают на одном и том же коде платформы — без устаревших ONVIF/RTSP-паролей, открытых портов и общих ключей в прошивке.\u003c/div>\n      \u003cdiv class=\"footer-highlight\">w2c Platform • Архитектура безопасности М10–М12\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n","en":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>w2c Platform — Cybersecurity in Camera &amp; NVR\u003c/title>\n  \u003cstyle>\n    :root {\n      --bg: #0b1020;\n      --bg-card: #131b33;\n      --bg-card-alt: #172240;\n      --border: #26355d;\n      --accent-cyan: #38bdf8;\n      --accent-emerald: #34d399;\n      --accent-indigo: #818cf8;\n      --accent-amber: #fbbf24;\n      --accent-rose: #fb7185;\n      --text-main: #f8fafc;\n      --text-muted: #94a3b8;\n      --text-dim: #64748b;\n    }\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n    body {\n      background: #060913;\n      color: var(--text-main);\n      font-family: -apple-system, BlinkMacSystemFont, \"Inter\", \"Segoe UI\", Roboto, sans-serif;\n      display: flex;\n      justify-content: center;\n      align-items: center;\n      min-height: 100vh;\n      padding: 24px;\n    }\n    .slide {\n      width: 1600px;\n      height: 900px;\n      background: radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.10), transparent 45%),\n                  radial-gradient(circle at 15% 85%, rgba(52, 211, 153, 0.08), transparent 45%),\n                  var(--bg);\n      border: 1px solid var(--border);\n      border-radius: 20px;\n      padding: 44px 56px;\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65);\n      position: relative;\n      overflow: hidden;\n    }\n    /* Header */\n    .header {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      border-bottom: 1px solid var(--border);\n      padding-bottom: 20px;\n    }\n    .badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      background: rgba(56, 189, 248, 0.12);\n      border: 1px solid rgba(56, 189, 248, 0.35);\n      color: var(--accent-cyan);\n      font-size: 13px;\n      font-weight: 700;\n      letter-spacing: 0.08em;\n      text-transform: uppercase;\n      padding: 5px 12px;\n      border-radius: 999px;\n      margin-bottom: 10px;\n    }\n    .title {\n      font-size: 34px;\n      font-weight: 800;\n      letter-spacing: -0.02em;\n      line-height: 1.15;\n    }\n    .subtitle {\n      font-size: 17px;\n      color: var(--text-muted);\n      margin-top: 6px;\n    }\n    .key-metric-box {\n      display: flex;\n      gap: 16px;\n    }\n    .metric {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 12px;\n      padding: 12px 18px;\n      text-align: right;\n    }\n    .metric-val {\n      font-size: 24px;\n      font-weight: 800;\n      color: var(--accent-emerald);\n    }\n    .metric-lbl {\n      font-size: 12px;\n      color: var(--text-muted);\n      margin-top: 2px;\n    }\n\n    /* Architecture Flow Strip */\n    .flow-strip {\n      background: linear-gradient(90deg, rgba(19,27,51,0.95), rgba(23,34,64,0.95));\n      border: 1px solid var(--border);\n      border-radius: 16px;\n      padding: 18px 28px;\n      display: grid;\n      grid-template-columns: 1.15fr 0.9fr 1fr 0.9fr 1.25fr;\n      align-items: center;\n      gap: 12px;\n    }\n    .node {\n      background: rgba(11, 16, 32, 0.75);\n      border: 1px solid rgba(129, 140, 248, 0.35);\n      border-radius: 12px;\n      padding: 14px 16px;\n    }\n    .node-cam {\n      border-color: rgba(52, 211, 153, 0.5);\n    }\n    .node-nvr {\n      border-color: rgba(56, 189, 248, 0.5);\n    }\n    .node-title {\n      font-size: 15px;\n      font-weight: 700;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 6px;\n    }\n    .node-tag {\n      font-size: 11px;\n      padding: 2px 8px;\n      border-radius: 99px;\n      background: rgba(52, 211, 153, 0.15);\n      color: var(--accent-emerald);\n      font-weight: 600;\n    }\n    .node-nvr .node-tag {\n      background: rgba(56, 189, 248, 0.15);\n      color: var(--accent-cyan);\n    }\n    .node-list {\n      font-size: 12.5px;\n      color: var(--text-muted);\n      line-height: 1.45;\n      list-style: none;\n    }\n    .node-list li::before {\n      content: \"• \";\n      color: var(--accent-cyan);\n    }\n    .arrow-box {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      text-align: center;\n      gap: 4px;\n    }\n    .arrow-line {\n      width: 100%;\n      height: 3px;\n      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-cyan));\n      position: relative;\n      border-radius: 2px;\n    }\n    .arrow-line::after {\n      content: \"►\";\n      position: absolute;\n      right: -6px;\n      top: -9px;\n      color: var(--accent-cyan);\n      font-size: 14px;\n    }\n    .arrow-label {\n      font-size: 11.5px;\n      font-weight: 700;\n      color: var(--text-main);\n    }\n    .arrow-sub {\n      font-size: 11px;\n      color: var(--text-muted);\n    }\n    .arrow-block {\n      font-size: 11px;\n      color: var(--accent-rose);\n      font-weight: 600;\n      background: rgba(251, 113, 133, 0.12);\n      border: 1px solid rgba(251, 113, 133, 0.3);\n      padding: 2px 8px;\n      border-radius: 6px;\n      margin-top: 2px;\n    }\n\n    /* 6 Cards Grid */\n    .grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 18px;\n    }\n    .card {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 20px 22px;\n      display: flex;\n      flex-direction: column;\n      gap: 10px;\n      position: relative;\n    }\n    .card-head {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 10px;\n    }\n    .card-num {\n      font-size: 12px;\n      font-weight: 800;\n      padding: 4px 9px;\n      border-radius: 6px;\n      background: rgba(56, 189, 248, 0.14);\n      color: var(--accent-cyan);\n      letter-spacing: 0.04em;\n    }\n    .card-scope {\n      font-size: 11px;\n      color: var(--text-dim);\n      font-weight: 600;\n      text-transform: uppercase;\n      letter-spacing: 0.05em;\n    }\n    .card-title {\n      font-size: 17px;\n      font-weight: 700;\n      color: var(--text-main);\n      line-height: 1.25;\n    }\n    .card-body {\n      font-size: 13.2px;\n      color: var(--text-muted);\n      line-height: 1.5;\n    }\n    .card-body strong {\n      color: #e2e8f0;\n      font-weight: 600;\n    }\n    .code-pill {\n      font-family: \"JetBrains Mono\", \"SFMono-Regular\", Menlo, monospace;\n      font-size: 11.5px;\n      background: rgba(15, 23, 42, 0.8);\n      border: 1px solid rgba(148, 163, 184, 0.2);\n      color: var(--accent-amber);\n      padding: 1px 6px;\n      border-radius: 4px;\n    }\n\n    /* Footer */\n    .footer {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      border-top: 1px solid var(--border);\n      padding-top: 14px;\n      font-size: 13px;\n      color: var(--text-muted);\n    }\n    .footer-highlight {\n      color: var(--accent-emerald);\n      font-weight: 600;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"slide\">\n    \u003c!-- HEADER -->\n    \u003cdiv class=\"header\">\n      \u003cdiv>\n        \u003cdiv class=\"badge\">w2c Platform Cybersecurity • Edge-to-Core\u003c/div>\n        \u003cdiv class=\"title\">Unified Zero-Trust Model: From Camera (“Cluster of One”) to NVR &amp; Domain\u003c/div>\n        \u003cdiv class=\"subtitle\">Security is built into the platform primitives — not bolted on via external firewalls or site-to-site VPNs\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"key-metric-box\">\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">0 Ports\u003c/div>\n          \u003cdiv class=\"metric-lbl\">open inbound on camera behind NAT / LTE\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">0 Passwords\u003c/div>\n          \u003cdiv class=\"metric-lbl\">in firmware images or RTSP/HTTP URLs\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"metric\">\n          \u003cdiv class=\"metric-val\">E2E Seal\u003c/div>\n          \u003cdiv class=\"metric-lbl\">on flash, in DB, in transit &amp; in backups\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ARCHITECTURE STRIP -->\n    \u003cdiv class=\"flow-strip\">\n      \u003cdiv class=\"node node-cam\">\n        \u003cdiv class=\"node-title\">\n          \u003cspan>w2c Camera (Cluster of 1)\u003c/span>\n          \u003cspan class=\"node-tag\">Edge\u003c/span>\n        \u003c/div>\n        \u003cul class=\"node-list\">\n          \u003cli>All inbound network doors closed externally\u003c/li>\n          \u003cli>Member key Ed25519 / X25519 + LDevID\u003c/li>\n          \u003cli>Secrets on flash under \u003cspan class=\"code-pill\">enc:v1\u003c/span> + AAD\u003c/li>\n          \u003cli>Local SD ring buffer with zero gap on outage\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"arrow-box\">\n        \u003cdiv class=\"arrow-label\">Camera Dials Out\u003c/div>\n        \u003cdiv class=\"arrow-line\">\u003c/div>\n        \u003cdiv class=\"arrow-sub\">Outbound mTLS / signed agent reports\u003cbr/>Command long-poll + SRT media push\u003c/div>\n        \u003cdiv class=\"arrow-block\">✕ External inbound attacks impossible\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"node\">\n        \u003cdiv class=\"node-title\">\n          \u003cspan>Stateless Relay\u003c/span>\n          \u003cspan class=\"node-tag\" style=\"background:rgba(129,140,248,0.15);color:#818cf8;\">Zero-Knowledge\u003c/span>\n        \u003c/div>\n        \u003cul class=\"node-list\">\n          \u003cli>RAM-only state, no local database copy\u003c/li>\n          \u003cli>Carries sealed books \u003cspan class=\"code-pill\">x25519:v1\u003c/span>\u003c/li>\n          \u003cli>\u003cstrong>Cannot decrypt\u003c/strong> camera \u003cspan class=\"code-pill\">token_secret\u003c/span>\u003c/li>\n          \u003cli>Verifies signatures &amp; road topology\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"arrow-box\">\n        \u003cdiv class=\"arrow-label\">Single Stream &amp; Reports\u003c/div>\n        \u003cdiv class=\"arrow-line\">\u003c/div>\n        \u003cdiv class=\"arrow-sub\">JCS delta reports with revision\u003cbr/>24h \u003cspan class=\"code-pill\">stream\u003c/span> token (aud + ref)\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"node node-nvr\">\n        \u003cdiv class=\"node-title\">\n          \u003cspan>NVR / Cluster &amp; w2c Domain\u003c/span>\n          \u003cspan class=\"node-tag\">Core / NVR\u003c/span>\n        \u003c/div>\n        \u003cul class=\"node-list\">\n          \u003cli>\u003cspan class=\"code-pill\">ingest\u003c/span> receiver fans out live &amp; recording\u003c/li>\n          \u003cli>Role isolation via Unix sockets &amp; spec\u003c/li>\n          \u003cli>Domain keys isolated inside \u003cspan class=\"code-pill\">signer\u003c/span> process\u003c/li>\n          \u003cli>Offline grant verification &amp; \u003cspan class=\"code-pill\">revoked\u003c/span> list\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 6 SECURITY PILLARS -->\n    \u003cdiv class=\"grid\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">01 • ZERO INBOUND\u003c/span>\n          \u003cspan class=\"card-scope\">Camera + NVR behind NAT\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Outbound-Only Connectivity — Unhackable from Outside\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Every connection (agent reports, viewer/archive \u003cstrong>long-poll\u003c/strong> intents, live media \u003cstrong>push\u003c/strong>, and SD-card backfill to the NVR receiver) is initiated outbound by the camera itself. There are zero open RTSP/HTTP ports externally, and \u003cstrong>no site VPN is needed\u003c/strong> — only strictly typed platform commands cross the link, never raw IP traffic.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">02 • BRSKI &amp; mTLS\u003c/span>\n          \u003cspan class=\"card-scope\">Node Authentication\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Passwordless Onboarding (RFC 8995) &amp; Mutual TLS\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Firmware images are byte-identical across units — \u003cstrong>zero shared secrets in firmware\u003c/strong>. Devices join the domain using factory \u003cspan class=\"code-pill\">IDevID\u003c/span> / TPM 2.0 and a signed \u003cspan class=\"code-pill\">voucher\u003c/span> (or console approval), receive a customer-CA \u003cspan class=\"code-pill\">LDevID\u003c/span>, and \u003cstrong>permanently wipe bootstrap credentials\u003c/strong>. All inter-service calls use role-verified mTLS.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">03 • E2E SEALING\u003c/span>\n          \u003cspan class=\"card-scope\">At Rest &amp; In Transit\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">End-to-End Secret Sealing &amp; Zero-Knowledge Relay\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Every \u003cspan class=\"code-pill\">*_secret\u003c/span> field on camera flash and NVR disks is sealed by the keyring (\u003cspan class=\"code-pill\">enc:v1\u003c/span>) with \u003cstrong>AAD bound to the exact row path and JSON Pointer\u003c/strong> (copying ciphertext to another row fails decryption). In transit, config books are sealed to the recipient’s \u003cspan class=\"code-pill\">X25519\u003c/span> key — \u003cstrong>relays and peer nodes cannot read stream tokens\u003c/strong>.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">04 • URL &amp; CREDENTIAL HYGIENE\u003c/span>\n          \u003cspan class=\"card-scope\">Leak Prevention\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Architectural Ban on Credentials in URLs &amp; Logs\u003c/div>\n        \u003cdiv class=\"card-body\">\n          NVR and camera doors \u003cstrong>reject at ingress (HTTP 400)\u003c/strong> any URL containing embedded usernames, passwords, or secret query parameters (\u003cspan class=\"code-pill\">rtsp://user:pass@…\u003c/span>, \u003cspan class=\"code-pill\">?token=…\u003c/span>) before it ever touches storage or pending queues. State snapshots (\u003cspan class=\"code-pill\">snapshot\u003c/span>), APIs, and logs automatically strip \u003cspan class=\"code-pill\">*_secret\u003c/span> fields.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">05 • LEAST PRIVILEGE BY SPEC\u003c/span>\n          \u003cspan class=\"card-scope\">Inside NVR &amp; Server\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Process Isolation, Role Unix Sockets &amp; Signer Enclave\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Storage permissions (\u003cspan class=\"code-pill\">configstore-rights.json\u003c/span>) are generated directly from the declarative spec: each service connects over its own role Unix socket and sees only its key prefixes. Domain private keys live \u003cstrong>exclusively inside \u003cspan class=\"code-pill\">w2c-domain (signer)\u003c/span>\u003c/strong> — neither the console nor VMS workers ever touch private keys, requesting narrow 24h tokens (\u003cspan class=\"code-pill\">stream\u003c/span>/\u003cspan class=\"code-pill\">ask\u003c/span>) over a local socket.\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-head\">\n          \u003cspan class=\"card-num\">06 • OFFLINE REVOCATION &amp; SURVIVAL\u003c/span>\n          \u003cspan class=\"card-scope\">Resilience &amp; Audit\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-title\">Offline Access Revocation &amp; Disconnected Survival\u003c/div>\n        \u003cdiv class=\"card-body\">\n          Tokens carry only subject identity and expiry, while permissions are checked locally against replicated grants and the \u003cspan class=\"code-pill\">domain/revoked\u003c/span> list; short lifetimes guarantee a \u003cstrong>bounded revocation window even offline\u003c/strong>. If cut off from the domain, NVRs and cameras continue recording, enforcing permissions, and logging local audit trails.\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- FOOTER -->\n    \u003cdiv class=\"footer\">\n      \u003cdiv>\u003cstrong>The w2c Difference:\u003c/strong> cameras and NVRs run the exact same platform engine — eliminating legacy ONVIF/RTSP passwords, open inbound ports, and hardcoded firmware keys.\u003c/div>\n      \u003cdiv class=\"footer-highlight\">w2c Platform • Security Architecture (M10–M12)\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/body>\n\u003c/html>\n"}}]</script>
  <script>
    "use strict";
    const slides = JSON.parse(document.getElementById("slideContent").textContent);
    const canvas = { width: 1920, height: 1080 };
    const labels = {
      ru: { title: "Платформа w2c", subtitle: "Архитектура и возможности", previous: "Назад", next: "Вперёд", languages: "Язык презентации", pagination: "Выбор слайда", slide: "Слайд", loading: "Загрузка слайда…", keys: "Стрелки ← / → — сменить слайд" },
      en: { title: "w2c Platform", subtitle: "Architecture and capabilities", previous: "Previous", next: "Next", languages: "Presentation language", pagination: "Choose a slide", slide: "Slide", loading: "Loading slide…", keys: "Arrow keys ← / → to change slides" }
    };
    const frame = document.getElementById("slideFrame");
    const viewport = document.getElementById("viewport");
    const stage = document.getElementById("stage");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const pagination = document.getElementById("pagination");
    const pageButtons = slides.map((_, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.addEventListener("click", () => navigate(index));
      pagination.appendChild(button);
      return button;
    });
    let language = "ru";
    let current = 0;
    let loadedKey = "";
    try { if (localStorage.getItem("w2c.slides.language") === "en") language = "en"; } catch (_) {}

    function readLocation() {
      const params = new URLSearchParams(location.hash.slice(1));
      if (["ru", "en"].includes(params.get("lang"))) language = params.get("lang");
      const index = slides.findIndex(slide => slide.id === params.get("slide"));
      if (index >= 0) current = index;
    }
    function saveLocation() {
      const hash = "#" + new URLSearchParams({ slide: slides[current].id, lang: language });
      if (location.hash !== hash) history.replaceState(null, "", hash);
    }
    function fitSlide() {
      const scale = Math.max(0, Math.min(stage.clientWidth / canvas.width, stage.clientHeight / canvas.height));
      viewport.style.width = (canvas.width * scale) + "px";
      viewport.style.height = (canvas.height * scale) + "px";
      viewport.style.setProperty("--slide-scale", scale);
    }
    function navigate(index) {
      const destination = Math.max(0, Math.min(slides.length - 1, index));
      if (destination === current) return;
      current = destination;
      render();
      // A boundary button becomes disabled; keep keyboard focus on an available control.
      if (document.activeElement === previous && previous.disabled) next.focus();
      if (document.activeElement === next && next.disabled) previous.focus();
    }
    function handleKey(event) {
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest?.("input, textarea, select, [contenteditable]")) return;
      const destination = { ArrowLeft: current - 1, ArrowRight: current + 1, Home: 0, End: slides.length - 1 }[event.key];
      if (destination === undefined) return;
      event.preventDefault();
      navigate(destination);
    }
    function render() {
      const text = labels[language];
      const slide = slides[current];
      document.documentElement.lang = language;
      document.title = `${text.title} — ${slide.title[language]}`;
      document.getElementById("deckTitle").textContent = text.title;
      document.getElementById("deckSubtitle").textContent = text.subtitle;
      document.getElementById("previousLabel").textContent = text.previous;
      document.getElementById("nextLabel").textContent = text.next;
      document.getElementById("languages").setAttribute("aria-label", text.languages);
      pagination.setAttribute("aria-label", text.pagination);
      stage.setAttribute("aria-label", text.slide);
      stage.title = text.keys;
      document.getElementById("loading").textContent = text.loading;
      document.getElementById("counter").textContent = `${current + 1} / ${slides.length}`;
      document.getElementById("slideTitle").textContent = slide.title[language];
      document.querySelectorAll("[data-lang]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.lang === language)));
      previous.disabled = current === 0;
      next.disabled = current === slides.length - 1;
      pageButtons.forEach((button, index) => {
        const item = slides[index];
        button.setAttribute("aria-label", `${text.slide} ${index + 1}: ${item.title[language]}`);
        button.title = item.title[language];
        if (index === current) button.setAttribute("aria-current", "step");
        else button.removeAttribute("aria-current");
      });
      frame.title = slide.title[language];
      const key = slide.id + ":" + language;
      if (loadedKey !== key) {
        loadedKey = key;
        viewport.classList.remove("ready");
        viewport.setAttribute("aria-busy", "true");
        const embedStyle = `<meta name="w2c-slide" content="${key}"><style>html,body{margin:0;padding:0;width:${canvas.width}px;height:${canvas.height}px;min-height:${canvas.height}px;overflow:hidden}body{display:block}.slide{width:${canvas.width}px;height:${canvas.height}px;flex-shrink:0}</style>`;
        frame.srcdoc = slide.html[language].replace("</head>", embedStyle + "</head>");
      }
      saveLocation();
      fitSlide();
    }
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      if (doc?.querySelector('meta[name="w2c-slide"]')?.content !== loadedKey) return;
      doc.addEventListener("keydown", handleKey);
      viewport.classList.add("ready");
      viewport.setAttribute("aria-busy", "false");
    });
    previous.addEventListener("click", () => navigate(current - 1));
    next.addEventListener("click", () => navigate(current + 1));
    document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => {
      language = button.dataset.lang;
      try { localStorage.setItem("w2c.slides.language", language); } catch (_) {}
      render();
    }));
    document.addEventListener("keydown", handleKey);
    window.addEventListener("hashchange", () => { readLocation(); render(); });
    new ResizeObserver(fitSlide).observe(stage);
    readLocation();
    render();
  </script>
</body>
</html>
