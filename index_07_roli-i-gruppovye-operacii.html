      <optgroup label="${i18n("Встроенные шаблоны")}">${tpls}</optgroup><optgroup label="${i18n("Существующие роли")}">${roles}</optgroup></select>
      <p class="acc-hint" style="margin-top:6px">${i18n("Права заполнятся сразу, на шаге «Права» их можно поменять")}</p></div>`;
}
// Заполняет права мастера по основе, не перерисовывая окно. У роли берём её
// глобальные права, расписание, супервизора и права на камеры в папках текущего
// домена, которые мастер умеет показывать; остальное не переносится.
function accWzFill(v){
  const w=accWz;w.base=v;w.baseName="";w.lostGrp=0;w.skipUnr=false;w.grp={};w.g=accNoRights();w.tz=0;w.sup={role:"",login:false,export:false};
  const t=v.startsWith("tpl:")?v.slice(4):"",r=v.startsWith("role:")?accRole(v.slice(5)):null;
  if(t&&ACC_TPL[t]){w.g=accTplOwn(t);w.baseName=i18n(ACC_TPL[t][0])}
  else if(r){
    w.g={...accNoRights(),...accClone(r.own)};w.baseName=r.n;w.comment=r.comment||"";
    if(w.g.unr){w.g.unr=false;w.skipUnr=true}
    w.tz=r.tz||0;w.sup=accClone(r.sup||{role:"",login:false,export:false});
    const vis=new Set(accGroups(domainFilter).filter(x=>x.depth<=2).map(x=>x.id));
    Object.entries(r.groups||{}).forEach(([gid,o])=>{if(!o.cam)return;if(vis.has(gid))w.grp[gid]=o.cam;else w.lostGrp++});
  }else w.base="";
  w.snapG=accClone(w.g);w.snapGrp=accClone(w.grp);
}
function accWzBase(v){accWzFill(v);accWzRender()}
// Что сказать о происхождении прав: сравниваем с тем, чем заполнили, поэтому
// правка и возврат к исходному не считаются изменением.
function accWzBaseText(){
  const w=accWz,kind=w.base.startsWith("role:")?"role":w.base.startsWith("tpl:")?"tpl":"";
  const dirty=accCanon(w.g)!==accCanon(w.snapG)||accCanon(w.grp)!==accCanon(w.snapGrp);
  if(!kind)return i18n(dirty?"Заполнено вручную":"Пустая роль, права не заданы");
  return`${i18n(kind==="role"?"Заполнено по роли":"Заполнено по шаблону")} «${escHtml(w.baseName)}»${dirty?`, ${i18n("изменено вручную")}`:""}`;
}
function accWzBaseNote(){
  const w=accWz;
  const lost=w.base.startsWith("role:")?`<br>${i18n("Не копируются: права на объекты и другие типы устройств, назначения (назначить роль тем же можно на шаге «Кому»)")}${w.lostGrp?`, ${i18n("права на папки других доменов и глубже второго уровня")}`:""}${w.skipUnr?`, ${i18n("неограниченный доступ")}`:""}`:"";
  return`<div class="nt">${accWzBaseText()}${lost}</div>`;
}
// «Кому»: группы пользователей (основной путь — одна строка вместо десятков
// галочек), отдельные пользователи или новый пользователь. Выбранное — чипами
// над списком. Пользователи не показываются, пока не ищут и не выбран фильтр:
// их сотни. При роли «на основе» можно одним нажатием назначить тем же.
function accWzUser(){
  const w=accWz;
  const mode=`<div class="acc-seg">${[["none","Пока никому"],["pick","Группы и пользователи"],["new","Новый пользователь"]].map(([k,t])=>`<button type="button" class="${w.who===k?"on":""}" onclick="accWz.who='${k}';accWzRender()">${i18n(t)}</button>`).join("")}</div>`;
  const head=accWzSameHtml()+mode;
  const until=lbl=>`<div class="acc-wz-f" style="margin-top:12px"><label>${i18n(lbl)}</label><div class="acc-pwd"><input type="date" value="${w.until}" style="max-width:200px" onchange="accWzSet('until',this.value)"><span class="sub" style="align-self:center">${i18n("пусто — бессрочно")}</span></div>${accErr("until")}</div>`;
  if(w.who==="none")return head+`<p class="acc-hint" style="margin-top:12px">${i18n("Роль будет создана без пользователей. Добавить их можно потом на странице роли: «Назначения» → «Добавить пользователей…» или через группу пользователей")}</p>`;
  if(w.who==="new")return head+`<div class="g" style="margin-top:14px">
      <div><label>${i18n("Логин")}</label><input type="text" value="${escHtml(w.login)}" autocomplete="off" oninput="accWzSet('login',this.value)">${accErr("login")}</div>
      <div><label>${i18n("Имя")}</label><input type="text" value="${escHtml(w.uname)}" oninput="accWz.uname=this.value"></div>
      <div><label>E-mail</label><input type="text" value="${escHtml(w.email)}" oninput="accWzSet('email',this.value)">${accErr("email")}</div>
      <div><label>${i18n("Состояние")}</label><div class="ln ln-sw" style="padding:6px 0">${accSw(w.on,"accWz.on=!accWz.on;accWzRender()",false,"Включён")}<div>${i18n(w.on?"Включён":"Выключен")}</div></div></div>
      <div><label>${i18n("Учётная запись действует до")}</label><input type="date" value="${w.expires}" onchange="accWzSet('expires',this.value)">${accErr("expires")}</div>
    </div>
    ${accPwdFieldHtml(w,"accWzSet('pwd',this.value)","accWz.pwd=accGenPwd();accWz.show=true;accWzRender()","accWz.show=!accWz.show;accWzRender()",accErr)}${until("Роль действует до")}`;
  const ug=w.pk.tab==="groups";
  return head+`<div class="acc-pk-sel" id="accWzSel" style="margin-top:12px">${accWzSelHtml()}</div>
    <div class="acc-filts" id="accWzPkT" style="margin:0 0 8px">${accWzTabsHtml()}</div>
    <div class="sq lst-sq" style="margin:0 0 8px"><span class="sq-lead">${IC_FIND}</span><input type="text" value="${escHtml(w.pk.q)}" placeholder="${i18n(ug?"Название группы…":"Логин или имя…")}" autocomplete="off" oninput="accWz.pk.q=this.value;accWzPkLive()"></div>
    ${ug?"":`<div class="acc-filts" id="accWzPkF" style="margin-bottom:8px">${accWzFiltHtml()}</div>`}
    <div class="acc-ad-h"><span class="sub" id="accWzPkCnt">${accWzCntText()}</span>${accWzAllHtml()}</div>
    <div class="acc-ulist" id="accWzUl">${accWzListHtml()}</div>${accErr("assigned")}
    ${until("Роль действует до — для назначенных лично")}
    <p class="acc-hint" style="margin-top:6px">${i18n("Группе срок задаётся на её странице: он общий для всех ролей группы")}</p>`;
}
function accWzPool(){return accUsers().filter(u=>u.login!==ACC_ME)}
function accWzFound(){
  const pk=accWz.pk,q=pk.q.trim().toLowerCase();
  if(pk.tab==="groups")return accGroupsAll().filter(g=>!q||g.n.toLowerCase().includes(q));
  if(!q&&pk.chip==="all")return[];
  return accWzPool().filter(u=>(pk.chip==="all"||(pk.chip==="sel"?accWz.assigned.has(u.id):pk.chip==="none"?!accUserRoles(u,false).length:!!u.ldap))&&(!q||u.login.toLowerCase().includes(q)||u.name.toLowerCase().includes(q)));
}
// Кто получит роль: выбранные лично и участники выбранных групп, без повторов.
function accWzPeople(){const w=accWz;return new Set([...w.assigned,...[...w.ugs].flatMap(id=>accUG(id)?.members||[])])}
function accWzTabsHtml(){

function accWzFiltHtml(){

    .map(([id,t,n])=>`<button type="button" class="acc-filt ${pk.chip===id?"on":""}" onclick="accWz.pk.chip='${id}';accWzPkLive()">${i18n(t)} <b>${n}</b></button>`).join("");

function accWzListHtml(){

  }
  if(!list.length)return`<p class="sub">${i18n(!pk.q.trim()&&pk.chip==="all"?"Начните вводить логин или имя — или выберите фильтр «Без ролей» или «LDAP»":"Ничего не найдено")}</p>`;
  const via=new Map();[...w.ugs].forEach(id=>{const g=accUG(id);(g?.members||[]).forEach(u=>{if(!via.has(u))via.set(u,g)})});

    if(q){
      if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}
      else{f+=c;if(c==="\n"||(c==="\r"&&t[i+1]!=="\n"))ln++}
      continue;
    }
    if(c==='"'&&f===""){q=true;qLn=ln}
    else if(c===sep){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;end();ln++}
    else f+=c;
  }
  if(f!==""||row.length)end();
  if(q)rows.openQuote=qLn;

function accImpDate(s){
  let y,m,d,x;
  if((x=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))){y=+x[1];m=+x[2];d=+x[3]}
  else if((x=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s))){d=+x[1];m=+x[2];y=+x[3]}
  else return null;
  const t=new Date(y,m-1,d,12);
  return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d?accLocalIso(t):null;
}

// Кодировка файла: BOM UTF-16, иначе строгий UTF-8, а если не вышло — windows-1251.
function accImpDecode(b){
  if(b[0]===0xFF&&b[1]===0xFE)return{enc:"UTF-16LE",text:new TextDecoder("utf-16le").decode(b)};
  if(b[0]===0xFE&&b[1]===0xFF)return{enc:"UTF-16BE",text:new TextDecoder("utf-16be").decode(b)};
  try{return{enc:"UTF-8",text:new TextDecoder("utf-8",{fatal:true}).decode(b)}}
  catch(e){return{enc:"windows-1251",text:new TextDecoder("windows-1251").decode(b)}}
}
function accImpFile(inp){

  const rd=new FileReader();

    if(accIm!==m0)return;
    let d;try{d=accImpDecode(new Uint8Array(rd.result))}catch(e){toast("Не удалось прочитать файл");return}
    m0.text=d.text.replace(/^\ufeff/,"");m0.file=f.name;m0.enc=d.enc;m0.err="";accImpRender();
  };
  rd.onerror=()=>toast("Не удалось прочитать файл");
  rd.readAsArrayBuffer(f);
}

// Проверка целиком: ничего не пишет, только разбирает и сверяет с текущим черновиком.
function accImpRun(){
  const m=accIm,text=m.text.replace(/^\ufeff/,""),sep=accCsvSep(text),table=accCsvParse(text,sep);
  const res={sep,rows:[],cols:[],unknown:[],fatal:"",cnt:{new:0,upd:0,skip:0,err:0}};
  if(table.openQuote){res.fatal=`${i18n("Не закрыта кавычка в строке")} ${table.openQuote}`;return res}
  if(!table.length){res.fatal=i18n("В тексте нет строк");return res}
  const idx={};let data=table;
  if(m.hdr){
    data=table.slice(1);
    table[0].forEach((h,i)=>{
      const n=accImNorm(h),k=Object.keys(ACC_CSV_ALIAS).find(x=>ACC_CSV_ALIAS[x].includes(n));
      if(k&&idx[k]==null)idx[k]=i;else if(h)res.unknown.push(h);
    });
    if(idx.login==null){res.fatal=i18n("Не найден столбец «login» (или «логин»): проверьте первую строку или снимите галочку «Первая строка — заголовок»");return res}
  }else{const w=Math.max(...table.map(x=>x.length));ACC_CSV_COLS.forEach((k,i)=>{if(i<w)idx[k]=i})}
  res.cols=ACC_CSV_COLS.filter(k=>idx[k]!=null);
  if(!data.length){res.fatal=i18n("Кроме заголовка в тексте нет строк");return res}
  const lc=s=>String(s).trim().toLowerCase();
  const roleBy=s=>accRoles().find(r=>lc(r.n)===lc(s))||accRoles().find(r=>lc(r.id)===lc(s))||null;
  const grpBy=s=>{const l=accGroupsAll().filter(g=>lc(g.n)===lc(s));return l.find(g=>!g.src)||l[0]||accGroupsAll().find(g=>lc(g.id)===lc(s))||null};
  const split=s=>s.split("|").map(x=>x.trim()).filter(Boolean);
  const unq=v=>/^'[=+\-@]/.test(v)?v.slice(1):v;  // обратная сторона защиты от формул при выгрузке
  const seen=new Map(),today=accIso(0);
  data.forEach((row,i)=>{
    const g=k=>idx[k]==null?"":unq(String(row[idx[k]]??"")).trim();
    const n=row.ln,login=g("login"),e=[],notes=[];
    const r={n,login,name:g("name"),status:"err",errs:e,notes,op:null};
    res.rows.push(r);
    const low=lc(login);
    if(!login){e.push(i18n("Не заполнен логин"));return}
    const li=accLoginIssue(login),cur=accUsers().find(u=>lc(u.login)===low)||null;
    if(seen.has(low)){e.push(`${i18n("Логин повторяется, первая строка")} — ${seen.get(low)}`);return}
    seen.set(low,n);
    if(li&&!cur){e.push(i18n(li));return}
    if(cur&&m.mode==="skip"){r.status="skip";notes.push(i18n("Уже есть — пропущено"));return}
    if(cur&&cur.login===ACC_ME){e.push(i18n("Свою учётную запись менять нельзя"));return}
    // поля
    const email=g("email"),ei=accEmailIssue(email);if(ei)e.push(i18n(ei));
    let on=null;const es=lc(g("enabled"));
    if(es){if(["1","да","true","yes","вкл"].includes(es))on=true;else if(["0","нет","false","no","выкл"].includes(es))on=false;else e.push(i18n("Включён: ожидается 1/0, да/нет или true/false"))}
    const rolesGiven=!!g("roles"),ids=[];
    split(g("roles")).forEach(nm=>{const ro=roleBy(nm);if(!ro)e.push(`${i18n("Неизвестная роль")} «${nm}»`);else if(!ids.includes(ro.id))ids.push(ro.id)});
    const finalRoles=rolesGiven?ids:(cur?cur.roles.slice():[]),untilMap={};
    split(g("role_until")).forEach(part=>{
      const at=part.lastIndexOf("=");
      if(at<1){e.push(`${i18n("Срок роли: ожидается роль=дата")}, «${part}»`);return}
      const nm=part.slice(0,at).trim(),ro=roleBy(nm),d=accImpDate(part.slice(at+1).trim());
      if(!ro){e.push(`${i18n("Неизвестная роль")} «${nm}»`);return}
      if(!finalRoles.includes(ro.id)){e.push(`${i18n("Срок задан для роли, которой нет в списке ролей")}: «${ro.n}»`);return}
      if(!d){e.push(`${i18n("Срок роли")} «${ro.n}»: ${i18n("дата не распознана, нужен формат ГГГГ-ММ-ДД или ДД.ММ.ГГГГ")}`);return}
      if(d<today&&(!cur||accDirUntil(cur,ro.id)!==d)){e.push(`${i18n("Срок роли")} «${ro.n}»: ${i18n("срок уже прошёл")}`);return}
      untilMap[ro.id]=d;
    });
    let acct=g("account_until");
    if(acct){const d=accImpDate(acct);
      if(!d){e.push(`${i18n("Срок учётной записи")}: ${i18n("дата не распознана, нужен формат ГГГГ-ММ-ДД или ДД.ММ.ГГГГ")}`);acct=""}
      else if(d<today&&(!cur||cur.expires!==d)){e.push(`${i18n("Срок учётной записи")}: ${i18n("срок уже прошёл")}`);acct=""}
      else acct=d}
    const lim=k=>{const s=g(k);if(!s)return null;if(!/^\d{1,2}$/.test(s)){e.push(i18n("Лимит подключений — число от 0 до 99"));return null}return +s};
    const web=lim("web_limit"),mob=lim("mobile_limit");
    const gTarget=[];
    split(g("groups")).forEach(nm=>{
      const gr=grpBy(nm);
      if(!gr){e.push(`${i18n("Неизвестная группа")} «${nm}»`);return}
      if(gr.src){if(!(cur&&gr.members.includes(cur.id)))notes.push(`${i18n("Группа")} «${gr.n}»: ${i18n("в группу каталога не добавляется")}`);return}

      if(!finalRoles.length)notes.push(i18n("Без ролей — войти не сможет"));
      r.status="new";return;
    }
    // существующий: только непустые ячейки, и только то, что действительно меняется
    const p={};
    if(cur.ldap){if((r.name&&r.name!==cur.name)||(email&&email!==cur.email))notes.push(i18n("Имя и e-mail ведёт каталог — не меняются"))}
    else{if(r.name&&r.name!==cur.name)p.name=r.name;if(email&&email!==cur.email)p.email=email}
    if(on!=null&&on!==cur.on)p.on=on;
    const nu={};finalRoles.forEach(id=>{const d=untilMap[id]!==undefined?untilMap[id]:(cur.roles.includes(id)?accDirUntil(cur,id):"");if(d)nu[id]=d});
    if(rolesGiven||Object.keys(untilMap).length){
      if(accCanon(finalRoles)!==accCanon(cur.roles)||accCanon(nu)!==accCanon(cur.until||{})){p.roles=finalRoles;p.until=nu}
    }
    if(acct&&acct!==(cur.expires||""))p.expires=acct;
    if(web!=null&&web!==(cur.web||0))p.web=web;
    if(mob!=null&&mob!==(cur.mobile||0))p.mobile=mob;
    const had=accGroupsAll().filter(x=>!x.src&&x.members.includes(cur.id)).map(x=>x.id);
    let add=[],del=[];
    if(g("groups")&&accCanon(gTarget)!==accCanon(had)){p.groups=gTarget;add=gTarget.filter(id=>!had.includes(id));del=had.filter(id=>!gTarget.includes(id))}
    if(!Object.keys(p).length){r.status="skip";notes.push(i18n("Без изменений"));return}
    r.op={kind:"upd",id:cur.id,login:cur.login,patch:p,addGroups:add,delGroups:del,delRoles:p.roles?cur.roles.filter(id=>!p.roles.includes(id)):[]};
    r.status="upd";
  });
  // Защита от самоблокировки, как в accGuard, но с указанием строки: строки, меняющие
  // пользователя с неограниченным доступом, применяются к копии по одной.
  let trial=null;
  res.rows.forEach(r=>{
    if(r.status!=="upd"||!accHasUnr(accUser(r.op.id),accSt()))return;
    const t=accClone(trial||accSt());
    accImpMutate(t,r);accResolveAll(t);

    else trial=t;
  });

}

function accImpMutate(st,r){

    u={id:r.uid||"imp"+r.n,login:o.login,name:o.name,email:o.email,on:o.on,roles:[...o.roles],last:null,created:accIso(0),until:{...o.until},expires:o.expires,web:o.web,mobile:o.mobile,ldap:"",pwdSet:true,must:true,imported:true};
    st.users.push(u);

    ["name","email","on","expires","web","mobile"].forEach(f=>{if(f in o.patch)u[f]=o.patch[f]});
    if(o.patch.roles){u.roles=[...o.patch.roles];u.until={...o.patch.until}}
    u.impUpd=true;u.impTouched=Object.keys(o.patch);

  const want=r.status==="new"?o.groups:o.patch.groups;
  if(want)st.groups.forEach(g=>{

  });

    if(c==="\\"&&line[i+1]===","){cur+=",";i++;continue}
    if(c===","&&!quote){out.push(cur.trim());cur="";continue}

    const v=new DataView(buf),chars=[];for(let i=4;i+3<b.length;i+=4)chars.push(String.fromCodePoint(v.getUint32(i,true)));return chars.join("");
  }
  if(b.length>=4&&b[0]===0&&b[1]===0&&b[2]===0xfe&&b[3]===0xff){
    const v=new DataView(buf),chars=[];for(let i=4;i+3<b.length;i+=4)chars.push(String.fromCodePoint(v.getUint32(i,false)));return chars.join("");

function parseCsvDeviceRows(text){
  const lines=text.split(/\r?\n/).filter(x=>x.trim());

  const dataLines=hasHeader?lines.slice(1):lines;

function navRecord(){

  const loc=navLoc(),key=navKey(loc),cur=navHist[navPos],ev=window.event||null,force=navForce;navForce=false;
  if(cur&&cur.key===key&&!force){cur.loc={...loc,sc:cur.loc.sc,foc:cur.loc.foc};cur.title=navTitle();navSync();return}

    if(x.type==="server"&&!isUnallocated(x.id)){
      devicePool.filter(d=>(d.type==="camera"||d.type==="ipsrv")&&d.srvId===x.id).forEach(d=>visit(d,false));
      serverCameras(x.id).forEach(c=>visit(c,false));
    }
    if(x.type==="archive"){
      devicePool.filter(d=>d.type==="ipsrv"&&ipsrvCameras(d).some(c=>isRecording(c)&&c.arch===x.id)).forEach(d=>{seen.add(d.id);if(canMultiPick(d)&&selfInView(d)&&matchesSearch(d,q)&&!busy.has(d.id)&&!pendingDelHas(d.id))out.push(d)});
      archCameras(x.id).forEach(c=>visit(c,false));
    }
  };
  visit(n,false);return out;
}
// «Отметить внутри» по типу — как узлы Cameras / Inputs / Outputs у Milestone
// и однотипные группы: галочка контейнера берёт камеры и регистраторы, а
// реле, датчики и прочую начинку отмечают отсюда — все сразу, но одного типа.
const MARK_TYPE_ORDER=["camera","ipsrv","channel","relay","sensor","mic","spk","ptz","eventsrc"];
const MARK_TYPE_RU={camera:"Камеры",ipsrv:"IP-серверы",channel:"Каналы",relay:"Реле",sensor:"Датчики",mic:"Микрофоны",spk:"Динамики",ptz:"PTZ",eventsrc:"Источники событий"};
function markTypeLabel(t){return i18n(MARK_TYPE_RU[t]||LB[t]||t)}
function markTypeRank(t){const i=MARK_TYPE_ORDER.indexOf(t);return i<0?99:i}
function insideByType(n){
  const by=new Map();
  // В хранилище пишут камеры и регистраторы — их начинка тут ни при чём.
  selDescendants(n,n.type!=="archive").forEach(x=>{if(!by.has(x.type))by.set(x.type,[]);by.get(x.type).push(x)});
  return[...by.entries()].sort((a,b)=>markTypeRank(a[0])-markTypeRank(b[0]));
}
function markInsideItems(n){
  if(app!=="hw")return[];
  const groups=insideByType(n);if(!groups.length)return[];
  return[`<div class="tctx-head">${i18n(n.type==="archive"?"Отметить пишущие сюда":"Отметить внутри")}</div>`,
    ...groups.map(([t,list])=>tctxItem(`${markTypeLabel(t)} (${list.length})`,`markInside('${n.id}','${t}')`,`<span class="tctx-ic">${ic(t)}</span>`))];
}
function markInside(id,type){

function decorateTreeSel(){
  const treeEl=document.getElementById("tree");if(!treeEl)return;
  const on=selMode&&app==="hw",busy=busyIds();
  treeEl.classList.toggle("selmode",on);
  treeEl.querySelectorAll(".n-chk,.pending-chip,.busy-chip").forEach(el=>el.remove());
  treeEl.querySelectorAll(".n.pending,.n.busy").forEach(el=>el.classList.remove("pending","busy"));
  treeEl.querySelectorAll(".n[data-pick]").forEach(row=>{
    const id=row.dataset.pick,f=find(id);if(!f)return;
    const multi=treeSel.size>1&&selShownAt(id,row.dataset.ctx)&&canMultiPick(f.n);
    row.classList.toggle("mark",multi);
    if(pendingDelHas(id)){
      row.classList.add("pending");
      const chip=document.createElement("span");chip.className="pending-chip";chip.dataset.for=id;chip.textContent=pendingLabel(id);
      row.querySelector(":scope>.nm")?.after(chip);

    // Место под галочку занято у каждой строки: иначе тома архива, GPU и
    // прочие неотмечаемые строки стоят левее соседей.
    let ph=false,state="";
    // Вне режима открытый объект тоже лежит в treeSel, но галочкой его не показываем.
    if(canMultiPick(f.n))state=(on||treeSel.size>1)&&selShownAt(id,row.dataset.ctx)?"on":"";
    // У хранилища камер в дереве нет, и галочка «частично» читалась бы как
    // выбор самого хранилища. Камеры, что в него пишут, — из его меню.
    else if(f.n.type==="archive"||f.n.type==="det"||f.n.type==="vol"||f.n.type==="found"||f.n.type==="founddev"||f.n.type==="norec"||f.n.type==="nofolder"||f.n.type==="gpu")ph=true;
    else if(on){
      // Тристейт считаем только в режиме: вне его галочка контейнера просто ждёт клика.
      const d=selDescendants(f.n),cc=childSelCtx(f.n);
      if(!d.length)ph=true;
      else{const k=d.filter(x=>selShownIn(x,cc)).length;state=k===0?"":k===d.length?"on":"part"}
    }
    const chk=document.createElement("span");
    if(!ph&&!on&&!canMultiPick(f.n)&&f.n.type!=="archive"&&!selDescendants(f.n).length)ph=true;
    chk.className="n-chk"+(ph?" n-chk-ph":"")+(state?" "+state:"")+(blockedId(id)?" dis":"");
    chk.setAttribute("role","checkbox");chk.setAttribute("aria-checked",state==="part"?"mixed":state?"true":"false");
    chk.title=blockedId(id)?i18n("Объект в очереди"):canMultiPick(f.n)?i18n("Отметить"):i18n("Отметить всё внутри");
    const tw=row.querySelector(":scope>.tw");
    if(tw)tw.after(chk);else row.prepend(chk);
  });
}
function selChkClick(id,ctx){
  const f=find(id);if(!f||f.n.type==="archive")return;
  if(blockedId(id)){toast(pendingDelHas(id)?"Объект ждёт удаления — отмените его в тосте":"Объект в очереди применения — дождитесь конца");return}
  const entering=!selMode;selMode=true;
  // Первый клик по галочке открытого объекта только включает режим: объект
  // уже в выборке, снимать его было бы неожиданно.
  if(entering&&canMultiPick(f.n)&&treeSel.size===1&&treeSel.has(id)){afterSelChange(id,ctx);return}
  // Регистратор отмечается вместе со своими камерами (под хранилищем — с теми,
  // что пишутся в это хранилище)
  if(f.n.type==="ipsrv"&&canMultiPick(f.n)){
    const on=selShownAt(id,ctx),aid=ctx?.startsWith("arch:")?ctx.slice(5):null;
    const all=[f.n,...selDescendants(f.n).filter(x=>!aid||x.type!=="camera"||x.arch===aid)];
    all.forEach(x=>on?treeSel.delete(x.id):treeSel.add(x.id,ctx||null));
    treeAnchor=id;
    afterSelChange(on?null:id,ctx);return;
  }
  if(canMultiPick(f.n)){selToggle(id,ctx);return}
  const d=selDescendants(f.n),cc=childSelCtx(f.n);
  if(!d.length){toast("Здесь нечего отметить");return}
  const all=d.every(x=>selShownIn(x,cc));
  d.forEach(x=>all?treeSel.delete(x.id):treeSel.add(x.id,cc&&(x.type==="camera"||x.type==="ipsrv")?cc:null));
  afterSelChange(all?null:d[0].id,all?ctx:cc||ctx);
}
// Объект уже отмечен в другом месте дерева — щелчок переносит галочку сюда,
// а не снимает её.
function selToggle(id,ctx){
  const f=find(id);if(!f||!canMultiPick(f.n))return;

}

// ── Изменения → операции ──────────────────────────────────────────────────
// Каждая операция знает объект, что делает, как откатывается и как упадёт.
// Отказы в макете детерминированы: сервер без связи не отвечает, лицензия не
// даёт включить, устройство без сигнала не принимает учётные данные и видео,
// репликация невозможна без встроенного хранилища.
function opFail(n,kind){
  const s=srv(n.id);
  if(s&&hasNoSignal(s))return{code:"srv",msg:`${i18n("сервер")} «${locName(s)}» ${i18n("не отвечает")}`};
  if(kind==="enable"&&n.licenseExceeded)return{code:"lic",msg:i18n("лицензия превышена — камера останется выключенной")};
  if((kind==="creds"||kind==="video")&&n.online===false)return{code:"dev",msg:i18n("устройство не отвечает — проверьте сеть и учётные данные"),transient:true};
  return null;
}
function mkOp(n,label,kind,run,skip,undo){return{n,label,kind,run,skip:skip||null,undo:undo||null}}
function bulkChanges(draft){
  const nodes=bulkSelNodes(),d=draft||bulkDraft,out=[];
  const step=(key,label,ops,note)=>{if(ops.length)out.push({key,label,ops,note:note||""})};
  if(d.enabled){
    const want=d.enabled==="on";
    const ops=nodes.filter(n=>(n.enabled!==false)!==want).map(n=>{const prev=n.enabled;return mkOp(n,want?"Включить":"Выключить",want?"enable":"disable",()=>{n.enabled=want},null,()=>{n.enabled=prev})});
    const lic=want?ops.filter(o=>o.n.licenseExceeded).length:0;
    step("enabled",want?"Включить":"Выключить",ops,lic?`${i18n("лицензия")}: ${lic} ${i18n(plural(lic,"камера|камеры|камер"))} ${i18n("сверх лимита не включатся")}`:"");
  }
  if(d.user||d.pass)step("creds","Учётные данные",nodes.filter(n=>n.type==="camera"||n.type==="ipsrv"||n.type==="acfa").map(n=>mkOp(n,"Учётные данные","creds",()=>{if(d.user)n.user=d.user;if(d.pass)n.pass="•".repeat(8)})),i18n("устройство переподключится"));
  [...(d.folderAdd?[d.folderAdd]:[]),...(d.folderAddMany||[])].forEach(fid=>{
    const f=folderById(fid);
    if(f)step("folderAdd:"+fid,`В папку «${folderPathName(f.id)}»`,nodes.filter(n=>!f.items.includes(n.id)).map(n=>mkOp(n,"В папку","folder",()=>folderAddDevice(f.id,n.id),null,()=>{f.items=f.items.filter(x=>x!==n.id)})));
  });
  if(d.folderRemove){
    const f=folderById(d.folderRemove);
    if(f)step("folderRemove",`Из папки «${folderPathName(f.id)}»`,nodes.filter(n=>f.items.includes(n.id)).map(n=>mkOp(n,"Из папки","folder",()=>{f.items=f.items.filter(x=>x!==n.id)},null,()=>folderAddDevice(f.id,n.id))));
  }
  if(d.arch){
    const a=d.arch==="__none__"?null:arch.find(x=>x.id===d.arch);
    const ops=nodes.filter(n=>n.type==="camera"&&(n.arch||null)!==(a?a.id:null)).map(n=>mkOp(n,a?`Архив «${locName(a)}»`:"Снять архив","arch",()=>{
      pinCamServer(n);
      n.arch=a?a.id:null;
      if(!a)n.rec="none";else if(!n.rec||n.rec==="none")n.rec="always";
      bindArchServer(n);
    },archForeignReason(n,a)));
    const as=a?archServer(a):null,sk=ops.filter(o=>o.skip).length;
    const where=as?`${i18n("камеры без сервера перейдут на сервер")} «${locName(as)}»`:i18n("запись пойдёт в сетевое хранилище домена");
    const skNote=sk?`; ${sk} ${i18n(plural(sk,"камера|камеры|камер"))} ${i18n("другого сервера")} ${i18n(plural(sk,"будет пропущена|будут пропущены|будут пропущены"))}`:"";
    step("arch",a?`Архив «${locName(a)}»`:"Снять архив",ops,a?`${where}${skNote}${d.rec?"":`; ${i18n("у камер без записи режим станет «Всегда»")}`}`:i18n("запись у этих камер остановится"));
  }
  if(d.rec){
    const ops=nodes.filter(n=>n.type==="camera"&&(n.rec||"none")!==d.rec).map(n=>{
      const prev={rec:n.rec,arch:n.arch,srvId:n.srvId};
      // Архив из поля «Архив» — только если он доступен камере; иначе первый доступный
      const want=d.arch&&d.arch!=="__none__"&&archChoicesFor(n).some(a=>a.id===d.arch)?d.arch:null;
      return mkOp(n,`Режим «${i18n(recordModeLabel(d.rec))}»`,"rec",()=>{
      n.rec=d.rec;if(d.rec!=="none"&&!n.arch){pinCamServer(n);n.arch=(want||archChoicesFor(n)[0]?.id)||null;bindArchServer(n)}
    },d.rec==="replica"&&!edgeStorage(n)?i18n("нет встроенного хранилища"):(d.rec!=="none"&&!n.arch&&!want?i18n("архив не задан — будет взят первый доступный"):null),()=>{n.rec=prev.rec;n.arch=prev.arch;n.srvId=prev.srvId})});
    const sk=ops.filter(o=>o.skip).length;
    step("rec",`Режим записи «${i18n(recordModeLabel(d.rec))}»`,ops,sk?`${sk} ${i18n(plural(sk,"камера|камеры|камер"))} ${i18n("будут пропущены")}`:"");
  }
  if(d.pre)step("pre",`Предзапись ${d.pre} с`,nodes.filter(n=>n.type==="camera"&&String(n.pre??5)!==String(d.pre)).map(n=>{const prev=n.pre;return mkOp(n,`Предзапись ${d.pre} с`,"rec",()=>{n.pre=Number(d.pre)},null,()=>{n.pre=prev})}));
  const vid=["codec","res","fps","bitrate"].filter(k=>d[k]);
  const sameModel=n=>!d.onlyModel||modelOf(n)===d.onlyModel;
  if(vid.length)step("video",`Видео: ${vid.map(k=>({codec:"кодек",res:"разрешение",fps:"к/с",bitrate:"битрейт"})[k]).join(", ")}`,nodes.filter(n=>n.type==="camera").map(n=>mkOp(n,"Параметры видео","video",()=>{vid.forEach(k=>n[k]=k==="fps"||k==="bitrate"?Number(d[k]):d[k])},sameModel(n)?null:`${i18n("другая модель")}: ${modelOf(n)||"—"}`)),i18n("поток переоткроется, запись прервётся на секунды")+(d.onlyModel?`; ${i18n("только для модели")} ${d.onlyModel}`:""));
  [...(d.addDet?[d.addDet]:[]),...(d.addDetMany||[])].forEach(kind=>{
    step("addDet:"+kind,`Детектор «${i18n(kind)}»`,nodes.filter(n=>n.type==="camera"&&!camDetectors(n).some(x=>(x.kind||DET_TYPES[0])===kind)).map(n=>mkOp(n,`Детектор «${i18n(kind)}»`,"det",()=>{
      (n.devices||(n.devices=[])).push({id:"det"+Date.now()+Math.random().toString(36).slice(2,6),type:"det",name:i18n(kind),kind,sens:"12",online:true,devices:[]});
    },sameModel(n)?null:`${i18n("другая модель")}: ${modelOf(n)||"—"}`)),i18n("зону детекции задают на каждой камере отдельно")+(d.onlyModel?`; ${i18n("только для модели")} ${d.onlyModel}`:""));
  });
  // Копия конкретных детекторов камеры: программный — на любую модель,
  // встроенный в камеру — только на ту же. У кого такой уже есть, не трогаем.
  (d.copyDets||[]).forEach((x,i)=>{
    const has=n=>camDetectors(n).some(y=>(y.kind||DET_TYPES[0])===x.kind&&locName(y)===x.name);
    const ops=nodes.filter(n=>n.type==="camera"&&!has(n)).map(n=>mkOp(n,`Детектор «${x.name}»`,"det",()=>{
      (n.devices||(n.devices=[])).push({id:"det"+Date.now()+Math.random().toString(36).slice(2,6),type:"det",name:x.name,kind:x.kind,sens:x.sens,builtin:x.builtin,online:true,devices:[]});
    },x.builtin&&modelOf(n)!==d.detModel?`${i18n("встроенный детектор, другая модель")}: ${modelOf(n)||"—"}`:null));
    step("copyDet:"+i,`Детектор «${x.name}» (${i18n(x.kind)})`,ops,
      (x.builtin?`${i18n("встроен в камеру — только для модели")} ${d.detModel}`:i18n("считается на сервере — для любой модели"))+`; ${i18n("зону детекции задают на каждой камере отдельно")}`);
  });
  if(d.rename){
    step("rename",`Имена по шаблону`,nodes.map(n=>mkOp(n,"Переименование","rename",()=>{n.name=bulkName(n,d.rename)})));
  }
  return out;
}
function bulkName(n,tpl){
  const type=LB[n.type]||"Устройство",vendor=n.vendor||"",model=n.model||"",ip=n.ip||"";
  switch(tpl){
    case"default":return type;
    case"vendor-model":return[vendor,model].filter(Boolean).join(" ")||type;
    case"type-model":return[type,model].filter(Boolean).join(" ");
    case"type-ip":return ip?`${type} (${ip})`:type;
    case"model-ip":return model&&ip?`${model} (${ip})`:model||ip;
    case"type-model-ip":return[type,model].filter(Boolean).join(" ")+(ip?` (${ip})`:"");
    case"vendor-model-ip":return[vendor,model].filter(Boolean).join(" ")+(ip?` (${ip})`:"");
    default:return n.name;
  }
}

function bulkBusyGuard(){
  if(bq&&!bq.finished){toast("Очередь ещё выполняется — дождитесь её конца");return true}
  const busy=busyIds();
  if(bulkSelNodes().some(n=>busy.has(n.id)||pendingDelHas(n.id))){toast("В выборке есть объекты в очереди или на удалении");return true}

function bulkShowPlan(){
  const ch=bulkChanges(),nodes=bulkSelNodes();
  if(!ch.length){toast("Нечего применять");return}
  if(bulkBusyGuard())return;
  const st=bulkStats(nodes);
  const excluded=new Set(st.offline.map(n=>n.id));
  let total=0,skip=0;

     <p class="sub" style="margin:10px 0 0">${i18n("Параметры применяются к каждому объекту по отдельности, шаги идут по порядку; итог по каждому объекту — в отчёте.")}</p>`,
    `<button type="button" class="btn" onclick="closeBulkModal()">${i18n("Назад")}</button><button type="button" class="btn pri" onclick="closeBulkModal();bulkApply()" ${total?"":"disabled"}>${i18n("Применить")} (${total})</button>`,"bbox-wide");

let bq=null,bqTimer=null;

function startQueue(steps,title,opts){

// ── Отложенное удаление ───────────────────────────────────────────────────
// Удаление уходит на сервер, поэтому вместо undo — отсчёт: объекты помечены,
// в тосте «Отменить», пока курсор на тосте — отсчёт стоит.
const pendingDel=new Map();let pendingSeq=0,pendingTicker=null;
function pendingOf(id){for(const[k,p]of pendingDel)if(p.ids.includes(id))return p;return null}
function pendingDelHas(id){return!!pendingOf(id)}
function pendingLeft(p){return Math.max(0,Math.ceil((p.paused?p.left:p.deadline-Date.now())/1000))}

function deleteSelected(){
  closeTreeCtx();

  const ids=[...treeSel].filter(id=>{const f=find(id);return f&&canMultiPick(f.n)&&(f.p?.devices||!f.p)});
  if(!ids.length){toast("Нечего удалять");return}
  const idSet=new Set(ids);
  const roots=ids.filter(id=>!path(id).slice(0,-1).some(n=>idSet.has(n.id))).filter(id=>!pendingDelHas(id));
  if(!roots.length){toast("Выбранное уже в очереди на удаление");return}
  confirmDeleteNodes(roots);

function confirmDeleteNodes(roots,back){
  const nodes=roots.map(id=>find(id).n);
  const cams=[];nodes.forEach(n=>walk(x=>{if(x.type==="camera")cams.push(x)},[n]));
  const rec=cams.filter(isRecording).length,dets=cams.reduce((s,c)=>s+camDetectors(c).length,0);
  const nvr=nodes.filter(n=>n.type==="ipsrv").length;
  const fold=new Set();nodes.forEach(n=>foldersOfDevice(n.id).forEach(f=>fold.add(f.id)));
  const count=roots.length,big=count>=10,one=count===1?nodes[0]:null;
  const lines=[one?`${escHtml(i18n(LB[one.type]||"Объект"))} «${escHtml(locName(one))}»${one.type==="ipsrv"&&ipsrvCameras(one).length?` — ${i18n("вместе с его камерами")}`:""}`
    :`${count} ${i18n(plural(count,"объект|объекта|объектов"))}${nvr?` (${i18n("регистраторов")}: ${nvr} — ${i18n("вместе с их камерами")})`:""}`];
  if(cams.length)lines.push(`${i18n("камер")}: ${cams.length}, ${i18n("из них пишут в архив")}: ${rec} — ${i18n("запись остановится, архив останется")}`);
  if(dets)lines.push(`${i18n("детекторов")}: ${dets} — ${i18n("удалятся вместе с правилами")}`);
  if(fold.size)lines.push(`${i18n("папок, из которых пропадут объекты")}: ${fold.size}`);
  const html=`<ul class="bk-del">${lines.map(l=>`<li>${l}</li>`).join("")}</ul>
    ${big?`<label>${i18n("Введите")} ${count}, ${i18n("чтобы подтвердить")}</label><input id="delCountInp" inputmode="numeric" autocomplete="off" oninput="document.getElementById('confirmOk').disabled=this.value.trim()!=='${count}'">`:""}
    <p class="sub" style="margin:10px 0 0">${i18n("После подтверждения будет отсчёт с кнопкой «Отменить».")}</p>`;
  const opts=one?{label:`«${locName(one)}»`,back}:{back};
  askConfirm(one?`${i18n("Удалить")} «${escHtml(locName(one))}»?`:"Удалить выбранные объекты?",html,"","Удалить",()=>scheduleDelete(roots,opts),{html:true});

// opts.label — подпись в тосте вместо «N объектов»; opts.commit — своё
// удаление (папка, хранилище, том, детектор, домен); opts.back — куда
// перейти, если удалённый объект был открыт.
function scheduleDelete(ids,opts={}){
  const key="del"+(++pendingSeq),delay=ids.length>3?15000:10000;
  const p={key,ids,deadline:Date.now()+delay,delay,timer:null,paused:false,left:0,commit:opts.commit||null,back:opts.back||null};
  p.timer=setTimeout(()=>commitDelete(key),delay);

  renderTree();gear();
  toastAction(key,`${opts.label||`${ids.length} ${plural(ids.length,"объект|объекта|объектов")}`} — ${i18n("удаление через")}`,i18n("Отменить"),()=>cancelDelete(key),null,{pause:()=>pausePending(key),resume:()=>resumePending(key),danger:true,ms:delay});
}
function pausePending(key){const p=pendingDel.get(key);if(!p||p.paused)return;p.paused=true;p.left=Math.max(0,p.deadline-Date.now());clearTimeout(p.timer);tickPending()}

function tickPending(){
  pendingDel.forEach(p=>{
    const t=document.querySelector(`#ttu-${p.key} .ttu-left`);if(t)t.textContent=pendingLeft(p);
    document.getElementById("ttu-"+p.key)?.classList.toggle("urgent",!p.paused&&pendingLeft(p)<=3);
  });

  if(!pendingDel.size&&pendingTicker){clearInterval(pendingTicker);pendingTicker=null}
}
function cancelDelete(key){
  const p=pendingDel.get(key);if(!p)return;
  clearTimeout(p.timer);pendingDel.delete(key);removeToastAction(key);
  toast("Удаление отменено — ничего не отправлено");
  renderTree();
}
function commitDelete(key){
  const p=pendingDel.get(key);if(!p)return;
  pendingDel.delete(key);removeToastAction(key);
  if(p.commit){p.commit();return}
  let n=0;
  p.ids.forEach(id=>{const f=find(id);if(f&&removeNodeFromParent(f))n++});
  remakeAcfa();treeMatchCache.clear();searchMatchCache.clear();
  if(!find(sel)){const b=p.back&&(find(p.back)||folderById(p.back))?p.back:domains[0]?.id;sel=b||sel;tab="gen";resetTreeSel(sel);expandTo(sel)}
  toast(n===1?"Устройство удалено":`${i18n("Удалено объектов")}: ${n}`);

// Тост с действием: для удаления отсчёт ведёт очередь удаления (и замирает
// при наведении), для «Отменить» после применения — свой таймер.
function toastAction(key,msg,label,fn,ms,hooks){
  removeToastAction(key);
  const e=document.createElement("div");e.id="ttu-"+key;e.className="ttu";
  e.innerHTML=`<span class="ttu-msg">${escHtml(msg)}</span><span class="ttu-timer"><span class="ttu-left"></span> ${i18n("с")}</span><button type="button" class="ttu-act">${escHtml(label)}</button>`;
  e.querySelector(".ttu-act").onclick=()=>{removeToastAction(key);fn()};
  if(hooks?.danger){
    e.classList.add("danger");
    e.insertAdjacentHTML("afterbegin",`<span class="ttu-ic"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg></span>`);
    e.insertAdjacentHTML("beforeend",`<span class="ttu-bar"><i style="animation-duration:${hooks.ms}ms"></i></span>`);
  }
  if(hooks){
    e.addEventListener("mouseenter",hooks.pause);e.addEventListener("mouseleave",hooks.resume);
    e.addEventListener("focusin",hooks.pause);e.addEventListener("focusout",hooks.resume);
  }else{
    let left=Math.round((ms||10000)/1000),paused=false;
    const tick=()=>{if(!document.body.contains(e)){clearInterval(e._t);return}if(!paused)left--;e.querySelector(".ttu-left").textContent=Math.max(0,left);if(left<=0){clearInterval(e._t);e.remove()}};
    e._t=setInterval(tick,1000);
    e.addEventListener("mouseenter",()=>{paused=true});e.addEventListener("mouseleave",()=>{paused=false});
    e.querySelector(".ttu-left").textContent=left;
  }
  document.body.appendChild(e);
  tickPending();
}
function removeToastAction(key){const e=document.getElementById("ttu-"+key);if(e){clearInterval(e._t);e.remove()}}


// ── «Применить к другим…»: от одной камеры к похожим ─────────────────────
// Путь нынешнего Axxon One и Genetec Copy configuration: настроил одну —
// повторил на остальных. Общие группы идут на любые камеры среза, видео —
// только на ту же модель. Детекторы выбирают поштучно: программный (на
// сервере) ставится на камеру любой модели, встроенный в камеру — только на
// такую же модель. Дальше обычный план и очередь.
let cp=null;
function bulkCopyBtn(n){
  if(!n||n.type!=="camera"||app!=="hw")return"";
  return`<button type="button" class="btn s" title="${i18n("Скопировать настройки этой камеры на другие")}" onclick="openCopyDialog('${n.id}')">${i18n("Применить к другим")}…</button>`;
}
function cpGroups(src){
  const a=arch.find(x=>x.id===src.arch),folders=foldersOfDevice(src.id).filter(f=>f.items.includes(src.id));
  const dets=camDetectors(src);
  return[
    {key:"rec",label:"Архив и запись",value:`${a?locName(a):i18n("архив не задан")} · ${i18n(recordModeLabel(src.rec||"none"))} · ${i18n("предзапись")} ${src.pre??5} ${i18n("с")}`,common:true},
    {key:"enabled",label:"Включено",value:src.enabled!==false?i18n("включена"):i18n("выключена"),common:true},
    {key:"folders",label:"Расположение",value:folders.length?folders.map(f=>folderPathName(f.id)).join(", "):i18n("ни в одной папке"),common:true,off:!folders.length},
    {key:"creds",label:"Учётные данные",value:i18n("логин и пароль источника (пароль не показывается)"),common:true},
    {key:"video",label:"Видео",value:`${src.codec||"H.265"} · ${src.res||"1920×1080"} · ${src.fps||25} ${i18n("к/с")} · ${src.bitrate||4096}`,common:false},
    {key:"dets",label:"Детекторы",value:dets.length?"":i18n("детекторов нет"),common:true,off:!dets.length}
  ];
}
function cpCandidates(src){
  const out=[];walkAll(n=>{if(n.type==="camera"&&n.id!==src.id&&!blockedId(n.id))out.push(n)});
  return out;
}
function cpFiltered(){
  const q=cp.q.trim().toLowerCase(),src=cp.src;
  return cpCandidates(src).filter(n=>{
    if(cp.filter==="model"&&modelOf(n)!==modelOf(src))return false;
    if(cp.filter==="server"&&srv(n.id)?.id!==srv(src.id)?.id)return false;
    if(cp.filter==="folder"&&!foldersOfDevice(src.id).some(f=>f.items.includes(n.id)))return false;
    if(!q)return true;
    return[locName(n),n.ip,modelOf(n),serverNameOf(n)].join(" ").toLowerCase().includes(q);
  });
}
function openCopyDialog(id){
  const f=find(id);if(!f||f.n.type!=="camera")return;
  if(busyIds().size){toast("Очередь ещё выполняется — дождитесь её конца");return}
  const src=f.n;
  cp={src,groups:new Set(["rec","enabled","folders","video"].filter(k=>!cpGroups(src).find(g=>g.key===k)?.off)),
    dets:new Set(camDetectors(src).map(d=>d.id)),detsOpen:false,picked:new Set(),filter:"model",q:""};
  renderCopyDialog();
}
function renderCopyDialog(){
  if(!cp)return;
  const src=cp.src,all=cpCandidates(src),list=cpFiltered();
  const cnt={model:all.filter(n=>modelOf(n)===modelOf(src)).length,server:all.filter(n=>srv(n.id)?.id===srv(src.id)?.id).length,folder:all.filter(n=>foldersOfDevice(src.id).some(f=>f.items.includes(n.id))).length,all:all.length};
  const groups=cpGroups(src).map(g=>g.key==="dets"&&!g.off?cpDetsGroupHtml(src):`<label class="cp-group ${g.off?"off":""}"><input type="checkbox" ${cp.groups.has(g.key)?"checked":""} ${g.off?"disabled":""} onchange="cpToggleGroup('${g.key}',this.checked)"><span><b>${i18n(g.label)}</b>${g.common?"":` <span class="bk-hint-inline">${i18n("только та же модель")}</span>`}<small>${escHtml(g.value)}</small></span></label>`).join("");
  const chips=[["model","Та же модель"],["server","Тот же сервер"],["folder","Та же папка"],["all","Все камеры"]].map(([k,l])=>`<button type="button" class="stchip ${cp.filter===k?"on":""}" onclick="cp.filter='${k}';renderCopyDialog()"><span class="stchip-lab">${i18n(l)}</span><span class="stchip-cnt">${cnt[k]}</span></button>`).join("");
  const allOn=list.length>0&&list.every(n=>cp.picked.has(n.id));
  const rows=list.map(n=>{
    const same=modelOf(n)===modelOf(src),s=srv(n.id);
    const lost=same?"":cpModelLoss();
    return`<label class="cp-row"><input type="checkbox" ${cp.picked.has(n.id)?"checked":""} onchange="cpPick('${n.id}',this.checked)"><span class="cp-name">${treeIconHtml(n)} ${escHtml(crumbTitle(n))}</span><span class="cp-meta">${escHtml(serverNameOf(n))} · ${escHtml(modelOf(n)||"—")} · ${escHtml(n.ip||"")}${s&&hasNoSignal(s)?` · <span class="bk-bad">${i18n("сервер без связи")}</span>`:""}</span>${lost?`<span class="cp-note">${lost} ${i18n("не скопируются")}</span>`:""}</label>`;
  }).join("")||`<div class="empty">${i18n("Ничего не найдено")}</div>`;
  const loss=cpModelLoss();
  const other=[...cp.picked].filter(id=>{const n=find(id)?.n;return n&&modelOf(n)!==modelOf(src)}).length;
  openBulkModal(`${i18n("Применить настройки")} «${escHtml(locName(src))}» ${i18n("к другим камерам")}`,
    `<div class="cp-wrap">
      <div class="cp-col"><div class="cp-h">${i18n("Что копировать")}</div>${groups}
        <p class="sub" style="margin-top:8px">${i18n("Источник")}: ${escHtml(modelOf(src)||"—")}, ${escHtml(serverNameOf(src))}. ${i18n("Общие группы и программные детекторы идут на любые камеры; видео и детекторы, встроенные в камеру, — только на ту же модель, остальные камеры по этим шагам будут пропущены с причиной.")}</p></div>
      <div class="cp-col cp-col-list"><div class="cp-h">${i18n("Кому")}</div>
        <div class="bk-chips">${chips}</div>
        <div class="sq lan-sq cp-sq"><input value="${escHtml(cp.q)}" placeholder="${i18n("Имя, IP, модель, сервер…")}" oninput="cp.q=this.value;renderCopyDialog();this.focus()"></div>
        <div class="cp-tools"><label class="cp-all"><input type="checkbox" ${allOn?"checked":""} ${list.length?"":"disabled"} onchange="cpPickAll(this.checked)"><span>${allOn?i18n("Снять выделение"):i18n("Выбрать всё")} (${list.length})</span></label><span class="sel-cnt">${i18n("Выбрано")}: <b>${cp.picked.size}</b></span></div>
        <div class="cp-list">${rows}</div></div>
    </div>${loss&&other?`<div class="nt bk-warn" style="margin-top:10px">⚠ ${other} ${i18n(plural(other,"камера|камеры|камер"))} ${i18n("другой модели:")} ${loss} ${i18n("к ним не применятся")}</div>`:""}`,
    `<button type="button" class="btn" onclick="closeBulkModal();cp=null">${i18n("Отмена")}</button><span class="tfoot-gap"></span><button type="button" class="btn pri" onclick="cpShowPlan()" ${cp.picked.size&&(cp.groups.size||cp.dets.size)?"":"disabled"}>${i18n("Показать план")} (${cp.picked.size})</button>`,"bbox-wide bbox-copy");
  requestAnimationFrame(()=>{
    const i=document.querySelector(".cp-sq input");if(i&&cp.q){i.focus();i.setSelectionRange(i.value.length,i.value.length)}
    const h=document.querySelector(".cp-dets-all");if(h)h.indeterminate=h.dataset.part==="1";
  });
}
// Что не доедет до камеры другой модели: видео и встроенные детекторы.
function cpModelLoss(){
  if(!cp)return"";
  const bits=[];
  if(cp.groups.has("video"))bits.push(i18n("видео"));
  const b=camDetectors(cp.src).filter(d=>d.builtin&&cp.dets.has(d.id)).length;
  if(b)bits.push(`${b} ${i18n(plural(b,"встроенный детектор|встроенных детектора|встроенных детекторов"))}`);
  return bits.join(` ${i18n("и")} `);
}
// Группа «Детекторы» раскрывается списком: копируют один, несколько или все.
function cpDetsGroupHtml(src){
  const dets=camDetectors(src),k=dets.filter(d=>cp.dets.has(d.id)).length;
  const bi=dets.filter(d=>d.builtin).length;
  const sum=`${i18n("выбрано")} ${k} ${i18n("из")} ${dets.length}`+(bi?` · ${i18n("встроенных в камеру")}: ${bi}`:"");
  const rows=dets.map(d=>`<label class="cp-det"><input type="checkbox" ${cp.dets.has(d.id)?"checked":""} onchange="cpToggleDet('${d.id}',this.checked)">
      <span class="cp-det-nm">${escHtml(detTitle(d))}<small>${escHtml(i18n(d.kind||DET_TYPES[0]))} · ${i18n("чувствительность")} ${escHtml(String(d.sens||"12"))}</small></span>
      ${d.builtin?`<span class="cp-det-tag bi" title="${i18n("Детектор работает в самой камере — переносится только на такую же модель")}">${i18n("в камере · та же модель")}</span>`
        :`<span class="cp-det-tag" title="${i18n("Детектор считается на сервере — подходит камере любой модели")}">${i18n("на сервере · любая модель")}</span>`}</label>`).join("");
  return`<div class="cp-group cp-dets ${cp.detsOpen?"open":""}">
    <input type="checkbox" class="cp-dets-all" ${k===dets.length?"checked":""} data-part="${k&&k<dets.length?1:0}" onchange="cpAllDets(this.checked)" aria-label="${i18n("Все детекторы")}">
    <span class="cp-dets-body"><button type="button" class="cp-dets-head" aria-expanded="${cp.detsOpen}" onclick="cp.detsOpen=!cp.detsOpen;renderCopyDialog()">
      <b>${i18n("Детекторы")}</b><span class="cp-dets-chev">${cp.detsOpen?"▾":"▸"}</span><small>${escHtml(sum)} — ${i18n("без зон")}</small></button>
      ${cp.detsOpen?`<div class="cp-det-list">${rows}</div>`:""}</span></div>`;
}
function cpToggleDet(id,on){if(!cp)return;on?cp.dets.add(id):cp.dets.delete(id);renderCopyDialog()}
function cpAllDets(on){if(!cp)return;cp.dets.clear();if(on)camDetectors(cp.src).forEach(d=>cp.dets.add(d.id));renderCopyDialog()}
function cpToggleGroup(k,on){if(!cp)return;if(on)cp.groups.add(k);else cp.groups.delete(k);renderCopyDialog()}
function cpPick(id,on){if(!cp)return;if(on)cp.picked.add(id);else cp.picked.delete(id);renderCopyDialog()}
function cpPickAll(on){if(!cp)return;cpFiltered().forEach(n=>on?cp.picked.add(n.id):cp.picked.delete(n.id));renderCopyDialog()}
// Выбранные камеры становятся выборкой, группы — черновиком: дальше тот же
// план, та же очередь и тот же отчёт, что у карточки выборки.
function cpShowPlan(){
  if(!cp||!cp.picked.size)return;
  const src=cp.src,g=cp.groups,d={};
  if(g.has("rec")){d.arch=src.arch||"__none__";d.rec=src.rec||"none";d.pre=String(src.pre??5)}
  if(g.has("enabled"))d.enabled=src.enabled!==false?"on":"off";
  if(g.has("folders"))d.folderAddMany=foldersOfDevice(src.id).filter(f=>f.items.includes(src.id)).map(f=>f.id);
  if(g.has("creds")){d.user=src.user||"admin";d.pass="********"}
  if(g.has("video")){d.codec=src.codec||"H.265";d.res=src.res||"1920×1080";d.fps=String(src.fps||25);d.bitrate=String(src.bitrate||4096)}
  const dets=camDetectors(src).filter(x=>cp.dets.has(x.id));
  if(dets.length){d.copyDets=dets.map(x=>({name:locName(x),kind:x.kind||DET_TYPES[0],sens:x.sens||"12",builtin:!!x.builtin}));d.detModel=modelOf(src)}
  if(g.has("video"))d.onlyModel=modelOf(src);
  const ids=[...cp.picked];
  cp=null;closeBulkModal();
  treeSel.clear();ids.forEach(id=>treeSel.add(id));
  selMode=true;bulkPeek=false;bulkDraft=d;
  ids.forEach(id=>expandTo(id));
  aside();tab="gen";gear();
  const ch=bulkChanges();
  if(!ch.length){toast("У выбранных камер уже такие настройки");return}
  bulkShowPlan();
}

seedFound();   // выдача поиска по доменам: сеть у каждого своя
syncLocalePack();applyStaticUi();
if(!applyDeepLink()){resetTreeSel(sel);paint();}
</script>
