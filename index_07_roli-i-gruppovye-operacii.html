// Пока идёт опрос, меняется одна карточка: перерисовывать из-за неё всю панель
// значит каждые 140 мс сбрасывать прокрутку и курсор в поле.
const lanSeen={html:null,el:null};
function lanRepaint(){
  const card=document.getElementById("lanCard"),n=find(lan.owner)?.n;
  if(!card||!n){gear();return}
  const html=lanCardHtml(n);
  if(html===lanSeen.html&&lanSeen.el===card)return;
  const host=document.getElementById("main"),st=viewState(host);
  card.outerHTML=html;lanSeen.html=html;lanSeen.el=document.getElementById("lanCard");
  restoreView(host,st);
}
function lanRefresh(){lan.sel.clear();lanSearch();gear()}
// Строка из сети показывается, только если в системе нет устройства с таким
// же адресом: иначе одно и то же двоилось бы под разными именами.
// Какие объекты вообще попадают в таблицу. У папки это расположение — там
// строкой идёт устройство целиком; у архива и сервера речь о записи, а пишется
// каждый канал регистратора сам по себе, так что вложенные тоже строки.
function lanSysDevices(n){
  const out=[];
  if(lanIsPlace(n)){devicePool.forEach(d=>{if(d.type!=="det"&&!isSvc(d))out.push(d)});return out}
  walk(d=>{if(d.type!=="det"&&!isSvc(d))out.push(d)},devicePool,null);
  return out;
}
function lanBindOf(n,d){
  const own=lanDomainOf(n),dd=deviceDomain(d.id);
  if(lanIsDomain(n)){
    if(dd!==own)return{k:"other",t:locName(domainById(dd)||{name:"—"})};
    const f=foldersOfDevice(d.id)[0];
    return f?{k:"here",t:folderPathName(f.id)}:{k:"free",t:i18n("Без папки")};
  }
  if(lanIsFolder(n)){
    const f=folderById(n.id);
    if(f&&f.items.includes(d.id))return{k:"here",t:i18n("В этой папке")};
    const nested=flatFolders().find(x=>x.items.includes(d.id)&&folderPath(x.id).some(p=>p.id===n.id));
    if(nested)return{k:"here",t:i18n("Во вложенной")+": "+locName(nested),nested:nested.id};
    const other=foldersOfDevice(d.id)[0];
    if(other)return{k:"other",t:folderFullName(other.id)};
    return{k:"free",t:i18n("Без папки"),dom:dd,own};
  }
  // Привязан — значит пишется: архив без режима записи это «без записи», и
  // считать такую камеру «пишущей сюда» значило бы расходиться с деревом.
  const on=!!d.arch&&!!d.rec&&d.rec!=="none";
  const a=on?archById(d.arch):null;
  const mine=on&&lanTargets(n).some(x=>x.id===d.arch);
  // У сервера архивов несколько — говорим, в какой именно из них пишется.
  if(a&&mine)return{k:"here",t:lanIsArch(n)?i18n("Пишется сюда"):i18n("Пишется сюда")+" · "+locName(a)};
  if(a)return{k:"other",t:locName(a)+(archServer(a)?" · "+locName(archServer(a)):"")};
  return{k:"free",t:i18n("Без записи")};
}
function lanRows(n){
  const own=lanDomainOf(n);
  const sys=lanSysDevices(n).map(d=>{
    const b=lanBindOf(n,d);
    return{key:"s:"+d.id,kind:"sys",id:d.id,node:d,name:locName(d),ip:d.ip||"",mac:d.mac||"",
      vendor:d.vendor||"",model:d.model||"",type:d.type,bind:b.k,bindText:b.t,nested:b.nested||null,
      foreign:deviceDomain(d.id)!==own};
  });
  const busy=new Set();
  sys.forEach(r=>{if(r.ip)busy.add("ip:"+r.ip.toLowerCase());if(r.mac)busy.add("mac:"+r.mac.toLowerCase())});
  const net=lan.net.filter(r=>!busy.has("ip:"+String(r.ip).toLowerCase())&&!busy.has("mac:"+String(r.mac).toLowerCase()))
    .map(r=>({key:"n:"+r.id,kind:"net",id:r.id,node:null,name:r.name||r.ip,ip:r.ip||"",mac:r.mac||"",
      vendor:r.vendor||"",model:r.model||"",type:r.type||"camera",bind:"none",bindText:i18n("Нет в системе"),
      status:r.status,foreign:false}));
  return sys.concat(net);
}
function lanFilter(rows){
  const q=lan.q.trim();
  let out=lan.chip==="all"?rows:rows.filter(r=>r.bind===lan.chip);
  if(q){
    const ws=queryWords(q);
    out=out.filter(r=>ws.some(words=>matchWords(words,[r.name,r.ip,r.mac,r.vendor,r.model,r.bindText])));
  }
  const dir=lan.dir,k=lan.sort;
  return out.slice().sort((a,b)=>{
    if((a.kind==="net")!==(b.kind==="net"))return a.kind==="net"?1:-1;
    const x=String(a[k]??""),y=String(b[k]??"");
    return x.localeCompare(y,"ru",{numeric:true})*dir;
  });
}
// Невозможное не прячем, а объясняем: погашенная кнопка говорит, почему.
function lanAction(n,r){
  const folder=lanIsFolder(n);
  if(r.foreign)return{off:i18n("Устройство в другом домене")};
  if(r.kind==="net"&&(!r.vendor||r.status==="bad"))return{off:i18n("Производитель не определён")};
  if(lanIsDomain(n)){
    // В домене устройство либо уже есть, либо его заводят из сети: переносить
    // между доменами — не действие этой таблицы.
    if(r.kind!=="net")return{off:i18n("Устройство уже в этом домене")};
    return{label:i18n("В домен"),fn:`lanAddNew('${r.key}')`,pri:true,net:true};
  }
  if(folder){
    if(r.nested)return{off:i18n("Объект лежит во вложенной папке")};
    if(r.bind==="here")return{label:i18n("Убрать"),fn:`lanUnbind('${r.key}')`};
    // Устройства ещё нет в системе: его не «привязывают», а заводят — поля
    // для этого уже в строке, кнопка только подтверждает.
    if(r.kind==="net")return{label:i18n("В папку"),fn:`lanAddNew('${r.key}')`,pri:true,net:true};
    return{label:i18n("В папку"),fn:`lanBind('${r.key}')`,pri:true};
  }
  if(r.type!=="camera"&&r.type!=="ipsrv")return{off:i18n("Запись в архив ведут только камеры")};
  if(!lanTargets(n).length)return{off:i18n("У сервера нет архива")};
  if(r.bind==="here")return{label:i18n("Отвязать"),fn:`lanUnbind('${r.key}')`};
  if(r.kind==="net")return{label:i18n("Писать сюда"),fn:`lanAddNew('${r.key}')`,pri:true,net:true};
  return{label:i18n("Писать сюда"),fn:`lanBind('${r.key}')`,pri:true};
}
function lanRowByKey(n,key){return lanRows(n).find(r=>r.key===key)||null}
function lanMaterialize(n,r,opts={}){
  // Строка из сети становится объектом там же, где её привязывают, и теми же
  // полями, что заполняют в «Подключении устройств».
  if(r.kind!=="net")return r.id;
  const src=lan.net.find(x=>"n:"+x.id===r.key);if(!src)return null;
  const node=deviceNodeFromData(src,{id:n.id,type:"folder",devices:devicePool},
    {configMode:"current",disabled:!!opts.disabled});
  devicePool.push(node);
  DEVICE_DOMAIN[node.id]=lanDomainOf(n)||domains[0].id;
  if(src.group)folderAddDevice(src.group,node.id);
  lan.net=lan.net.filter(x=>x.id!==src.id);
  remakeAcfa();treeMatchCache.clear();searchMatchCache.clear();
  return node.id;
}
// Устройства, которых ещё нет в системе, показываем развёрнутыми — той же
// карточкой, что и «Найденные устройства». Лишний шаг раскрытия тут нечем
// оправдать: заполнять поля придётся всё равно, а пока они спрятаны, строка
// говорит только то, что устройство есть где-то в сети.
function lanNetRow(key){return lan.net.find(x=>"n:"+x.id===key)||null}
// Карточка найденного устройства читает и пишет через wizd — отдельного пути
// у неё нет, поэтому мастер подсовываем свой, с выдачей поиска этой таблицы.
function lanWizard(n){
  if(!wizd||wizd.lanOwner!==n.id){
    stopDeviceSearch();
    const did=lanDomainOf(n);
    wizd=initDeviceWizard({node:lanIsFolder(n)?n:null,domain:domainById(did),server:null,parent:null,view:"cam"});
    wizd.lanOwner=n.id;wizd.foundDomain=null;wizd.devState="done";
    wizd.folder=lanIsFolder(n)?n.id:(domainFolders(did)[0]?.id||flatFolders()[0]?.id||null);
  }
  wizd.devResults=lan.net;          // список пересобирается — ссылку держим свежей
  lan.net.forEach(r=>lanPrefill(n,r));
  return wizd;
}
// Откуда пришли, то и подставлено: из папки — папка, из архива — архив.
function lanPrefill(n,r){
  if(!r.name)r.name=r.discoveredName||"";
  if(r.group===undefined)r.group=lanIsFolder(n)?n.id:"";
  if(r.arch===undefined)r.arch=lanIsPlace(n)?"":(lan.arch||"");
  if(r.record===undefined)r.record=r.arch?(lan.rec||"always"):"none";
  if(r.user===undefined)r.user="";
  if(r.pass===undefined)r.pass="";
}
// Поле карточки перерисовывает ту поверхность, на которой она открыта.
function foundFieldsRepaint(){
  if(wizd&&wizd.lanOwner){gear();return}
  renderDeviceWizard();
}
function lanAddNew(key,opts={}){
  const n=find(lan.owner)?.n,src=lanNetRow(key);
  if(!n||!src)return;
  if(!opts.allowNoCredentials&&missingDeviceCredentials(src)){
    askAddWithoutCredentials(()=>lanAddNew(key,{allowNoCredentials:true,disabled:true}));
    return;
  }
  const id=lanBind(key,{disabled:!!opts.disabled});
  if(id)toast(`«${locName(find(id).n)}» — ${i18n("добавлено")}`);
}
function lanBind(key,opts={}){
  const n=find(lan.owner)?.n;if(!n)return null;
  const r=lanRowByKey(n,key);if(!r)return null;
  const a=lanAction(n,r);if(a.off)return null;
  const id=lanMaterialize(n,r,opts);if(!id)return null;
  if(lanIsDomain(n)){/* домен уже проставлен в lanMaterialize */}
  else if(lanIsFolder(n))folderAddDevice(n.id,id);
  else{
    const node=find(id)?.n;if(!node)return null;
    // У найденного архив и режим заданы в самой строке — не переспрашиваем.
    if(r.kind==="net"){if(!node.arch)node.arch=lan.arch}
    else{node.arch=lan.arch;node.rec=lan.rec||"always"}
    if(n.type==="server"&&!node.srvId)setDevServer(node,n.id);
    bindArchServer(node);
  }
  lan.sel.delete(key);
  treeMatchCache.clear();searchMatchCache.clear();paint();
  return id;
}
function lanUnbind(key){
  const n=find(lan.owner)?.n;if(!n)return;
  const r=lanRowByKey(n,key);if(!r||r.kind!=="sys")return;
  if(lanIsFolder(n)){const f=folderById(n.id);if(f)f.items=f.items.filter(x=>x!==r.id)}
  else{const node=find(r.id)?.n;if(node){node.arch=null;node.rec="none"}}
  lan.sel.delete(key);
  treeMatchCache.clear();searchMatchCache.clear();paint();
}
function lanBulk(){
  const n=find(lan.owner)?.n;if(!n)return;
  const keys=[...lan.sel];
  if(!keys.length){toast("Ничего не выбрано");return}
  let ok=0;
  keys.forEach(k=>{
    const r=lanRowByKey(n,k);if(!r)return;
    const a=lanAction(n,r);if(a.off||!a.pri)return;
    lanBind(k);ok++;
  });
  lan.sel.clear();
  toast(ok?`${i18n("Привязано")}: ${ok}`:i18n("Нечего привязывать"));
  paint();
}
function lanPick(key,on){if(on)lan.sel.add(key);else lan.sel.delete(key);gear()}
function lanPickAll(n,on){
  lan.sel.clear();

}
function lanSort(k){
  if(lan.sort===k)lan.dir=-lan.dir;else{lan.sort=k;lan.dir=1}

}
function lanSetQ(v){lan.q=v;lan.sel.clear();resetPage("lan:"+lan.owner);gear();
  requestAnimationFrame(()=>{const el=document.getElementById("lanQ");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}})}
function lanSetChip(k){lan.chip=k;lan.sel.clear();resetPage("lan:"+lan.owner);gear()}
function lanSetArch(v){
  const prev=lan.arch;
  lan.arch=v||null;
  // Найденные, которым архив ещё не меняли вручную, следуют за выбором в шапке.
  lan.net.forEach(r=>{if(r.arch===prev)r.arch=lan.arch||""});

}
function lanSetRec(v){
  const prev=lan.rec;
  lan.rec=v||"always";
  lan.net.forEach(r=>{if(r.record===prev)r.record=lan.rec});

}

// Открыть список устройств сети на том, чего в системе ещё нет.

// ── Автоматизация ──────────────────────────────────────────────
// Каталог — это граница, а не удобство. Форма строится из него, поэтому
// сценарий физически не может попросить того, под что никто не написал
// исполнителя: выбор оператора — это выбор из списка выполнимого.
const TRIGGER_KINDS=[
  {sub:"vms",kind:"io.input",label:"Вход устройства",unitLabel:"Устройство",
   match:[{id:"port",label:"Вход №",opts:["1","2","3","4"]},{id:"value",label:"Состояние",opts:["closed","open"]}]},
  {sub:"det",kind:"motion",label:"Детектор: движение",unitLabel:"Камера",match:[]},
  {sub:"det",kind:"linecross",label:"Детектор: пересечение линии",unitLabel:"Камера",match:[]},
  {sub:"det",kind:"lpr",label:"Детектор: номер",unitLabel:"Камера",match:[]},
  {sub:"vms",kind:"silent",label:"Камера пропала",unitLabel:"Камера",match:[]},
  {sub:"rec",kind:"segment.lost",label:"Пропал сегмент записи",unitLabel:"Запись",match:[]}];
const ACTION_KINDS=[
  {sub:"vms",action:"output",label:"Щёлкнуть реле",
   fields:[{id:"unit",label:"Устройство"},{id:"port",label:"Реле №",opts:["1","2","3","4"]},
           {id:"pulse_ms",label:"Импульс, мс"}]},
  {sub:"vms",action:"preset",label:"Встать в пресет",
   fields:[{id:"unit",label:"Камера"},{id:"n",label:"Пресет №"}]},
  {sub:"rec",action:"record",label:"Записывать",
   fields:[{id:"cam",label:"Камера"},{id:"minutes",label:"Минут"},{id:"archive",label:"Архив (необязательно)"}]}];
function triggerKind(t){return TRIGGER_KINDS.find(k=>k.sub===t.sub&&k.kind===t.kind)||TRIGGER_KINDS[0]}
function actionKind(a){return ACTION_KINDS.find(k=>k.sub===a.sub&&k.action===a.action)||ACTION_KINDS[0]}
function triggerLabel(t){
  const k=triggerKind(t),m=Object.entries(t.match||{}).map(([f,v])=>`${f}=${v}`).join(" ");
  return`${i18n(k.label)} · ${t.unit||"—"}${m?" · "+m:""}`;
}
function actionLabel(a){
  const k=actionKind(a),main=a.unit||a.cam||"—";
  if(k.action==="record")return`${i18n(k.label)} ${main} · ${a.minutes||"?"} ${i18n("мин")}`;
  if(k.action==="output")return`${i18n(k.label)} ${main} · ${i18n("реле")} ${a.port||"?"}`;
  return`${i18n(k.label)} ${main} · ${a.n||"?"}`;
}
// Те же отказы, что и на сервере, теми же словами. Экран, который принимает
// то, что подсистема отвергнет, обманывает дважды: сначала показав, что всё в
// порядке, а потом — в журнале, через час, чужим текстом.
function ruleProblem(r){
  if(!r.when.length)return"Нужно хотя бы одно событие: сценарий без «если» не сценарий";
  if(r.when.length>1&&!r.within)return"Двум событиям нужно окно: в пределах скольких секунд они считаются совпавшими";
  if(r.when.length===1&&r.within)return"Окно — промежуток между событиями; с одним событием окну нечего мерить";
  if(!r.then.length)return"Нужно хотя бы одно действие: иначе сценарий только наблюдает";
  for(const a of r.then){
    const k=actionKind(a);
    const need=k.fields.filter(f=>!/необязательно/.test(f.label)).map(f=>f.id);
    const miss=need.find(id=>!String(a[id]??"").trim());
    if(miss)return`«${i18n(k.label)}»: не заполнено поле «${i18n((k.fields.find(f=>f.id===miss)||{}).label||miss)}»`;
  }
  if(r.rate<1||r.rate>600)return"Потолок срабатываний — от 1 до 600 в минуту";
  return"";
}
function curRule(){return rules.find(x=>x.id===rule)||rules[0]}
function setRuleField(f,v){const r=curRule();r[f]=f==="rate"||f==="within"?(parseInt(v,10)||0):v;setD(true);paint()}
function toggleRule(){const r=curRule();r.on=!r.on;setD(true);paint()}
function setTriggerKind(i,v){
  const r=curRule(),k=TRIGGER_KINDS[+v];
  // Смена вида события меняет и то, чем его уточняют: старые уточнения
  // относились к другому событию и молча перестали бы что-либо значить.
  r.when[i]={sub:k.sub,kind:k.kind,unit:r.when[i].unit||"",match:{}};
  setD(true);paint();
}
function setTriggerField(i,f,v){const r=curRule();if(f==="unit")r.when[i].unit=v;else{r.when[i].match=r.when[i].match||{};if(v)r.when[i].match[f]=v;else delete r.when[i].match[f]}setD(true);paint()}
function addTrigger(){const r=curRule();const k=TRIGGER_KINDS[1];r.when.push({sub:k.sub,kind:k.kind,unit:"",match:{}});if(r.when.length>1&&!r.within)r.within=30;setD(true);paint()}
function delTrigger(i){const r=curRule();r.when.splice(i,1);if(r.when.length<2)r.within=0;setD(true);paint()}
function setActionKind(i,v){
  const r=curRule(),k=ACTION_KINDS[+v];
  r.then[i]={sub:k.sub,action:k.action};
  setD(true);paint();
}
function setActionField(i,f,v){const r=curRule();r.then[i][f]=v;setD(true);paint()}
function addAction(){const r=curRule(),k=ACTION_KINDS[0];r.then.push({sub:k.sub,action:k.action});setD(true);paint()}
function delAction(i){const r=curRule();r.then.splice(i,1);setD(true);paint()}
function selHtml(opts,cur,on){return`<select onchange="${on}">${opts.map(([v,l],i)=>`<option value="${v}" ${String(v)===String(cur)?"selected":""}>${escHtml(i18n(l))}</option>`).join("")}</select>`}
function triggerRowHtml(t,i,n){
  const k=triggerKind(t),ki=TRIGGER_KINDS.indexOf(k);
  const kinds=TRIGGER_KINDS.map((x,j)=>[j,x.label]);
  return`<div class="rl-row">
    <div class="rl-n">${n}</div>
    <div class="rl-f">${selHtml(kinds,ki,`setTriggerKind(${i},this.value)`)}</div>
    <div class="rl-f"><input type="text" placeholder="${i18n(k.unitLabel)}" value="${escHtml(t.unit||"")}" onchange="setTriggerField(${i},'unit',this.value)"></div>
    ${k.match.map(m=>`<div class="rl-f">${selHtml([["",""+i18n("любое")]].concat(m.opts.map(o=>[o,o])),(t.match||{})[m.id]||"",`setTriggerField(${i},'${m.id}',this.value)`)}</div>`).join("")}
    <button type="button" class="btn s" title="${i18n("Убрать")}" onclick="delTrigger(${i})">✕</button>
  </div>`;
}
function actionRowHtml(a,i){
  const k=actionKind(a),ki=ACTION_KINDS.indexOf(k);
  const kinds=ACTION_KINDS.map((x,j)=>[j,x.label]);
  return`<div class="rl-row">
    <div class="rl-n">${i+1}</div>
    <div class="rl-f">${selHtml(kinds,ki,`setActionKind(${i},this.value)`)}</div>
    ${k.fields.map(f=>f.opts
      ?`<div class="rl-f">${selHtml(f.opts.map(o=>[o,o]),a[f.id]||"",`setActionField(${i},'${f.id}',this.value)`)}</div>`
      :`<div class="rl-f"><input type="text" placeholder="${i18n(f.label)}" value="${escHtml(a[f.id]??"")}" onchange="setActionField(${i},'${f.id}',this.value)"></div>`).join("")}
    <button type="button" class="btn s" title="${i18n("Убрать")}" onclick="delAction(${i})">✕</button>
  </div>`;
}
function rulesUI(){
  const r=curRule();
  if(!r){paintMain(`<div class='sc'>${i18n("Выберите сценарий")}</div>`);return}
  const bad=ruleProblem(r);
  const fires=ruleFires[r.id]||[];
  const whenBody=`${r.when.map((t,i)=>triggerRowHtml(t,i,i===0?i18n("Если"):i18n("и"))).join("")}
    <div class="rl-foot">
      <button type="button" class="btn s" onclick="addTrigger()">${i18n("Добавить событие")}</button>
      ${r.when.length>1?`<span class="rl-win">${i18n("в пределах")}
        <input type="number" min="1" max="3600" value="${r.within||30}" onchange="setRuleField('within',this.value)"> ${i18n("с")}</span>`:""}
    </div>
    <p class="sub">${i18n("События сравниваются точным равенством: подсистема, вид события, устройство и уточнения. Окно появляется со вторым событием — одному мерить нечего.")}</p>`;
  const thenBody=`${r.then.map(actionRowHtml).join("")}
    <div class="rl-foot"><button type="button" class="btn s" onclick="addAction()">${i18n("Добавить действие")}</button></div>
    <p class="sub">${i18n("Список действий — это то, под что написан исполнитель: сценарий подаёт заявку, а выполняет её тот, кто держит устройство.")}</p>`;
  paintMain(
    mainHd(i18n("Автоматизация"),`${r.on?"●":"○"} ${escHtml(r.name)}`,ruleSummary(r))+
    `<div class="sc">
      ${bad?`<div class="nt err" role="status">${i18n(bad)}</div>`:""}
      ${card("Сценарий",`<div class="g">
          <div><label>${i18n("Название")}</label><input type="text" value="${escHtml(r.name)}" onchange="setRuleField('name',this.value)"></div>
          <div><label>${i18n("Не чаще, раз в минуту")}</label><input type="number" min="1" max="600" value="${r.rate}" onchange="setRuleField('rate',this.value)"></div>

// Последствия в людях: кто перестанет или начнёт видеть объекты, кто

    if(lose&&!(inA&&!inB))bits.push(`${i18n("перестанет видеть")} ${lose} ${plural(lose,"объект|объекта|объектов")}`);
    if(gain&&inB)bits.push(`${i18n("начнёт видеть")} ${gain} ${plural(gain,"объект|объекта|объектов")}`);

  });

}

    <button type="button" class="btn s" onclick="accRevert()">${i18n("Сбросить")}</button>

function accPlan(){
  const lines=accPlanLines(),imp=accImpact();
  const shown=imp.slice(0,8);
  const cnt=[[imp.filter(x=>x.inNew).length,"получат вход впервые"],[imp.filter(x=>x.inLost).length,"потеряют вход"],[imp.filter(x=>x.vis).length,"изменится набор видимых объектов"]];
  const summary=cnt.some(c=>c[0])?`<p class="acc-impact-sum">${cnt.filter(c=>c[0]).map(([n,t])=>`<b>${n}</b> ${i18n(t)}`).join(" · ")}</p>`:"";
  const impHtml=imp.length?`<div class="acc-plan-h">${i18n("Последствия для людей")}</div>${summary}<ul class="acc-impact">${shown.map(x=>`<li class="${x.bad?"bad":"good"}"><b>${escHtml(x.u.login)}</b> ${x.text}</li>`).join("")}${imp.length>shown.length?`<li class="sub">${i18n("и ещё")} ${imp.length-shown.length}</li>`:""}</ul>`
    :`<p class="sub">${i18n("Ни у кого не меняется ни вход, ни набор видимых объектов")}</p>`;
  askConfirm("План изменений",`<div class="acc-plan-h">${i18n("Что будет записано")}</div><ol class="acc-plan">${lines.map(l=>`<li>${l}</li>`).join("")}</ol>${impHtml}`,"","Применить",()=>{
    accLogPlan(lines);
    accSt().users.forEach(u=>{delete u.pwdReset;delete u.pwdSet;delete u.must;delete u.imported;delete u.impUpd;delete u.impTouched});
    accCats().forEach(c=>delete c.pwdSet);
    const cl=accData().cellLog=accData().cellLog||[];accRoles().forEach(r=>accCellDiff(r.id,"groups").forEach(c=>cl.unshift({t:accNow(),who:ACC_ME,rid:r.id,gid:c.id,f:c.f,from:c.from,to:c.to})));
    accData().srv=accClone(accData().ed);accOvNote=null;toast(i18n("Изменения применены"));paint();
  },{html:true,cancelLabel:"Закрыть"});
}

// История пишется при применении: что именно записали и кто.
function accLogPlan(lines){
  const tmp=document.createElement("div");
  accPlanLines();const meta=accPlanMeta;  // кого затрагивают строки-«массовки»
  lines.forEach((h,i)=>{tmp.innerHTML=h;const text=tmp.textContent,m=meta[i];
    // Роль записи — та, что названа первой; остальные упомянутые тоже видят её в истории.
    const all=[...accRoles(),...accSrv().roles.filter(r=>!accRole(r.id))];
    const hits=all.map(r=>({id:r.id,at:text.indexOf(`«${r.n}»`)})).filter(x=>x.at>=0).sort((a,b)=>a.at-b.at);
    const role=hits[0]?.id,roles=[...new Set(hits.map(x=>x.id))];
    const words=text.split(/[\s:,()]+/);
    const user=m?null:[...accUsers(),...accSrv().users].find(u=>words.includes(u.login))?.id;
    const e={t:accNow(),who:ACC_ME,text,...(role?{role,roles}:{}),...(user?{user}:{}),...(m?.group?{group:m.group}:{})};
    accSt().log.unshift(e);accSrv().log.unshift(accClone(e));
    // Массовая правка: у роли одна запись (она выше), а у каждого затронутого —
    // своя короткая, чтобы история пользователя не молчала. У группы — одна запись.
    if(m)(m.users||[{ids:m.ids,short:m.short}]).forEach(x=>x.ids.forEach(id=>{const ue={t:e.t,who:ACC_ME,text:x.short,user:id};accSt().log.unshift(ue);accSrv().log.unshift(accClone(ue))}));
  });
}
// ── Защита от самоблокировки ──
// Администратор с неограниченным доступом должен остаться хотя бы один —
// включённый, с действующим назначением. Иначе правку не принимаем.
function accAdminCount(st){return accUsers(st).filter(u=>accUserRoles(u,true,st).some(id=>accRole(id,st)?.g.unr)).length}
function accHasUnr(u,st){return!!u&&accUserRoles(u,true,st).some(id=>accRole(id,st)?.g.unr)}
function accGuard(mutate){
  const trial=accClone(accSt());
  mutate(trial);accResolveAll(trial);
  if(accAdminCount(trial)===0){toast(i18n("Нельзя: система останется без администратора с неограниченным доступом"));return false}
  // Свой неограниченный доступ, в том числе полученный через группу, не отнять.
  const me=accMe(accSt());
  if(accHasUnr(me,accSt())&&!accHasUnr(accUser(me.id,trial),trial)){toast(i18n("Нельзя: вы потеряете свой неограниченный доступ"));return false}
  mutate(accSt());return true;
}

function accUserMatch(u,f){
  switch(f){
    case"noroles":return!accUserRoles(u,true).length;
    case"off":return!u.on;
    case"stale":return accStale(u);
    case"expired":return accAcctExpired(u)||accUserRoles(u,false).some(id=>accExpired(u,id));
    case"soon":return accAcctSoon(u)||accUserRoles(u,false).some(id=>accSoon(u,id));
    case"ldap":return!!u.ldap;
    case"multi":return accUserRoles(u,true).length>1;

// только для чтения. Роли группы получают все участники, включая будущих;
// пользователь получает роли своих групп плюс личные, доступ — наибольший.
const ACC_TZN={"Europe/Moscow":"Москва","Europe/Kaliningrad":"Калининград","Asia/Yekaterinburg":"Екатеринбург","Asia/Novosibirsk":"Новосибирск","Asia/Vladivostok":"Владивосток","UTC":"UTC"};
const ACC_WD=["пн","вт","ср","чт","пт","сб","вс"];
const ACC_GTABS=[["gmem","Состав"],["grl","Роли"],["ghist","История"]];
const ACC_CTABS=[["cconn","Подключение"],["csch","Расписание"],["cgrp","Группы каталога"]];
const ACC_GFILT=[["all","Все"],["manual","Вручную"],["dir","Из каталога"],["noroles","Без ролей"],["nomem","Без участников"],["err","Ошибка синхронизации"]];
const ACC_LOCK=`<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="7" width="9.6" height="6.8" rx="1.4"/><path d="M5.4 7V5.2a2.6 2.6 0 0 1 5.2 0V7"/></svg>`;
function accCats(st){return(st||accSt()).cats||[]}
function accCat(id,st){return accCats(st).find(c=>c.id===id)||null}
function accBoth(fn){[accSrv(),accSt()].forEach(fn)}
function accUGMatch(g,f){
  switch(f){case"manual":return!g.src;case"dir":return!!g.src;case"noroles":return!g.roles.length;case"nomem":return!g.members.length;case"err":return g.src?.status==="err";default:return true}
}
// Группа против сервера: новая, удалённая и изменённая в черновике.
function accUGDiff(gid){
  const a=accUG(gid),b=accUG(gid,accSrv());
  if(!a||!b)return true;
  const k=g=>({n:g.n,c:g.comment||"",r:g.roles,u:g.until||"",m:g.members,s:g.src?1:0});
  return accCanon(k(a))!==accCanon(k(b));
}
function accSyncAgo(t){
  if(!t)return i18n("никогда");
  const m=Math.max(0,Math.round((Date.now()-new Date(t.replace(" ","T")))/6e4));
  if(m<1)return i18n("только что");
  if(m<60)return`${m} ${i18n("мин назад")}`;
  const h=Math.floor(m/60);
  if(h<24)return`${h} ${plural(h,"час|часа|часов")} ${i18n("назад")}`;
  const d=Math.floor(h/24);
  return`${d} ${plural(d,"день|дня|дней")} ${i18n("назад")}`;
}
function accSyncHtml(o){
  if(!o)return`<span class="sub">—</span>`;
  if(o.status==="run")return`<span class="acc-sync run">${i18n("идёт…")}</span>`;
  if(o.status==="err")return`<span class="acc-sync err" title="${escHtml(o.msg||"")}">${i18n("ошибка")} ${accSyncAgo(o.at)}</span>`;
  if(o.status==="never")return`<span class="acc-sync never">${i18n("не выполнялась")}</span>`;
  return`<span class="acc-sync ok">${accSyncAgo(o.at)}</span>`;
}
function accSchedText(s){
  const days=s.every==="week"?[...s.days].sort():[1,2,3,4,5,6,7];
  return`${days.length===7?i18n("каждый день"):days.map(x=>i18n(ACC_WD[x-1])).join(", ")} ${i18n("в")} ${s.at} (${i18n(ACC_TZN[s.tz]||s.tz)})`;
}
function accNextRun(s){
  const now=accNow();
  for(let i=0;i<=7;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    if(s.every==="week"&&!s.days.includes((d.getDay()+6)%7+1))continue;
    const t=`${accIso(i)} ${s.at}`;if(t>now)return t;
  }
  return"";
}
function accSrcChip(g){
  return g.src?`<span class="acc-chip sm acc-src cat" title="${i18n("Состав берётся из каталога и меняется только там")}">${i18n("каталог")} ${escHtml(accCat(g.src.cat)?.n||g.src.cat)}</span>`
    :`<span class="acc-chip sm acc-src man" title="${i18n("Состав ведёт администратор")}">${i18n("вручную")}</span>`;
}
function accGRoleChips(g){
  return g.roles.length?g.roles.map(id=>`<span class="acc-chip sm"><button type="button" class="lk" onclick="event.stopPropagation();accGo('role:${id}','global')">${escHtml(accRoleName(id))}</button></span>`).join(""):`<span class="acc-bad">${i18n("нет")}</span>`;
}
function accGUntilText(g){
  if(!g.roles.length)return`<span class="sub">—</span>`;
  if(!g.until)return`<span class="sub">${i18n("бессрочно")}</span>`;
  return accDays(g.until)<0?`<span class="acc-bad">${i18n("истёк")} ${accFmt(g.until)}</span>`:`${i18n("до")} ${accFmt(g.until)}`;
}
function accGLink(id){return`<button type="button" class="lk" onclick="event.stopPropagation();accGo('ug:${id}')">${escHtml(accUGName(id))}</button>`}
// Откуда у пользователя роль: напрямую, через группу или и то и другое.
function accViaHtml(e){
  const gs=[...(e.via?[e.via]:[]),...e.alsoVia];
  if(!e.via)return i18n("напрямую")+(gs.length?` · ${i18n(gs.length>1?"и через группы":"и через группу")} ${gs.map(id=>accGLink(id)).join(", ")}`:"");
  return`${i18n(gs.length>1?"через группы":"через группу")} ${gs.map(id=>accGLink(id)).join(", ")}`;
}
// Что потеряют люди, если применить правку к копии черновика: роли, вход и
// учётные записи, созданные синхронизацией. Считается тем же расчётом, что и вход.
function accLoss(mutate){
  const a=accSt(),b=accClone(a);mutate(b);accResolveAll(b);
  const bu=new Map(b.users.map(u=>[u.id,u])),roles=new Map();let users=0,noSign=0;
  a.users.forEach(u=>{
    const v=bu.get(u.id),ra=accUserRoles(u,true,a),rb=v?accUserRoles(v,true,b):[];
    const lost=ra.filter(id=>!rb.includes(id));
    if(lost.length){users++;lost.forEach(id=>roles.set(id,(roles.get(id)||0)+1))}
    if(accUserSignIn(u,a)&&!(v&&accUserSignIn(v,b)))noSign++;
  });
  const orphan=a.users.filter(u=>{const v=u.synced&&bu.get(u.id);return v&&!v.synced&&!accGroupsOf(v,b).length}).length;
  return{users,roles:[...roles].sort((x,y)=>y[1]-x[1]),noSign,removed:a.users.length-b.users.length,orphan};
}
function accLossHtml(l){
  const p=[];
  if(l.roles.length)p.push(`<p>${i18n("Роли потеряют")} ${accWho(l.users)}: ${l.roles.map(([id,n])=>`«${escHtml(accRoleName(id))}» — ${n}`).join(", ")}</p>`);
  if(l.noSign)p.push(`<p><b>${accWho(l.noSign)}</b> ${i18n(plural(l.noSign,"потеряет вход в систему|потеряют вход в систему|потеряют вход в систему"))}</p>`);
  if(l.removed)p.push(`<p>${l.removed} ${i18n(plural(l.removed,"учётная запись, созданная синхронизацией и не использовавшаяся, будет удалена|учётные записи, созданные синхронизацией и не использовавшиеся, будут удалены|учётных записей, созданных синхронизацией и не использовавшихся, будут удалены"))}</p>`);
  if(l.orphan)p.push(`<p>${l.orphan} ${i18n(plural(l.orphan,"учётная запись останется|учётные записи останутся|учётных записей останутся"))} ${i18n("без группы")}</p>`);
  if(!p.length)p.push(`<p class="sub">${i18n("Ни у кого не пропадут роли")}</p>`);
  return p.join("");
}
// Убирает группу из копии состояния вместе с пользователями, которых для неё
// создала синхронизация и которые больше нигде не нужны.
function accUGRemove(st,gid){
  st.groups=st.groups.filter(x=>x.id!==gid);
  const keep=new Set(st.groups.flatMap(x=>x.members)),gone=new Set();
  // Удаляем только то, что синхронизация создала и никто не использовал; остальные остаются обычными LDAP-пользователями.
  st.users.forEach(u=>{if(u.synced!==gid)return;if(!u.roles.length&&!keep.has(u.id)&&!u.last&&u.login!==ACC_ME)gone.add(u.id);else delete u.synced});
  accDropUsers(st,gone);
}

  const items=all.filter(g=>accUGMatch(g,accUGFilt));
  const body=listCard({key:"accug",how:"acc",title:"Группы пользователей",items,
    text:g=>[g.n,g.comment,g.src?.dn,accCat(g.src?.cat)?.n,...g.roles.map(id=>accRoleName(id))],
    row:g=>`<tr class="click" onclick="accGo('ug:${g.id}')"><td><button type="button" class="lk">${escHtml(g.n)}</button> ${accSrcChip(g)}${accUGDiff(g.id)?` <span class="acc-mod">●</span>`:""}${g.comment?`<small class="acc-cmt">${escHtml(g.comment)}</small>`:""}</td>
      <td><button type="button" class="lk" onclick="event.stopPropagation();accGo('ug:${g.id}','gmem')">${g.members.length}</button></td>
      <td>${accGRoleChips(g)}</td><td>${accGUntilText(g)}</td><td>${g.src?accSyncHtml(g.src):`<span class="sub">—</span>`}</td></tr>`,
    wrap:rows=>`<table class="acc-tbl"><tr><th>${i18n("Группа")}</th><th>${i18n("Участники")}</th><th>${i18n("Роли")}</th><th>${i18n("Срок")}</th><th>${i18n("Синхронизация")}</th></tr>${rows}</table>`,
    ph:"Поиск по названию, каталогу и роли",unit:"группа|группы|групп",empty:all.length?"Таких групп нет":"Групп нет"});
  paintMain(mainHd("",i18n("Права"),ACC_SUB,accListTabs(),accActsHtml()+`<button type="button" class="btn s" onclick="accGo('cats')">${i18n("Каталоги")}</button><button type="button" class="btn s pri" onclick="accUgOpen()">${i18n("Новая группа пользователей")}</button>`)
    +`<div class="sc"><p class="acc-hint">${i18n("Группа пользователей — только список людей и ролей, своих прав у неё нет. Участники получают роли группы вместе с личными, а доступ считается по наибольшему из всех ролей. Состав либо ведёте вы, либо его берёт из каталога синхронизация")}</p><div class="acc-filts">${chips}</div>${body}</div>`);
}

// ── Карточка группы ──

  if(!ACC_GTABS.some(t=>t[0]===accTab))accTab="gmem";
  const cat=g.src?accCat(g.src.cat):null,cnt={gmem:g.members.length,grl:g.roles.length},isNew=!accUG(g.id,accSrv());
  const tabsH=ACC_GTABS.map(([id,x])=>`<button class="tab ${accTab===id?"on":""}" onclick="accTab='${id}';accMenuClose();${id==="gmem"?`resetPage('accgm:${g.id}');accGSel.clear();`:""}accUI()">${i18n(x)}${cnt[id]!=null?` <span class="acc-tabcnt ${id==="grl"&&!g.roles.length?"warn":""}">${cnt[id]}</span>`:""}</button>`).join("");
  const cr=`<button type="button" class="cr-link" onclick="accGo('roles')">${i18n("Права")}</button><span class="cr-sep">›</span><button type="button" class="cr-link" onclick="accGo('ugroups')">${i18n("Группы пользователей")}</button>`;
  const title=`<span class="hd-ic">${ic(g.src?"acc_cat":"acc_group")}</span>${i18n("Группа пользователей")} «${escHtml(g.n)}» ${g.src?`<span class="acc-own" title="${escHtml(g.src.dn)}">${i18n("из каталога")} ${escHtml(cat?.n||g.src.cat)}</span>`:`<span class="acc-own">${i18n("вручную")}</span>`}${isNew?` <span class="acc-own">${i18n("в черновике")}</span>`:""}`;
  const sub=[g.comment,g.src?`${i18n("группа каталога")} ${g.src.dn}`:""].filter(Boolean).map(escHtml).join(" · ");
  const acts=accActsHtml()+`<button type="button" class="btn s" onclick="accUGMenu(this,'${g.id}')">${i18n("Действия")} ▾</button>`;
  const body={gmem:accGmHtml,grl:accGrlHtml,ghist:g=>accHistoryRows(e=>e.group===g.id,"acchist:"+g.id)}[accTab](g);
  paintMain(mainHd(cr,title,sub,tabsH,acts)+`<div class="sc">${body}</div>`);
}
function accUGMenu(el,gid){
  const g=accUG(gid);if(!g)return;
  accMenuOpen(el,`<button type="button" class="mi" onclick="accMenuClose();accUgOpen('${gid}')">${i18n("Переименовать")}…</button>
    ${g.src?`<button type="button" class="mi" ${g.src.status==="run"?"disabled":""} onclick="accMenuClose();accSyncRun('${g.src.cat}','${gid}')">${i18n("Синхронизировать сейчас")}</button>
    <button type="button" class="mi" onclick="accMenuClose();accUGDetach('${gid}')">${i18n("Сделать ручной группой")}…<small>${i18n("состав сохранится, синхронизация прекратится")}</small></button>`:""}
    <div class="acc-sep"></div><button type="button" class="mi danger" onclick="accMenuClose();accUGDelete('${gid}')">${i18n("Удалить группу")}…</button>`);
}
function accUGDelete(gid,stay){
  const g=accUG(gid);if(!g)return;
  const l=accLoss(st=>accUGRemove(st,gid));
  askConfirm(g.src?"Отключить группу каталога?":"Удалить группу?",`<p>${i18n("Группа")} «${escHtml(g.n)}» ${i18n("будет удалена")}${g.members.length?` (${g.members.length} ${plural(g.members.length,"участник|участника|участников")})`:""}${g.src?`; ${i18n("в каталоге она останется")}`:""}</p>${accLossHtml(l)}<p class="sub">${i18n("Изменение попадёт в черновик")}</p>`,"",g.src?"Отключить":"Удалить",()=>{
    if(!accGuard(st=>accUGRemove(st,gid)))return;
    toast(`${i18n(g.src?"Группа каталога отключена":"Группа удалена")}: «${g.n}» — ${i18n("в черновике")}`);
    if(stay)accEdited();else{accResolveAll();accGo("ugroups")}
  },{html:true});
}
function accUGDetach(gid){
  const g=accUG(gid);if(!g||!g.src)return;
  askConfirm("Сделать группу ручной?",`${i18n("Группа")} «${escHtml(g.n)}» ${i18n("станет ручной: участники и роли сохранятся, но каталог перестанет менять состав. Вернуть связь можно, подключив группу каталога заново — это будет новая группа")}`,"","Сделать ручной",()=>{
    if(accGuard(st=>{const x=st.groups.find(y=>y.id===gid);if(x){x.src=null;st.users.forEach(u=>{if(u.synced===gid)delete u.synced})}})){accEdited();toast(`${i18n("Группа")} «${g.n}» ${i18n("теперь ручная — в черновике")}`)}
  },{html:true});
}

// ── Состав группы ──
let accGSel=new Set(),accGmO=null,accGm=null;
function accGmHtml(g){
  const us=g.members.map(id=>accUser(id)).filter(Boolean),dir=!!g.src,cat=dir?accCat(g.src.cat):null,sg=accUG(g.id,accSrv());
  const alive=new Set(us.filter(u=>u.login!==ACC_ME).map(u=>u.id));
  [...accGSel].forEach(id=>{if(!alive.has(id))accGSel.delete(id)});
  const row=u=>{const me=u.login===ACC_ME,was=!sg||sg.members.includes(u.id);
    const others=accUserRoles(u,false).filter(id=>!g.roles.includes(id)).map(id=>escHtml(accRoleName(id))).join(", ");
    return`<tr data-uid="${u.id}" class="${was?"":"chg"} ${accUserActive(u)?"":"off"} ${accGSel.has(u.id)?"sel":""}">${dir?"":`<td class="acc-ck">${me?"":`<input type="checkbox" class="acc-rowchk" ${accGSel.has(u.id)?"checked":""} aria-label="${i18n("Выбрать")} ${escHtml(u.login)}" onchange="accGmPick('${u.id}',this.checked)">`}</td>`}<td><button type="button" class="lk" onclick="accGo('user:${u.id}')">${escHtml(u.login)}</button>${u.ldap?` <span class="acc-chip sm" title="LDAP ${escHtml(u.ldap)}">LDAP</span>`:""}${u.synced?` <span class="acc-chip sm" title="${i18n("Учётная запись создана при подключении группы каталога")}">${i18n("создан синхронизацией")}</span>`:""}</td><td>${escHtml(u.name)}</td>
      <td class="sub">${dir?i18n("из каталога"):i18n("вручную")}</td><td class="sub">${others||"—"}</td><td>${accUserStateHtml(u)}</td></tr>`};
  const head=dir?`<button type="button" class="btn s" ${g.src.status==="run"?"disabled":""} onclick="accSyncRun('${g.src.cat}','${g.id}')">${i18n(g.src.status==="run"?"Идёт синхронизация…":"Синхронизировать сейчас")}</button>`
    :`<button type="button" class="btn s pri" onclick="accGmOpen('${g.id}')">${i18n("Добавить пользователей…")}</button>`;
  const lock=dir?`<div class="nt acc-lock">${ACC_LOCK}<div class="acc-lock-t">${i18n("Состав управляется синхронизацией с")} «${escHtml(g.src.dn)}» ${i18n("каталога")} ${escHtml(cat?.n||g.src.cat)}. ${i18n("Последняя синхронизация:")} ${accSyncAgo(g.src.at)}. ${i18n("Чтобы изменить состав, измените группу в каталоге")}</div></div>
    ${g.src.status==="err"?`<div class="nt err">${i18n("Ошибка синхронизации:")} ${escHtml(g.src.msg)}</div>`:""}`:"";
  setTimeout(accSelHead,0);
  accGmO={key:"accgm:"+g.id,how:"acc",title:`${i18n("Участники")}: ${us.length}`,items:us,text:u=>[u.login,u.name],head,row,
    wrap:rows=>`<table class="acc-tbl"><tr>${dir?"":`<th class="acc-ck"><input type="checkbox" id="accPageChk" aria-label="${i18n("Выбрать всех на странице")}" title="${i18n("Выбрать всех на странице")}" onchange="accGmPage(this.checked)"></th>`}<th>${i18n("Логин")}</th><th>${i18n("Имя")}</th><th>${i18n("Откуда")}</th><th>${i18n("Другие роли")}</th><th>${i18n("Состояние")}</th></tr>${rows}</table>`,
    mid:!dir&&alive.size?found=>accGmBar(g,found):null,ph:"Поиск по логину и имени",unit:"пользователь|пользователя|пользователей",empty:"В группе нет участников"};
  return lock+listCard(accGmO);
}
function accGmBar(g,found){
  const n=accGSel.size,pool=found.filter(u=>u.login!==ACC_ME),all=pool.length>0&&pool.every(u=>accGSel.has(u.id));
  const pick=all?"":pool.length?`<button type="button" class="btn s" onclick="accGmSelAll(true)">${i18n("Выбрать всех найденных")} (${pool.length})</button>`:"";
  const clear=n?`<button type="button" class="btn s" onclick="accGmSelAll(false)">${i18n("Снять выделение")}</button>`:"";
  return`<div class="acc-bulk" id="accBulkBar" role="toolbar" aria-label="${i18n("Действия над выбранными")}"><div class="l"><span class="cnt">${n?`${i18n("Выбрано")} ${n}`:i18n("Ничего не выбрано")}</span>${pick}${clear}</div>
    <div class="r"><button type="button" class="btn s" title="${i18n("Участники группы")}: ${g.members.length}" onclick="accGmExport('${g.id}')">${i18n("Экспорт CSV")}</button><button type="button" class="btn s" ${n?"":"disabled"} onclick="accGmRemove('${g.id}')">${i18n("Исключить из группы")}</button></div></div>`;
}
function accGmPick(id,on){accSelToggle(accGSel,id,on)}
function accGmPage(on){accSelPage(accGSel,on)}
function accGmSelAll(on){
  if(on)listFound(accGmO).forEach(u=>{if(u.login!==ACC_ME)accGSel.add(u.id)});else accGSel.clear();
  accSelPaint();
}
function accGmRemove(gid){
  const g=accUG(gid);if(!g||g.src)return;
  const set=new Set([...accGSel].filter(id=>g.members.includes(id))),n=set.size;if(!n)return;
  if(accGuard(st=>{const x=st.groups.find(y=>y.id===gid);if(x)x.members=x.members.filter(id=>!set.has(id))})){
    accGSel.clear();accEdited();toast(`${i18n("Исключено из группы")} «${g.n}»: ${accWho(n)} — ${i18n("в черновике")}`);
  }
}
// «Добавить пользователей…»: то же окно, что и для роли, но пул — те, кого в группе ещё нет.
function accGmOpen(gid){
  const g=accUG(gid);if(!g||g.src)return;
  accMenuClose();
  accGm={gid,q:"",chip:"all",sel:new Set()};
  accDrawer("accGm",`${i18n("Добавить пользователей в группу")} «${g.n}»`,true);
  document.getElementById("accGmSt").innerHTML="";document.getElementById("accGmN").textContent="";
  document.getElementById("accGmBd").innerHTML=`<div class="sq lst-sq" style="margin:0 0 8px"><span class="sq-lead">${IC_FIND}</span><input type="text" placeholder="${i18n("Логин или имя…")}" autocomplete="off" oninput="accGm.q=this.value;accGmLive()"></div>
    <div class="acc-filts" id="accGmChips" style="margin-bottom:8px"></div>
    <div class="acc-ad-h"><span class="sub" id="accGmCnt"></span><button type="button" class="lk" id="accGmAll" onclick="accGmAll()"></button></div>
    <div class="acc-ulist tall" id="accGmUl"></div>
    <p class="acc-hint" style="margin-top:12px">${g.roles.length?`${i18n("Новые участники получат роли группы:")} ${g.roles.map(id=>`«${escHtml(accRoleName(id))}»`).join(", ")}${g.until?` ${i18n("до")} ${accFmt(g.until)}`:""}`:i18n("У группы пока нет ролей: участники ничего не получат. Роли добавляются на вкладке «Роли»")}</p>`;
  document.getElementById("accGmFt").innerHTML=`<button class="btn" onclick="accDrawerClose('accGm')">${i18n("Отмена")}</button><button class="btn pri" id="accGmOk" style="margin-left:auto" onclick="accGmApply()"></button>`;
  accGmLive();
}
function accGmPool(){const g=accUG(accGm.gid);return accUsers().filter(u=>u.login!==ACC_ME&&!g.members.includes(u.id))}
function accGmFound(){
  const a=accGm,q=a.q.trim().toLowerCase();
  return accGmPool().filter(u=>(a.chip==="all"||(a.chip==="none"?!accUserRoles(u,false).length:a.chip==="ldap"?!!u.ldap:!u.ldap))&&(!q||u.login.toLowerCase().includes(q)||u.name.toLowerCase().includes(q)));
}
function accGmLive(){
  const a=accGm;if(!a)return;
  const pool=accGmPool(),list=accGmFound();
  document.getElementById("accGmChips").innerHTML=[["all","Все",pool.length],["none","Без ролей",pool.filter(u=>!accUserRoles(u,false).length).length],["ldap","LDAP",pool.filter(u=>u.ldap).length],["local","Локальные",pool.filter(u=>!u.ldap).length]]
    .map(([id,t,n])=>`<button type="button" class="acc-filt ${a.chip===id?"on":""}" onclick="accGm.chip='${id}';accGmLive()">${i18n(t)} <b>${n}</b></button>`).join("");
  document.getElementById("accGmUl").innerHTML=list.length?list.slice(0,300).map(u=>`<label class="acc-chk"><input type="checkbox" ${a.sel.has(u.id)?"checked":""} onchange="accGmPickU('${u.id}',this.checked)">
    <span>${escHtml(u.login)}${u.ldap?` <span class="acc-chip sm">LDAP</span>`:""} <span class="sub">— ${escHtml(u.name)}${accUserRoles(u,false).length?" · "+accUserRoles(u,false).map(id=>escHtml(accRoleName(id))).join(", "):""}</span></span></label>`).join("")+(list.length>300?`<p class="sub" style="padding:8px 0">${i18n("Показаны первые 300 — уточните поиск или выберите всех найденных")}</p>`:"")
    :`<p class="sub">${i18n(pool.length?"Ничего не найдено":"Все пользователи уже в этой группе")}</p>`;
  accGmFoot();
}
function accGmFoot(){
  const a=accGm;if(!a)return;
  const list=accGmFound(),all=list.length>0&&list.every(u=>a.sel.has(u.id));
  document.getElementById("accGmCnt").textContent=`${i18n("Найдено")}: ${list.length}`;
  const l=document.getElementById("accGmAll");
  l.textContent=all?i18n("Снять выделение"):`${i18n("Выбрать всех найденных")} (${list.length})`;l.hidden=!list.length;
  const ok=document.getElementById("accGmOk");ok.textContent=`${i18n("В черновик")} (${a.sel.size})`;ok.disabled=!a.sel.size;
}
function accGmPickU(id,on){on?accGm.sel.add(id):accGm.sel.delete(id);accGmFoot()}
function accGmAll(){
  const a=accGm,list=accGmFound(),all=list.length>0&&list.every(u=>a.sel.has(u.id));
  list.forEach(u=>all?a.sel.delete(u.id):a.sel.add(u.id));
  accGmLive();
}
function accGmApply(){
  const a=accGm;if(!a||!a.sel.size)return;
  const set=new Set(a.sel),n=set.size,g=accUG(a.gid);
  if(!accGuard(st=>{const x=st.groups.find(y=>y.id===a.gid);if(x)x.members=[...new Set([...x.members,...set])]}))return;
  accDrawerClose("accGm");accEdited();
  toast(`${i18n("В группу")} «${g.n}» ${i18n("добавлено")}: ${accWho(n)} — ${i18n("в черновике")}`);
}

// ── Роли группы ──
function accGrlHtml(g){
  const warn=[];
  if(!g.roles.length)warn.push(`<div class="nt err">${i18n("У группы нет ролей: участники ничего не получают")}</div>`);
  else if(g.until&&accDays(g.until)<0)warn.push(`<div class="nt err">${i18n("Срок ролей группы истёк")} ${accFmt(g.until)}: ${i18n("участники их больше не получают")}</div>`);
  if(g.src&&g.roles.some(id=>accRole(id)?.g.unr))warn.push(`<div class="nt err">${i18n("Группа даёт неограниченный доступ, а её состав определяет каталог, а не вы")}</div>`);
  const others=accRoles().filter(r=>!g.roles.includes(r.id));
  const rows=g.roles.map(id=>{const r=accRole(id);if(!r)return"";
    return`<tr><td><button type="button" class="lk" onclick="accGo('role:${id}','global')">${escHtml(r.n)}</button></td><td class="sub">${escHtml(accSummary(r.g))}</td><td style="text-align:right"><button type="button" class="btn s" onclick="accUGRoleRemove('${g.id}','${id}')">${i18n("Снять")}</button></td></tr>`}).join("");
  const add=`<select style="width:auto;min-width:220px" onchange="if(this.value)accUGRoleAdd('${g.id}',this.value)"><option value="">${i18n("Добавить роль…")}</option>${others.map(r=>`<option value="${r.id}">${escHtml(r.n)}</option>`).join("")}</select>`;
  return`${warn.join("")}
    ${card(`${i18n("Роли группы")} (${g.roles.length})`,g.roles.length?`<table class="acc-tbl"><tr><th>${i18n("Роль")}</th><th>${i18n("Функции")}</th><th></th></tr>${rows}</table>`:`<p class="sub">${i18n("Ролей нет")}</p>`,add)}
    ${card("Срок",`<div class="acc-wz-f"><label>${i18n("Роли группы действуют до")}</label><div class="acc-pwd"><input type="date" class="acc-date" style="width:200px" value="${g.until||""}" onchange="accUGUntil('${g.id}',this.value)"><span class="sub" style="align-self:center">${i18n("пусто — бессрочно")}</span></div></div>
      <p class="acc-hint" style="margin:0">${i18n("Роли группы получают все участники, включая будущих. Снять роль у отдельного участника нельзя: только убрать её у группы или исключить участника")}</p>`)}`;
}
function accUGRoleAdd(gid,rid){
  if(accGuard(st=>{const g=st.groups.find(x=>x.id===gid);if(g&&!g.roles.includes(rid))g.roles.push(rid)})){
    accEdited();toast(`${i18n("Роль")} «${accRoleName(rid)}» ${i18n("добавлена группе")} «${accUGName(gid)}» — ${i18n("в черновике")}`);
  }
}
function accUGRoleRemove(gid,rid){
  const g=accUG(gid);if(!g)return;
  const mut=st=>{const x=st.groups.find(y=>y.id===gid);if(x)x.roles=x.roles.filter(r=>r!==rid)};
  const l=accLoss(mut);
  askConfirm("Снять роль у группы?",`<p>${i18n("Роль")} «${escHtml(accRoleName(rid))}» ${i18n("перестанет действовать у участников группы")} «${escHtml(g.n)}» (${g.members.length}), ${i18n("если не выдана им напрямую или другой группой")}</p>${accLossHtml(l)}`,"","Снять",()=>{
    if(accGuard(mut)){accEdited();toast(`${i18n("Роль")} «${accRoleName(rid)}» ${i18n("снята у группы")} «${g.n}» — ${i18n("в черновике")}`)}
  },{html:true});
}
function accUGUntil(gid,v){
  if(accGuard(st=>{const g=st.groups.find(x=>x.id===gid);if(g)g.until=v||""}))accEdited();
  else accUI();
}

// ── Новая группа и переименование ──
let accUgd=null;
function accUgOpen(gid,members){
  accMenuClose();accData();
  const g=gid?accUG(gid):null;
  accUgd={gid:g?.id||"",name:g?.n||"",comment:g?.comment||"",members:members||[],tried:false};
  accDrawer("accUg",g?"Переименовать группу":"Новая группа пользователей");
  document.getElementById("accUgSt").innerHTML="";document.getElementById("accUgN").textContent="";
  document.getElementById("accUgBd").innerHTML=`<div class="acc-wz-f"><label>${i18n("Название")}</label><input type="text" value="${escHtml(accUgd.name)}" autocomplete="off" oninput="accUgd.name=this.value;accUgLive()"><div class="fld-err" id="accUgE"></div></div>
    <div class="acc-wz-f"><label>${i18n("Описание")}</label><input type="text" value="${escHtml(accUgd.comment)}" oninput="accUgd.comment=this.value"></div>
    <p class="acc-hint">${g?i18n("Состав и роли группы не меняются"):`${accUgd.members.length?`${i18n("В группу будут добавлены выбранные пользователи:")} ${accUgd.members.length}. `:""}${i18n("Роли группе назначаются после создания: без них участники ничего не получают")}`}</p>`;
  document.getElementById("accUgFt").innerHTML=`<button class="btn" onclick="accDrawerClose('accUg')">${i18n("Отмена")}</button><button class="btn pri" style="margin-left:auto" onclick="accUgApply()">${i18n("В черновик")}</button>`;
}
function accUgErr(){
  const d=accUgd,n=d.name.trim();
  if(!n)return"Заполните поле";
  if(taken(accGroupsAll().filter(g=>g.id!==d.gid).map(g=>g.n),n))return"Группа с таким именем уже есть";
  return null;
}
function accUgLive(){const e=accUgd.tried?accUgErr():null,el=document.getElementById("accUgE");if(el)el.textContent=e?i18n(e):""}
function accUgApply(){
  const d=accUgd;if(!d)return;d.tried=true;
  if(accUgErr()){accUgLive();return}
  const n=d.name.trim(),c=d.comment.trim();
  if(d.gid){
    const g=accUG(d.gid);g.n=n;g.comment=c;
    accDrawerClose("accUg");accEdited();toast(`${i18n("Группа переименована")}: «${n}» — ${i18n("в черновике")}`);return;
  }
  const id="ug"+Date.now().toString(36);
  accSt().groups.push({id,n,comment:c,roles:[],until:"",src:null,members:[...d.members]});
  accDrawerClose("accUg");accResolveAll();
  toast(`${i18n("Группа")} «${n}» ${i18n("создана — в черновике")}`);
  accGo("ug:"+id,"grl");
}

// ── Массовые действия над группами из списка пользователей ──
function accBulkGrpMenu(el,kind){
  const ids=accBulkIds("u"),n=ids.length;if(!n)return;
  const set=new Set(ids);
  const gs=accGroupsAll().map(g=>({g,k:g.members.filter(id=>set.has(id)).length}));
  const lockTitle=i18n("состав управляется каталогом");
  let html;
  if(kind==="in"){
    html=gs.map(({g,k})=>g.src?`<button type="button" class="mi" disabled title="${lockTitle}">${escHtml(g.n)}<small>${lockTitle}</small></button>`
      :`<button type="button" class="mi" ${k===n?"disabled":""} onclick="accBulkToGroup('${g.id}')">${escHtml(g.n)}<small>${k?`${i18n("уже есть:")} ${k} ${i18n("из")} ${n}`:`${g.members.length} ${plural(g.members.length,"участник|участника|участников")}`}</small></button>`).join("")
      +`<div class="acc-sep"></div><button type="button" class="mi" onclick="accMenuClose();accUgOpen('',accBulkIds('u'))">${i18n("Новая группа пользователей")}…</button>`;
  }else{
    const have=gs.filter(x=>x.k);
    html=have.length?have.map(({g,k})=>g.src?`<button type="button" class="mi" disabled title="${lockTitle}">${escHtml(g.n)}<small>${lockTitle}</small></button>`
      :`<button type="button" class="mi" onclick="accBulkFromGroup('${g.id}')">${escHtml(g.n)}<small>${i18n("в группе")} ${k} ${i18n("из")} ${n}</small></button>`).join("")
      :`<div class="acc-why">${i18n("Выбранные не состоят ни в одной группе")}</div>`;
  }
  accMenuOpen(el,html);
}
function accBulkToGroup(gid){
  accMenuClose();
  const g=accUG(gid);if(!g||g.src)return;
  const ids=accBulkIds("u").filter(id=>!g.members.includes(id)),n=ids.length;
  if(!n)return;
  const set=new Set(ids);
  if(accGuard(st=>{const x=st.groups.find(y=>y.id===gid);if(x)x.members=[...x.members,...set]})){
    accEdited();toast(`${i18n("В группу")} «${g.n}» ${i18n("добавлено")}: ${accWho(n)} — ${i18n("в черновике")}`);
  }
}
function accBulkFromGroup(gid){
  accMenuClose();
  const g=accUG(gid);if(!g||g.src)return;
  const set=new Set(accBulkIds("u").filter(id=>g.members.includes(id))),n=set.size;
  if(!n)return;
  if(accGuard(st=>{const x=st.groups.find(y=>y.id===gid);if(x)x.members=x.members.filter(id=>!set.has(id))})){
    accEdited();toast(`${i18n("Из группы")} «${g.n}» ${i18n("исключено")}: ${accWho(n)} — ${i18n("в черновике")}`);
  }
}
// Группы из карточки пользователя.
function accUserToGroup(uid,gid){
  const g=accUG(gid);if(!g||g.src)return;
  if(accGuard(st=>{const x=st.groups.find(y=>y.id===gid);if(x&&!x.members.includes(uid))x.members.push(uid)})){accEdited();toast(`${i18n("Добавлен в группу")} «${g.n}» — ${i18n("в черновике")}`)}
}
function accUserFromGroup(uid,gid){
  const g=accUG(gid);if(!g||g.src)return;
  if(accGuard(st=>{const x=st.groups.find(y=>y.id===gid);if(x)x.members=x.members.filter(id=>id!==uid)})){accEdited();toast(`${i18n("Исключён из группы")} «${g.n}» — ${i18n("в черновике")}`)}
}

// ── Синхронизация (макет: изменений никогда нет) ──
function accSyncRun(cid,gid){
  const c=accCat(cid);if(!c||c.status==="run")return;
  const mine=g=>g.src?.cat===cid&&(!gid||g.id===gid);
  accBoth(st=>{const x=accCat(cid,st);if(x&&!gid)x.status="run";(st.groups||[]).forEach(g=>{if(mine(g))g.src.status="run"})});
  paint();
  setTimeout(()=>{
    const now=accNow();
    accBoth(st=>{const x=accCat(cid,st);if(x&&!gid){x.status="ok";x.at=now;x.dur=7;x.msg=""}
      (st.groups||[]).forEach(g=>{if(mine(g)){g.src.status="ok";g.src.at=now;g.src.msg=""}})});
    toast(gid?`${i18n("Синхронизация группы")} «${accUGName(gid)}» ${i18n("завершена: изменений нет")}`:`${i18n("Синхронизация")} ${c.n} ${i18n("завершена: изменений нет")}`);
    if(app==="acc")paint();
  },1500);
}

function accCatConn(c){return{server:c.server,port:c.port,ssl:c.ssl,bind:c.bind,baseDn:c.baseDn,filter:c.filter,attrLogin:c.attrLogin,attrName:c.attrName,importOthers:c.importOthers,pwdSet:!!c.pwdSet}}

// ── Группы в плане изменений ──
// Строки плана и записи истории: у группы одна запись, у каждого затронутого
// пользователя — своя короткая (accPlanMeta[...].users).
function accPlanGroups(out){
  const srv=accSrv(),ed=accSt(),sgs=srv.groups||[],egs=ed.groups||[];
  const nm=g=>`«${escHtml(g.n)}»`,dt=t=>t?`${i18n("до")} ${accFmt(t)}`:i18n("бессрочно");
  const rn=ids=>ids.map(id=>`«${escHtml(accRoleName(id))}»`).join(", ")||i18n("без ролей");
  const lg=ids=>ids.map(id=>(accUser(id)||accUser(id,srv))?.login||id);
  const cn=g=>escHtml(accCat(g.src?.cat)?.n||g.src?.cat||"");
  const put=(g,text,users)=>{accPlanMeta[out.length]={group:g.id,users:(users||[]).filter(x=>x.ids.length)};out.push(text)};
  const n1=n=>`${n} ${i18n(plural(n,"участник|участника|участников"))}`;
  egs.forEach(g=>{
    const s=sgs.find(x=>x.id===g.id);
    if(!s){
      if(g.src){
        const made=ed.users.filter(u=>u.synced===g.id&&!accUser(u.id,srv)).map(u=>u.id),madeSet=new Set(made);
        put(g,`${i18n("Подключена группа каталога")} «${escHtml(g.src.dn)}» → ${i18n("группа")} ${nm(g)}, ${i18n("роли")} ${rn(g.roles)}${g.roles.length&&g.until?` ${dt(g.until)}`:""}, ${i18n("участников")}: ${g.members.length}, ${i18n("будет создано пользователей")}: ${made.length}`,
          [{ids:made,short:`${i18n("Создан синхронизацией с")} ${accCat(g.src.cat)?.n||""}`},{ids:g.members.filter(id=>!madeSet.has(id)),short:`${i18n("Добавлен в группу")} «${g.n}» (${i18n("каталог")})`}]);
      }else put(g,`${i18n("Создана группа")} ${nm(g)}: ${n1(g.members.length)}, ${i18n("роли")} ${rn(g.roles)}${g.roles.length&&g.until?` ${dt(g.until)}`:""}`,[{ids:g.members,short:`${i18n("Добавлен в группу")} «${g.n}»`}]);
      return;
    }
    if(s.n!==g.n)put(g,`${i18n("Группа")} «${escHtml(s.n)}» ${i18n("переименована в")} ${nm(g)}`);
    if((s.comment||"")!==(g.comment||""))put(g,`${i18n("Описание группы")} ${nm(g)} ${i18n("изменено")}`);
    if(s.src&&!g.src)put(g,`${i18n("Группа")} ${nm(g)} ${i18n("отключена от каталога")} ${escHtml(accCat(s.src.cat)?.n||"")}: ${i18n("участники сохранены")}`);
    const add=g.members.filter(id=>!s.members.includes(id)),rem=s.members.filter(id=>!g.members.includes(id));
    if(add.length)put(g,`${i18n("В группу")} ${nm(g)} ${i18n("добавлено")} ${add.length} ${i18n(plural(add.length,"пользователь|пользователя|пользователей"))}: ${accLogins(lg(add))}`,[{ids:add,short:`${i18n("Добавлен в группу")} «${g.n}»`}]);
    if(rem.length)put(g,`${i18n("Из группы")} ${nm(g)} ${i18n("исключено")} ${rem.length} ${i18n(plural(rem.length,"пользователь|пользователя|пользователей"))}: ${accLogins(lg(rem))}`,[{ids:rem.filter(id=>accUser(id)),short:`${i18n("Исключён из группы")} «${g.n}»`}]);
    const ra=g.roles.filter(id=>!s.roles.includes(id)),rr=s.roles.filter(id=>!g.roles.includes(id)),du=(s.until||"")!==(g.until||"");
    if(ra.length||rr.length||du){
      const bits=[...ra.map(id=>`+ «${escHtml(accRoleName(id))}»`),...rr.map(id=>`− «${escHtml(accRoleName(id))}»`),...(du?[`${i18n("срок")} ${dt(g.until)}`]:[])];
      put(g,`${i18n("Роли группы")} ${nm(g)}: ${bits.join(", ")}`);
    }
  });
  sgs.forEach(s=>{
    if(egs.some(g=>g.id===s.id))return;
    const gone=srv.users.filter(u=>u.synced===s.id&&!accUser(u.id)).length,alive=s.members.filter(id=>accUser(id));

      :`${i18n("Группа")} ${nm(s)} ${i18n("удалена")} (${n1(s.members.length)})`,[{ids:alive,short:`${i18n("Исключён из группы")} «${s.n}» (${i18n("группа удалена")})`}]);
  });
  (ed.cats||[]).forEach(c=>{

  });
}

    ACC_GLOB.forEach(([k,t,kind])=>add("Глобальные",i18n(t),accLv(kind,a.g[k]),accLv(kind,b.g[k])));
    add("Глобальные",i18n("Глубина архива"),accDepthText(a.g.depth),accDepthText(b.g.depth));
    add("Глобальные",i18n("Расписание входа"),i18n(ACC_TZ[a.tz||0]),i18n(ACC_TZ[b.tz||0]));
    add("Глобальные",i18n("Супервизор"),accSupText(a,true),accSupText(b,true));
    ACC_FEATURES.forEach(([k,t])=>add("Доступ к функциям",i18n(t),yn(a.g.feat.includes(k)),yn(b.g.feat.includes(k))));
    ACC_RESTR.forEach(([k,t])=>add("Ограничения",i18n(t),yn(a.g.restr?.[k]),yn(b.g.restr?.[k])));
    ACC_DEFS.forEach(([k,t,kind])=>add("По умолчанию",i18n(t),accLv(kind,a.g[k]),accLv(kind,b.g[k])));
    const gtxt=(r,gid)=>{const o=r.groups[gid]||{};const bits=ACC_GF.filter(([f])=>o[f]).map(([f,t])=>`${i18n(t)}: ${accLv(f,o[f])}`);return bits.join(" · ")||"—"};
    accGroups(domainFilter).forEach(g=>{if(a.groups[g.id]||b.groups[g.id])add(`${i18n("На папки устройств")} · ${domainLabel(g.dom)}`,g.root?accGroupName(g.id):"  ".repeat(g.depth)+g.name,gtxt(a,g.id),gtxt(b,g.id))});
    const otxt=(r,id)=>{const o=r.objs[id]||{};const bits=Object.keys(o).map(f=>`${i18n(ACC_FIELD_NAME[f])}: ${accLv(f,o[f])}`);return bits.join(" · ")||"—"};
    const oids=new Set([...Object.keys(a.objs),...Object.keys(b.objs)]);

    const ua=accRoleUsers(a.id,true).map(u=>u.login),ub=accRoleUsers(b.id,true).map(u=>u.login);

    body=`<div class="acc-bar"><label class="acc-chk"><input type="checkbox" ${accCmpOnly?"checked":""} onchange="accCmpOnly=this.checked;accUI()"> ${i18n("Только различия")} (${nd})</label></div>

// ── Проверка: что стоит прибрать ──
// Считается по состоянию — серверному или черновику; у каждой строки ключ,
// по которому страница понимает, что уже решено в черновике.
function accIssues(st){
  st=st||accSt();
  const out=[],rs=accRoles(st),us=accUsers(st);
  rs.forEach(r=>{
    const act=accRoleUsers(r.id,true,st).length;
    if(!accRoleUsers(r.id,false,st).length)out.push({key:"r-empty:"+r.id,k:"role",sev:1,text:`${i18n("Роль")} «${escHtml(r.n)}» ${i18n("никому не назначена")}`,go:`accGo('role:${r.id}','members')`,act:[i18n("Удалить"),`accDeleteRole('${r.id}',true)`]});
    else if(!r.g.unr&&!accHasNo(r.g)&&!accCanSignIn(r.g))out.push({key:"r-nologin:"+r.id,k:"role",sev:2,text:`${i18n("Роль")} «${escHtml(r.n)}» ${i18n("не даёт входа:")} ${act} ${plural(act,"пользователь|пользователя|пользователей")}`,go:`accGo('role:${r.id}','global')`});
    if(accHasNo(r.g))out.push({key:"r-norights:"+r.id,k:"role",sev:2,text:`${i18n("У роли")} «${escHtml(r.n)}» ${i18n("не заданы права")}`,go:`accGo('role:${r.id}','global')`});
    if(!r.g.unr){const ov=new Set();let n=0,dom1="";Object.keys(r.objs).forEach(oid=>{const dom=accObjDom(oid);if(!dom)return;let hit=false;Object.keys(r.objs[oid]).forEach(f=>{const xs=accExOverridden(r,oid,f,dom,st);xs.forEach(x=>ov.add(x.u.id));if(xs.length)hit=true});if(hit){n++;dom1=dom1||dom}});
      if(n)out.push({key:"r-exov:"+r.id,k:"role",sev:1,text:`${i18n("Роль")} «${escHtml(r.n)}»: ${i18n("исключения-понижения на")} ${n} ${plural(n,"объекте|объектах|объектах")} ${i18n("не действуют для")} ${ov.size} ${plural(ov.size,"пользователя|пользователей|пользователей")} — ${i18n("другая их роль даёт больше")}`,go:`accRevealDomain('${dom1}');accGo('role:${r.id}','objects');accFlash(()=>[...document.querySelectorAll('.acc-exov')].map(e=>e.closest('tr')))`});}
    if(r.sup?.role&&(r.sup.login||r.sup.export)&&!accRoleUsers(r.sup.role,true,st).length)out.push({key:"r-sup:"+r.id,k:"role",sev:2,text:`${i18n("Роль")} «${escHtml(r.n)}» ${i18n("ждёт подтверждения от роли")} «${escHtml(accRoleName(r.sup.role))}», ${i18n("а в ней нет действующих пользователей")}`,go:`accGo('role:${r.id}','global')`});
  });
  (st.groups||[]).forEach(g=>{
    const n=escHtml(g.n);
    if(!g.roles.length)out.push({key:"g-noroles:"+g.id,k:"group",sev:1,text:`${i18n("Группа")} «${n}» ${i18n("без ролей: участники ничего не получают")}`,go:`accGo('ug:${g.id}','grl')`,act:[i18n("Удалить"),`accUGDelete('${g.id}',true)`]});
    if(!g.members.length)out.push({key:"g-empty:"+g.id,k:"group",sev:1,text:`${i18n("Группа")} «${n}» ${i18n("без участников")}`,go:`accGo('ug:${g.id}','gmem')`});
    if(g.src?.status==="err")out.push({key:"g-err:"+g.id,k:"group",sev:2,text:`${i18n("Синхронизация группы")} «${n}»: ${escHtml(g.src.msg)}`,go:`accGo('cat:${g.src.cat}','cgrp')`});
    if(g.src&&g.roles.some(id=>accRole(id,st)?.g.unr))out.push({key:"g-unr:"+g.id,k:"group",sev:2,text:`${i18n("Группа каталога")} «${n}» ${i18n("даёт неограниченный доступ: состав контролирует каталог, а не вы")}`,go:`accGo('ug:${g.id}','grl')`});
    if(g.roles.length&&g.until&&accDays(g.until)<0)out.push({key:"g-exp:"+g.id,k:"group",sev:1,text:`${i18n("Срок ролей группы")} «${n}» ${i18n("истёк")} ${accFmt(g.until)}`,go:`accGo('ug:${g.id}','grl')`});
  });
  (st.cats||[]).forEach(c=>{if(c.status==="never")out.push({key:"c-never:"+c.id,k:"group",sev:1,text:`${i18n("Каталог")} ${escHtml(c.n)} ${i18n("ни разу не синхронизировался")}`,go:`accGo('cat:${c.id}','cgrp')`})});
  us.forEach(u=>{
    const login=escHtml(u.login);
    if(u.on&&accAcctExpired(u))out.push({key:"u-acct:"+u.id,k:"user",sev:1,text:`${login}: ${i18n("срок учётной записи истёк")} ${accFmt(u.expires)}`,go:`accGo('user:${u.id}')`,act:[i18n("Выключить"),`accUserOn('${u.id}')`]});
    else if(u.on&&accAcctSoon(u))out.push({key:"u-acctsoon:"+u.id,k:"user",sev:0,text:`${login}: ${i18n("срок учётной записи истекает")} ${accFmt(u.expires)}`,go:`accGo('user:${u.id}')`});
    if(accUserActive(u)&&!accUserRoles(u,true,st).length)out.push({key:"u-noroles:"+u.id,k:"user",sev:2,text:`${login}: ${i18n("нет действующих ролей, войти не сможет")}`,go:`accGo('user:${u.id}')`,act:[i18n("Выключить"),`accUserOn('${u.id}')`]});
    u.roles.forEach(id=>{
      if(accDirExpired(u,id))out.push({key:"u-exp:"+u.id+":"+id,k:"user",sev:1,text:`${login}: ${i18n("срок роли")} «${escHtml(accRoleName(id))}» ${i18n("истёк")} ${accFmt(accDirUntil(u,id))}`,go:`accGo('user:${u.id}')`,act:[i18n("Снять роль"),`accAssign('${u.id}','${id}',false)`]});
      else if(accDirSoon(u,id))out.push({key:"u-soon:"+u.id+":"+id,k:"user",sev:0,text:`${login}: ${i18n("роль")} «${escHtml(accRoleName(id))}» ${i18n("истекает")} ${accFmt(accDirUntil(u,id))}`,go:`accGo('user:${u.id}')`});
    });
    if(accUserActive(u)&&accUserRoles(u,true,st).length&&accStale(u)&&u.login!==ACC_ME)out.push({key:"u-stale:"+u.id,k:"user",sev:1,text:`${login}: ${i18n("не входил")} ${accAgo(u.last)}`,go:`accGo('user:${u.id}')`,act:[i18n("Выключить"),`accUserOn('${u.id}')`]});
  });
  const admins=us.filter(u=>accUserRoles(u,true,st).some(id=>accRole(id,st)?.g.unr));
  if(admins.length===1)out.push({key:"one-admin",k:"user",sev:2,text:`${i18n("Неограниченный доступ только у")} ${escHtml(admins[0].login)}: ${i18n("при потере пароля систему некому будет восстановить")}`,go:`accGo('role:adm','members')`});
  return out.sort((a,b)=>b.sev-a.sev);
}
function accCheckUI(){
  const srvIss=accIssues(accSrv()),edIss=accIssues(),edKeys=new Set(edIss.map(x=>x.key)),srvKeys=new Set(srvIss.map(x=>x.key));
  // Строки с сервера; решённые в черновике остаются зачёркнутыми, новые из
  // черновика помечены — пока не нажато «Применить», ничего не изменилось.
  const list=[...srvIss.map(x=>({...x,done:!edKeys.has(x.key)})),...edIss.filter(x=>!srvKeys.has(x.key)).map(x=>({...x,fresh:true}))].sort((a,b)=>b.sev-a.sev||(a.done?1:0)-(b.done?1:0));
  const sec=(title,k)=>{const l=list.filter(x=>x.k===k);if(!l.length)return"";
    return card(`${i18n(title)} (${l.filter(x=>!x.done).length})`,`<div class="acc-issues">${l.map(x=>`<div class="acc-issue sev${x.sev} ${x.done?"done":""}"><span class="acc-issue-dot"></span><button type="button" class="lk" onclick="${x.go}">${x.text}</button>${x.done?`<span class="acc-chip sm">${i18n("решено в черновике")}</span>`:x.fresh?`<span class="acc-chip warn sm">${i18n("появится после применения")}</span>`:""}${x.act&&!x.done?`<button type="button" class="btn s" onclick="${x.act[1]}">${x.act[0]}</button>`:""}</div>`).join("")}</div>`)};
  paintMain(mainHd("",i18n("Права"),ACC_SUB,accListTabs(),accActsHtml())
    +`<div class="sc">${list.length?`<p class="acc-hint">${i18n("Что не используется, истекло или не сходится. Красное мешает людям работать, жёлтое стоит прибрать, серое — на заметку. Действия отсюда идут в черновик")}</p>`:`<div class="nt ok">${i18n("Всё сходится: роли назначены, сроки не истекли, забытых учётных записей нет")}</div>`}
      ${sec("Пользователи и назначения","user")}${sec("Группы пользователей и каталоги","group")}${sec("Роли","role")}</div>`);
}

// ── Вкладка «Доступ» в карточке камеры («Оборудование») ──
// Обратный вопрос: кто видит эту камеру и почему. Считается по действующим
// ролям каждого пользователя.
function accCamAccessHtml(n){
  accData();accGroupCache.clear();accObjGroupCache.clear();accObjCache.clear();
  const dom=deviceDomain(n.id);
  if(!dom)return`<div class="nt">${i18n("Камера не в домене: права на неё не считаются")}</div>`;
  const rows=accUsers().map(u=>({u,e:accEff(u,n.id,dom)}));
  const vis=rows.filter(x=>accUserActive(x.u)&&accVisible("cam",x.e.lv));
  const items=(accCamOnly?vis:rows).sort((a,b)=>accRank("cam",b.e.lv)-accRank("cam",a.e.lv)||a.u.login.localeCompare(b.u.login));
  window._accCam=items;
  const gs=accObjGroups(n.id,dom);
  const roleRows=accRoles().map(r=>({r,x:accRoleCam(r,n.id,dom)}));
  return`<div class="nt">${i18n("Папки камеры:")} ${gs.map(id=>`<button type="button" class="lk" onclick="goApp('acc');accGo('grp:${id}','rights')">${escHtml(accGroupName(id))}</button>`).join(", ")}. ${i18n("Видят")} <b>${vis.length}</b> ${i18n("из")} ${rows.length} ${plural(rows.length,"пользователя|пользователей|пользователей")}</div>
    ${card("Кто видит камеру",`<div class="acc-bar" style="margin-bottom:8px"><label class="acc-chk"><input type="checkbox" ${accCamOnly?"checked":""} onchange="accCamOnly=this.checked;gear()"> ${i18n("Только те, кто видит")}</label></div>
      ${items.length?`<table class="acc-tbl"><tr><th>${i18n("Пользователь")}</th><th>${i18n("Доступ")}</th><th>${i18n("Откуда")}</th><th></th></tr>${items.map((x,i)=>`<tr class="${accUserActive(x.u)?"":"off"}"><td><button type="button" class="lk" onclick="goApp('acc');accGo('user:${x.u.id}','access')">${escHtml(x.u.login)}</button> <span class="sub">${escHtml(x.u.name)}</span>${accUserActive(x.u)?"":` ${accUserStateHtml(x.u)}`}</td>
        <td><span class="acc-lv ${accVisible("cam",x.e.lv)?"":"no"}">${accLv("cam",x.e.lv)}</span></td><td class="sub">${x.e.best?`${i18n("роль")} «${escHtml(x.e.best.r.n)}»: `:""}${accSrcText(x.e.best)}</td>
        <td><button type="button" class="ch-act" onclick="accCamWhy(this,${i})">${i18n("Почему так")}</button></td></tr>`).join("")}</table>`:`<p class="sub">${i18n("Камеру не видит никто")}</p>`}`)}
    ${card("По ролям",`<table class="acc-tbl"><tr><th>${i18n("Роль")}</th><th>${i18n("Доступ")}</th><th>${i18n("Откуда")}</th></tr>${roleRows.map(({r,x})=>`<tr><td><button type="button" class="lk" onclick="goApp('acc');accRevealDomain('${dom}');accGo('role:${r.id}','${x.src.k==="obj"?"objects":x.src.k==="grp"?"groups":x.src.k==="def"?"defs":"global"}')">${escHtml(r.n)}</button></td><td><span class="acc-lv ${accVisible("cam",x.lv)?"":"no"}">${accLv("cam",x.lv)}</span></td><td class="sub">${accSrcText({r,...x})}</td></tr>`).join("")}</table>`)}`;
}
function accCamWhy(el,i){
  const x=(window._accCam||[])[i];if(!x)return;
  const lines=x.e.levels.map(l=>`<li>${i18n("Роль")} «${escHtml(l.r.n)}»: <b>${accLv("cam",l.lv)}</b> — ${accSrcText(l)}</li>`).join("");
  accMenuOpen(el,`<div class="acc-why"><b>${escHtml(x.u.login)}</b><ul>${lines||`<li>${i18n(accUserActive(x.u)?"нет действующих ролей":"учётная запись не действует")}</li>`}</ul><p>${i18n("Итог — наибольший по ролям:")} <b>${accLv("cam",x.e.lv)}</b></p></div>`);
}

// ── Общее для боковых окон ──
function accDrawer(id,title,raw){  // raw — заголовок уже собран из переведённых частей
  if(!document.getElementById(id)){
    document.body.insertAdjacentHTML("beforeend",`<div class="mask" id="${id}" onclick="if(event.target===this)accMaskClick('${id}')">
      <div class="dr acc-wiz" onclick="event.stopPropagation()"><div class="dh"><b id="${id}T"></b><span class="dev-step-n" id="${id}N"></span><button class="btn s" style="margin-left:auto" onclick="accDrawerClose('${id}')">✕</button></div>
      <div class="acc-st" id="${id}St"></div><div class="db" id="${id}Bd"></div><div class="df" id="${id}Ft"></div></div></div>`);
  }

// Клик мимо окна закрывает его, но не окно импорта с вставленным текстом.
function accMaskClick(id){if(id==="accImp"&&accIm&&accIm.text.trim())return;accDrawerClose(id)}
function accDrawerOpen(id){return!!document.getElementById(id)?.classList.contains("open")}
function accDrawerClose(id){
  const el=document.getElementById(id);if(!el)return;
  el.classList.remove("open");
  // Тело очищаем: иначе одинаковые id полей двух окон мешали бы живой проверке.
  document.getElementById(id+"Bd").innerHTML="";
  if(id==="accWiz")accWz=null;if(id==="accUd")accUd=null;if(id==="accBulk")accBk=null;if(id==="accImp")accIm=null;if(id==="accAdd")accAd=null;if(id==="accUg")accUgd=null;if(id==="accGm")accGm=null;if(id==="accCg")accCg=null;if(id==="accCt")accCt=null;
}
const ACC_PWD_MIN=8;
function accPwdRulesOf(pwd,login){
  const l=login.trim().toLowerCase();
  return[[`${i18n("не короче")} ${ACC_PWD_MIN} ${i18n("знаков")}`,pwd.length>=ACC_PWD_MIN],
    [i18n("хотя бы одна буква и одна цифра"),/\p{L}/u.test(pwd)&&/\d/.test(pwd)],
    [i18n("без логина внутри"),!l||!pwd.toLowerCase().includes(l)]];
}
function accPwdRulesHtmlOf(pwd,login){return accPwdRulesOf(pwd,login).map(([t,ok])=>`<span class="${pwd?(ok?"ok":"bad"):""}">${ok&&pwd?"✓":"•"} ${t}</span>`).join("")}
function accGenPwd(){
  const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ",d="23456789";
  let p="";for(let i=0;i<10;i++)p+=(i%4===3?d:a)[Math.floor(Math.random()*(i%4===3?d:a).length)];
  return p;
}
const taken=(list,v)=>list.some(x=>x.trim().toLowerCase()===v.trim().toLowerCase());
function accLoginIssue(login){
  if(!login.trim())return"Заполните поле";
  if(/\s/.test(login)||login.length>64)return"Логин — без пробелов, не длиннее 64 знаков";
  if(taken(accUsers().map(u=>u.login),login))return"Логин уже занят";
  return null;
}
function accEmailIssue(email){return email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())?"Проверьте e-mail: нужен адрес вида name@example.com":null}
function accPwdIssue(pwd,login){return!pwd?"Заполните поле":accPwdRulesOf(pwd,login).some(x=>!x[1])?"Пароль не подходит по политике":null}
function accPwdFieldHtml(w,setFn,genFn,toggleFn,errFn){
  return`<div class="acc-wz-f" style="margin-top:12px"><label>${i18n("Пароль")}</label>
      <div class="acc-pwd"><input type="${w.show?"text":"password"}" value="${escHtml(w.pwd)}" autocomplete="new-password" oninput="${setFn}">
        <button type="button" class="btn s" onclick="${toggleFn}">${i18n(w.show?"Скрыть":"Показать")}</button>
        <button type="button" class="btn s" onclick="${genFn}">${i18n("Сгенерировать")}</button></div>
      <div class="acc-rules" id="accPwdRules">${accPwdRulesHtmlOf(w.pwd,w.login)}</div>${errFn("pwd")}
      <label class="acc-chk" style="margin-top:8px"><input type="checkbox" ${w.must?"checked":""} onchange="${w===accWz?"accWz":"accUd"}.must=this.checked"> ${i18n("сменить при первом входе")}</label>
      <p class="acc-hint" style="margin-top:8px">${i18n("Пароль не отображается после создания; передайте его пользователю безопасным способом")}</p></div>`;
}

// ── Мастер «Новая роль» ──
// Роль → Права → Кому → Итог. Сначала — что роль даёт, потом — кому; людей
// можно не назначать вовсе («Пока никому»): их добавляют потом на странице
// роли. Всё попадает в черновик, как и остальные правки; на сервер — через
// общее «Применить…» с последствиями.
const ACC_WZ=[["role","Роль"],["rights","Права"],["user","Кому"],["plan","Итог"]];
let accWz=null;
// Основа роли выбирается на первом шаге: пустая, встроенный шаблон или
// существующая роль. При переданном id мастер сразу заполняется этой ролью.
function accWzOpen(rid){
  accMenuClose();accData();
  accWz={step:0,tried:new Set(),name:"",comment:"",tz:0,sup:{role:"",login:false,export:false},who:"none",login:"",uname:"",email:"",on:true,pwd:"",show:false,must:true,until:"",expires:"",
    assigned:new Set(),ugs:new Set(),pk:{tab:"groups",q:"",chip:"all"},base:"",baseName:"",lostGrp:0,skipUnr:false,g:accNoRights(),grp:{},snapG:null,snapGrp:null};
  const src=typeof rid==="string"?accRole(rid):null;
  if(src){accWzFill("role:"+src.id);let n=`${src.n} (${i18n("копия")})`,k=2;while(accRoles().some(x=>x.n===n))n=`${src.n} (${i18n("копия")} ${k++})`;accWz.name=n}else accWzFill("");
  accDrawer("accWiz","Новая роль");
  accWzRender();
}
function accWzIsOpen(){return accDrawerOpen("accWiz")}
function accWzClose(){accDrawerClose("accWiz")}
function accWzErrs(){
  const w=accWz,e={};
  if(!w.name.trim())e.name="Заполните поле";
  else if(taken(accRoles().map(r=>r.n),w.name))e.name="Роль с таким именем уже есть";
  if(w.who==="new"){
    e.login=accLoginIssue(w.login);e.email=accEmailIssue(w.email);e.pwd=accPwdIssue(w.pwd,w.login);
    if(w.expires&&accDays(w.expires)<0)e.expires="Срок уже прошёл";
  }else if(w.who==="pick"&&!w.assigned.size&&!w.ugs.size)e.assigned="Выберите группы или пользователей — или «Пока никому»";
  if((w.who==="new"||w.who==="pick"&&w.assigned.size)&&w.until&&accDays(w.until)<0)e.until="Срок уже прошёл";
  return e;
}
const ACC_WZ_FIELDS={role:["name"],user:["login","email","pwd","assigned","until","expires"],rights:[],plan:[]};
function accWzBlocked(step){const e=accWzErrs();return ACC_WZ_FIELDS[step].some(k=>e[k])}
function accErr(k){const st=ACC_WZ[accWz.step][0],e=accWz.tried.has(st)?accWzErrs()[k]:"";return`<div class="fld-err" id="accE_${k}">${e?i18n(e):""}</div>`}
// Живая проверка без перерисовки: поле не теряет фокус и курсор.
function accWzLive(){
  const st=ACC_WZ[accWz.step][0],e=accWz.tried.has(st)?accWzErrs():{};
  ACC_WZ_FIELDS[st].forEach(k=>{const el=document.getElementById("accE_"+k);if(el)el.textContent=e[k]?i18n(e[k]):""});
  const pr=document.getElementById("accPwdRules");if(pr)pr.innerHTML=accPwdRulesHtmlOf(accWz.pwd,accWz.login);
}
function accWzSet(k,v){accWz[k]=v;accWzLive()}
function accWzRender(){
  const w=accWz;if(!w)return;
  const st=ACC_WZ[w.step][0];
  document.getElementById("accWizN").textContent=`${i18n("Шаг")} ${w.step+1} ${i18n("из")} ${ACC_WZ.length} · ${i18n(ACC_WZ[w.step][1])}`;
  document.getElementById("accWizSt").innerHTML=ACC_WZ.map(([id,t],i)=>`<div class="acc-stp ${i<=w.step?"on":""} ${i===w.step?"cur":""}"><i></i><span>${i+1}. ${i18n(t)}</span></div>`).join("");
  document.getElementById("accWizBd").innerHTML={role:accWzRole,user:accWzUser,rights:accWzRights,plan:accWzPlan}[st]();
  const last=w.step===ACC_WZ.length-1;
  document.getElementById("accWizFt").innerHTML=`<button class="btn" onclick="accWzClose()">${i18n("Отмена")}</button>
    ${w.step?`<button class="btn" onclick="accWz.step--;accWzRender()">${i18n("Назад")}</button>`:""}
    <button class="btn pri" style="margin-left:auto" onclick="accWzNext()">${i18n(last?"В черновик":w.step===ACC_WZ.length-2?"Далее: итог →":"Далее →")}</button>`;
}
function accWzNext(){
  const w=accWz,st=ACC_WZ[w.step][0];
  w.tried.add(st);
  if(accWzBlocked(st)){accWzRender();document.querySelector("#accWizBd .fld-err:not(:empty)")?.parentElement?.querySelector("input")?.focus();return}
  if(st==="plan"){accWzApply();return}
  w.step++;accWzRender();
}
function accWzRole(){
  const w=accWz,sup=w.sup;
  return`<div class="acc-wz-f"><label>${i18n("Имя роли")}</label><input type="text" value="${escHtml(w.name)}" placeholder="${i18n("Например, Диспетчер")}" oninput="accWzSet('name',this.value)">${accErr("name")}</div>
    ${accWzBaseHtml()}
    <div class="acc-wz-f"><label>${i18n("Комментарий")}</label><input type="text" value="${escHtml(w.comment)}" oninput="accWz.comment=this.value"></div>
    <div class="acc-wz-f"><label>${i18n("Расписание входа")}</label><select onchange="accWz.tz=+this.value">${ACC_TZ.map((t,i)=>`<option value="${i}" ${i===w.tz?"selected":""}>${i18n(t)}</option>`).join("")}</select>
      <p class="acc-hint" style="margin-top:6px">${i18n("Вне расписания пользователи роли не смогут войти. Срок, после которого роль перестаёт действовать, задаётся назначению на шаге «Кому»")}</p></div>

      ${sup.role?`<div class="acc-chips" style="margin-top:6px"><label class="acc-chk"><input type="checkbox" ${sup.login?"checked":""} onchange="accWz.sup.login=this.checked"> ${i18n("вход")}</label><label class="acc-chk"><input type="checkbox" ${sup.export?"checked":""} onchange="accWz.sup.export=this.checked"> ${i18n("экспорт")}</label></div>`:""}
      <p class="acc-hint" style="margin-top:6px">${i18n("Пользователь роли сможет войти или выгрузить видео только после подтверждения кем-то из выбранной роли")}</p></div>`;
}
function accWzBaseHtml(){
  const w=accWz;
  const tpls=Object.entries(ACC_TPL).map(([k,v])=>`<option value="tpl:${k}" ${w.base==="tpl:"+k?"selected":""}>${i18n(v[0])}</option>`).join("");
  const roles=accRoles().map(r=>`<option value="role:${r.id}" ${w.base==="role:"+r.id?"selected":""}>${escHtml(r.n)}</option>`).join("");
